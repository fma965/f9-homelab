# Technical documentation (admins only), served at https://help.f9.casa/technical/
# Authelia denies /technical/ for everyone outside the admin group.
site_name: F9 Technical Docs
site_description: How the F9 homelab is built and run
site_url: https://help.f9.casa/technical/
docs_dir: technical
use_directory_urls: true

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Platform:
      - Architecture: architecture.md
      - Kubernetes & Flux: kubernetes.md
      - Docker host (TrueNAS): docker-host.md
      - Networking & DNS: networking.md
      - Storage & backups: storage-backups.md
  - Security:
      - Authentication & access: authentication.md
      - Secrets: secrets.md
  - Operations:
      - Adding an app: adding-an-app.md
      - Service reference: service-reference.md
      - Printer & scanner: printer-scanner.md
      - Paperless AI: paperless-ai.md
      - This docs site: docs-site.md
      - Runbook: runbook.md
  - Housemate guides: https://help.f9.casa/
