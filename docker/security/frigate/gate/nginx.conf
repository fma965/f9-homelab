# Allow-list gate for Frigate. Only the three Kubernetes nodes may connect: Envoy (which
# adds Authelia) runs there, and every cluster pod appears to the NAS as its node's address.
# Anything else on the network (Main, Media, ...) gets 403. This is not a login: it only
# stops the app being reached directly, so it must stay reachable through its Envoy route.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 8080;

    allow 10.10.100.1;
    allow 10.10.100.2;
    allow 10.10.100.3;
    deny  all;

    client_max_body_size 0;

    # Docker's embedded DNS, so a recreated Frigate container is found again without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
      set $upstream http://frigate:8971;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
}
