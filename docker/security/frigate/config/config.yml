# To change settings using the UI first redeploy the docker container with RW config permission
# change ./config/config.yml:/config/config.yml:ro to ./config/config.yml:/config/config.yml:rw
mqtt:
  enabled: true
  host: 10.10.69.203
  port: 1883
  topic_prefix: frigate
  user: "{FRIGATE_MQTT_USERNAME}"
  password: "{FRIGATE_MQTT_PASSWORD}"

logger:
  default: info

database:
  path: /config/frigate.db

detectors:
  ov:
    type: openvino
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# AMD Vega iGPU (Ryzen 5500GT) for decode only - see compose.yaml. Detection
# stays on CPU above; the RTX 3060 is left alone for tdarr/llamacpp/immich.
ffmpeg:
  hwaccel_args: preset-vaapi

birdseye:
  enabled: false

objects:
  track:
    - person
    - car
    - motorcycle
    - bicycle
    - dog
    - cat

record:
  enabled: true
  # Event-only recording. 0.18 dropped the old top-level record.retain{mode,days}
  # in favor of independent continuous/motion buckets: continuous is unset (off)
  # and motion is explicitly 0, so footage is only kept around alerts and
  # detections. The Reolink NVR does the continuous recording for the front,
  # back and side cameras.
  motion:
    days: 0
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30

snapshots:
  enabled: true
  retain:
    default: 30

# Frigate's built-in go2rtc restreams each camera once, so all 4 detect/record
# inputs below read from localhost instead of hitting the cameras 4x each.
go2rtc:
  rtsp:
    username: "{FRIGATE_RTSP_USERNAME}"
    password: "{FRIGATE_RTSP_PASSWORD}"
  streams:
    doorbell:
      - rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_HOST}:8554/ch1#audio=aac
    doorbell_sub:
      - rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_HOST}:8554/ch3
    front_camera:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_HOST}/Preview_01_main
      # Opus copy of the AAC audio, for WebRTC in the browser
      - ffmpeg:front_camera#audio=opus

    front_camera_sub:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_HOST}/Preview_01_sub

    back_camera:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_HOST}/Preview_02_main
      # Opus copy of the AAC audio, for WebRTC in the browser
      - ffmpeg:back_camera#audio=opus

    back_camera_sub:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_HOST}/Preview_02_sub

    side_camera:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_HOST}/Preview_03_main
      # Opus copy of the AAC audio, for WebRTC in the browser
      - ffmpeg:side_camera#audio=opus

    side_camera_sub:
      - rtsp://{FRIGATE_REOLINK_USER}:{FRIGATE_REOLINK_PASSWORD}@{FRIGATE_REOLINK_HOST}/Preview_03_sub

    garage_camera:
      # Main RTSP stream with AAC audio for live view and recording
      - rtsp://{FRIGATE_GARAGE_USER}:{FRIGATE_GARAGE_PASSWORD}@{FRIGATE_GARAGE_HOST}/stream1#audio=aac
      # Tapo native protocol for two-way audio backchannel support (the TP-Link cloud password, not the camera account)
      - tapo://{FRIGATE_TAPO_PASSWORD}@{FRIGATE_GARAGE_HOST}

    garage_camera_sub:
      - rtsp://{FRIGATE_GARAGE_USER}:{FRIGATE_GARAGE_PASSWORD}@{FRIGATE_GARAGE_HOST}/stream2

    printer_camera:
      # Main RTSP stream with AAC audio for live view and recording
      - rtsp://{FRIGATE_PRINTER_USER}:{FRIGATE_PRINTER_PASSWORD}@{FRIGATE_PRINTER_HOST}/stream1#audio=aac
      # Tapo native protocol for two-way audio backchannel support (the TP-Link cloud password, not the camera account)
      - tapo://{FRIGATE_TAPO_PASSWORD}@{FRIGATE_PRINTER_HOST}

    printer_camera_sub:
      - rtsp://{FRIGATE_PRINTER_USER}:{FRIGATE_PRINTER_PASSWORD}@{FRIGATE_PRINTER_HOST}/stream2

  webrtc:
    candidates:
      - stun:8555
      - 10.10.68.12:8555
      # Add the NAS's LAN IP here (e.g. 10.10.x.x:8555) for reliable
      # two-way talk / low-latency live view instead of relying on STUN.

cameras:
  doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/doorbell
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/doorbell_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

    motion:
      mask: {}
  front_camera:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/front_camera?video=copy&audio=aac
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/front_camera_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect

    objects:
      mask:
        object_mask_1:
          friendly_name: Object Mask 1
          enabled: true
          coordinates: 0.077,0.985,0.054,0.705,0.058,0.501,0.077,0.282,0.096,0.181,0.194,0.131,0.428,0.135,0.451,0.173,0.573,0.158,0.999,0.676,0.999,0.008,0,0.004,0.001,0.996
  back_camera:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/back_camera?video=copy&audio=aac
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/back_camera_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect

    objects:
      mask:
        object_mask_1:
          friendly_name: Object Mask 1
          enabled: true
          coordinates: 1,0.328,1,0,0.809,0
  side_camera:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/side_camera
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/side_camera_sub?video=copy
          input_args: preset-rtsp-restream
          roles:
            - detect

    objects:
      mask:
        object_mask_1:
          friendly_name: Object Mask 1
          enabled: true
          coordinates: 0.043,0.728,0.073,0.137,0.079,0,0,0,0,0.743
  garage_camera:
    record:
      enabled: true
      motion:
        days: 14
    # PTZ over ONVIF (Tapo listens on 2020; needs the camera account and ONVIF/third-party compatibility on)
    onvif:
      host: "{FRIGATE_GARAGE_HOST}"
      port: 2020
      user: "{FRIGATE_GARAGE_USER}"
      password: "{FRIGATE_GARAGE_PASSWORD}"
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/garage_camera
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/garage_camera_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

  printer_camera:
    record:
      enabled: true
      motion:
        days: 14
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/printer_camera
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://{FRIGATE_RTSP_USERNAME}:{FRIGATE_RTSP_PASSWORD}@127.0.0.1:8554/printer_camera_sub
          input_args: preset-rtsp-restream
          roles:
            - detect

# Motion masks and zones are camera-FOV-specific - add them per camera in the
# Frigate UI (Settings -> Masks / Zones) once each stream is confirmed live.
version: 0.18-0
tls:
  enabled: false
# Frigate only applies proxy.header_map/role_map below when its own auth is
# disabled; with it on, Remote-* headers are ignored and the UI shows its own
# login. The Envoy gateway is the real gate for frigate/cctv.f9.casa: Pocket ID decides who gets in, and the route
# sets Remote-User / Remote-Groups (see network/envoy-gateway/config/externalservices.yaml).
# NOTE: this means port 8971 trusts Remote-User/Remote-Groups from anything that
# can reach it directly (LAN only, not port-forwarded). Add proxy.auth_secret
# with an X-Proxy-Secret header from Envoy, or firewall 8971, to close that.
auth:
  enabled: false
proxy:
  header_map:
    user: Remote-User
    role: Remote-Groups
    role_map:
      admin:
        - admin
      viewer:
        - home
  # A request that arrives without a role header is a viewer, not an admin.
  default_role: viewer
detect:
  enabled: true
semantic_search:
  enabled: true
genai:
  newKey:
    api_key: "{FRIGATE_OPENWEBUI_API_KEY}"
    base_url: https://ai.f9.casa/api
    provider: openai
    roles:
      - descriptions
      - chat
    model: gemma-4-12b-ha
face_recognition:
  enabled: true
lpr:
  enabled: true
review:
  genai:
    enabled: true
telemetry:
  version_check: false
camera_groups:
  Outside:
    order: 1
    icon: LuTrees
    cameras:
      - doorbell
      - front_camera
      - back_camera
      - side_camera
  3d_Printer:
    order: 2
    icon: LuPrinter
    cameras: printer_camera
  Garage:
    order: 3
    icon: LuCarFront
    cameras: garage_camera
