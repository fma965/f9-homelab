services:
  frigate:
    container_name: frigate
    hostname: frigate
    mac_address: f2:f9:00:00:68:0c
    networks:
      nasdocker:
        ipv4_address: 10.10.68.12
    image: ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
    restart: unless-stopped
    shm_size: 256mb
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    devices:
      # AMD Vega iGPU on the Ryzen 5500GT, for VAAPI-accelerated decode only.
      # Detection stays on CPU (openvino/CPU) - Vega isn't a supported ROCm
      # target, and the RTX 3060 is already shared thin by tdarr/llamacpp/immich.
      - /dev/dri:/dev/dri
    environment:
      TZ: "Europe/London"
      LIBVA_DRIVER_NAME: "radeonsi"
      # Resolved by Doco-CD from 1Password Connect (see .doco-cd.yaml's
      # external_secrets) and interpolated in here by Compose itself -
      # not read from a .env file, which Doco-CD never writes to disk.
      FRIGATE_REOLINK_HOST: ${FRIGATE_REOLINK_HOST}
      FRIGATE_REOLINK_USER: ${FRIGATE_REOLINK_USER}
      FRIGATE_REOLINK_PASSWORD: ${FRIGATE_REOLINK_PASSWORD}
      FRIGATE_DOORBELL_HOST: ${FRIGATE_DOORBELL_HOST}
      FRIGATE_DOORBELL_USER: ${FRIGATE_DOORBELL_USER}
      FRIGATE_DOORBELL_PASSWORD: ${FRIGATE_DOORBELL_PASSWORD}
      FRIGATE_OPENWEBUI_API_KEY: ${FRIGATE_OPENWEBUI_API_KEY}
      FRIGATE_RTSP_USERNAME: ${FRIGATE_RTSP_USERNAME}
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      FRIGATE_GARAGE_HOST: ${FRIGATE_GARAGE_HOST}
      FRIGATE_GARAGE_USER: ${FRIGATE_GARAGE_USER}
      FRIGATE_GARAGE_PASSWORD: ${FRIGATE_GARAGE_PASSWORD}
      FRIGATE_PRINTER_HOST: ${FRIGATE_PRINTER_HOST}
      FRIGATE_PRINTER_USER: ${FRIGATE_PRINTER_USER}
      FRIGATE_PRINTER_PASSWORD: ${FRIGATE_PRINTER_PASSWORD}
      SECRETS_ROTATED: "2026-10-14"
      FRIGATE_MQTT_USERNAME: ${FRIGATE_MQTT_USERNAME}
      FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD}
    # No `ports:` on a macvlan network: every listening port is reachable by whatever the firewall
    # lets in. 8971 is the authenticated UI/API (use this one), 8554 the go2rtc RTSP restream and 8555
    # go2rtc WebRTC. Port 5000 (internal, unauthenticated) must stay closed in the firewall.
    volumes:
      # frigate.db and logs; config.yml itself comes from git, below
      - /mnt/apps/appdata/frigate/config:/config
      - ./config/config.yml:/config/config.yml:rw
      # the CCTV dataset - 2 TiB refquota on the Archive pool (single 8 TB drive)
      - /mnt/Archive/CCTV:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

networks:
  nasdocker:
    external: true
