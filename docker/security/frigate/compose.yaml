services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.0@sha256:9678a83a76e4730ac7d9ea7428370e32ae656d6b312aaad30d6c69f3fef14d35
    restart: unless-stopped
    shm_size: 256mb
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    devices:
      # AMD Vega iGPU on the Ryzen 5500GT, for VAAPI-accelerated decode only.
      # Detection stays on CPU (openvino/CPU) - Vega isn't a supported ROCm
      # target, and the RTX 3060 is already shared thin by tdarr/llamacpp/immich.
      - /dev/dri:/dev/dri
    environment:
      TZ: "Europe/London"
      LIBVA_DRIVER_NAME: "radeonsi"
      # Resolved by Doco-CD from 1Password Connect (see .doco-cd.yaml's
      # external_secrets) and interpolated in here by Compose itself -
      # not read from a .env file, which Doco-CD never writes to disk.
      FRIGATE_REOLINK_HOST: ${FRIGATE_REOLINK_HOST}
      FRIGATE_REOLINK_USER: ${FRIGATE_REOLINK_USER}
      FRIGATE_REOLINK_PASSWORD: ${FRIGATE_REOLINK_PASSWORD}
      FRIGATE_DOORBELL_HOST: ${FRIGATE_DOORBELL_HOST}
      FRIGATE_DOORBELL_USER: ${FRIGATE_DOORBELL_USER}
      FRIGATE_DOORBELL_PASSWORD: ${FRIGATE_DOORBELL_PASSWORD}
      FRIGATE_OPENWEBUI_API_KEY: ${FRIGATE_OPENWEBUI_API_KEY}
      FRIGATE_RTSP_USERNAME: ${FRIGATE_RTSP_USERNAME}
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
      FRIGATE_GARAGE_HOST: ${FRIGATE_GARAGE_HOST}
      FRIGATE_PRINTER_HOST: ${FRIGATE_PRINTER_HOST}
      FRIGATE_TAPO_USER: ${FRIGATE_TAPO_USER}
      FRIGATE_TAPO_PASSWORD: ${FRIGATE_TAPO_PASSWORD}
    ports:
      - 8554:8554 # go2rtc RTSP restream
      - 8555:8555/tcp # go2rtc WebRTC
      - 8555:8555/udp # go2rtc WebRTC
      # Port 5000 (internal, unauthenticated) is intentionally not published.
    volumes:
      # frigate.db and logs; config.yml itself comes from git, below
      - /mnt/apps-pool/appdata/frigate/config:/config
      - ./config/config.yml:/config/config.yml:ro
      # the CCTV dataset - 1 TiB refquota on the Data pool
      - /mnt/Data/CCTV:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

  frigate-gate:
    # Allow-list gate: only the Kubernetes nodes (Envoy + Authelia) may reach the Frigate UI and API.
    # See gate/nginx.conf. The published port is IPv4 only on purpose: Docker's IPv6 proxy
    # hides the real client address, which the allow-list needs.
    image: nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
    container_name: frigate-gate
    restart: unless-stopped
    depends_on:
      - frigate
    # Skip the image entrypoint scripts, which try to edit the read-only config.
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "0.0.0.0:8971:8080"
    volumes:
      - ./gate/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
