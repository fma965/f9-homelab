services:
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:2.94.03@sha256:aaf8ef97c035c0456ef38f869ecad2cd26c685adacf24c58a0a5100644e13f69
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      TZ: "Europe/London"
      # scott:media, matches ownership of /mnt/F9/Media
      PUID: "1000"
      PGID: "3000"
      UMASK_SET: "002"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      NVIDIA_VISIBLE_DEVICES: "all"
      serverIP: "0.0.0.0"
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: "7"
      nodeName: "nas"
    volumes:
      - /mnt/apps-pool/appdata/tdarr/server:/app/server
      - /mnt/apps-pool/appdata/tdarr/configs:/app/configs
      - /mnt/apps-pool/appdata/tdarr/logs:/app/logs
      # transcode cache, kept on NVMe rather than the F9 spinning pool
      - /mnt/apps-pool/appdata/tdarr/temp:/temp
      # source library is read-only so nothing can be replaced or deleted.
      # Tdarr writes results to /output; once outputs are verified, change
      # /media to read-write to allow in-place replacement.
      - /mnt/F9/Media:/media:ro
      - /mnt/F9/Media/.tdarr-output:/output

  tdarr-gate:
    # Allow-list gate: only the Kubernetes nodes (Envoy + Authelia) may reach the Tdarr web UI.
    # See gate/nginx.conf. The published port is IPv4 only on purpose: Docker's IPv6 proxy
    # hides the real client address, which the allow-list needs.
    image: nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
    container_name: tdarr-gate
    restart: unless-stopped
    depends_on:
      - tdarr
    # Skip the image entrypoint scripts, which try to edit the read-only config.
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "0.0.0.0:8265:8080"
    volumes:
      - ./gate/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
