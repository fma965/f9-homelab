services:
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:3.01.00@sha256:5b3b8d4e54f41738d12ff71705cf8eb8e90fcbcc05209c331853aef119879992
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      TZ: "Europe/London"
      # scott:media, matches ownership of /mnt/Media/Library
      PUID: "1000"
      PGID: "3000"
      UMASK_SET: "002"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      NVIDIA_VISIBLE_DEVICES: "all"
      serverIP: "0.0.0.0"
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: "7"
      nodeName: "nas"
    ports:
      - 8265:8265
      - 8266:8266
    volumes:
      - /mnt/AI/appdata/tdarr/server:/app/server
      - /mnt/AI/appdata/tdarr/configs:/app/configs
      - /mnt/AI/appdata/tdarr/logs:/app/logs
      # transcode cache, kept on NVMe rather than the F9 spinning pool
      - /mnt/AI/appdata/tdarr/temp:/temp
      # source library is read-only so nothing can be replaced or deleted.
      # Tdarr writes results to /output; once outputs are verified, change
      # /media to read-write to allow in-place replacement.
      - /mnt/Media/Library:/media:ro
      - /mnt/Media/Library/.tdarr-output:/output
