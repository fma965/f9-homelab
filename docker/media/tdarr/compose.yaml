services:
  tdarr:
    container_name: tdarr
    image: ghcr.io/haveagitgat/tdarr:3.00.00@sha256:7ba5325ea64951181a30f2a8d5bbc4fc0985e4c275ea1d09d15491b47b4cd8d6
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      TZ: "Europe/London"
      # scott:media, matches ownership of /mnt/F9/Media
      PUID: "1000"
      PGID: "3000"
      UMASK_SET: "002"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      NVIDIA_VISIBLE_DEVICES: "all"
      serverIP: "0.0.0.0"
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: "7"
      nodeName: "nas"
    ports:
      - 8265:8265
      - 8266:8266
    volumes:
      - /mnt/apps-pool/appdata/tdarr/server:/app/server
      - /mnt/apps-pool/appdata/tdarr/configs:/app/configs
      - /mnt/apps-pool/appdata/tdarr/logs:/app/logs
      # transcode cache, kept on NVMe rather than the F9 spinning pool
      - /mnt/apps-pool/appdata/tdarr/temp:/temp
      # source library is read-only so nothing can be replaced or deleted.
      # Tdarr writes results to /output; once outputs are verified, change
      # /media to read-write to allow in-place replacement.
      - /mnt/F9/Media:/media:ro
      - /mnt/F9/Media/.tdarr-output:/output
