services:
  tdarr:
    container_name: tdarr
    hostname: tdarr
    mac_address: f2:f9:00:00:68:06
    networks:
      nasdocker:
        ipv4_address: 10.10.68.6
    image: ghcr.io/haveagitgat/tdarr:3.04.00@sha256:0ea9217f69f40e49977dbcbc0319224e625c90d808d39bf075483fe45e9612f1
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      TZ: "Europe/London"
      # scott:media, matches ownership of /mnt/Media/Library
      PUID: "1000"
      PGID: "3000"
      UMASK_SET: "002"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      NVIDIA_VISIBLE_DEVICES: "all"
      serverIP: "0.0.0.0"
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: "7"
      nodeName: "nas"
    volumes:
      - /mnt/apps/appdata/tdarr/server:/app/server
      - /mnt/apps/appdata/tdarr/configs:/app/configs
      - /mnt/apps/appdata/tdarr/logs:/app/logs
      # transcode cache, kept on the apps NVMe rather than the Media spinning pool
      - /mnt/apps/appdata/tdarr/temp:/temp
      # source library is read-only so nothing can be replaced or deleted.
      # Tdarr writes results to /output; once outputs are verified, change
      # /media to read-write to allow in-place replacement.
      - /mnt/Media/Library:/media:ro
      - /mnt/Media/Library/.tdarr-output:/output

networks:
  nasdocker:
    external: true
