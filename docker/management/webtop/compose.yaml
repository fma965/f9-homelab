services:
  webtop:
    image: lscr.io/linuxserver/webtop:debian-xfce@sha256:4ec1d3cfb8df2e6e1c9d73c25bc1c8b42947e6861c3ef6a22e68b2f4cc94699f
    container_name: webtop
    hostname: webtop
    mac_address: f2:f9:00:00:68:07
    networks:
      nasdocker:
        ipv4_address: 10.10.68.7
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - TITLE=F9 Remote
      - DRINODE=/dev/dri/renderD128
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /mnt/apps/appdata/webtop/config:/config
      - ./resources:/custom-cont-init.d:ro
    shm_size: "1gb" #optional
    restart: unless-stopped

networks:
  nasdocker:
    external: true
