services:
  webtop:
    image: lscr.io/linuxserver/webtop:debian-xfce@sha256:918aa840a4374a2eb1ab5e05aebb7c869a6fb4563eb2015b829c08fa46725b2c
    container_name: webtop
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - TITLE=F9 Remote
      - DRINODE=/dev/dri/renderD128
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /mnt/apps-pool/appdata/webtop/config:/config
      - ./resources:/custom-cont-init.d:ro
    shm_size: "1gb" #optional
    restart: unless-stopped

  webtop-gate:
    # Allow-list gate: only the Kubernetes nodes (Envoy + Authelia) may reach the webtop desktop.
    # See gate/nginx.conf. The published port is IPv4 only on purpose: Docker's IPv6 proxy
    # hides the real client address, which the allow-list needs.
    image: nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
    container_name: webtop-gate
    restart: unless-stopped
    depends_on:
      - webtop
    # Skip the image entrypoint scripts, which try to edit the read-only config.
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "0.0.0.0:3000:8080"
    volumes:
      - ./gate/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
