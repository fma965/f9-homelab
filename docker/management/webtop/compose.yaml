services:
  webtop:
    image: lscr.io/linuxserver/webtop:debian-xfce@sha256:2de7b2cb2f9e55fde54e07a83ffeb4f09cac846f1219896dd3d44de7d0aa9731
    container_name: webtop
    hostname: webtop
    mac_address: f2:f9:00:00:68:07
    networks:
      nasdocker:
        ipv4_address: 10.10.68.7
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - TITLE=F9 Remote
      - DRINODE=/dev/dri/renderD128
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /mnt/apps/appdata/webtop/config:/config
      - ./resources:/custom-cont-init.d:ro
    shm_size: "1gb" #optional
    restart: unless-stopped

networks:
  nasdocker:
    external: true
