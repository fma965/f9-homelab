services:
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    volumes:
      - /mnt/apps-pool/appdata/garage/garage.toml:/etc/garage.toml
      - /mnt/Data/S3/meta:/var/lib/garage/meta
      - /mnt/Data/S3/data:/var/lib/garage/data
    restart: unless-stopped
    ports:
      - 3900:3900
      - 3901:3901
      - 3902:3902
      - 3903:3903

  webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - /mnt/apps-pool/appdata/garage/garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"

  webui-gate:
    # Allow-list gate: only the Kubernetes nodes (Envoy + Authelia) may reach the Garage web UI.
    # See gate/nginx.conf. The published port is IPv4 only on purpose: Docker's IPv6 proxy
    # hides the real client address, which the allow-list needs.
    image: nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
    container_name: webui-gate
    restart: unless-stopped
    depends_on:
      - webui
    # Skip the image entrypoint scripts, which try to edit the read-only config.
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "0.0.0.0:3909:8080"
    volumes:
      - ./gate/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
