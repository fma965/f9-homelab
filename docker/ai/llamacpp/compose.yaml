services:
  llamacpp:
    container_name: llamacpp
    hostname: llamacpp
    mac_address: f2:f9:00:00:68:04
    networks:
      nasdocker:
        ipv4_address: 10.10.68.4
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        # limits:
        #   memory: 4G
    environment:
      TZ: "Europe/London"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      NVIDIA_VISIBLE_DEVICES: "all"
      # Resolved by Doco-CD from 1Password Connect (see .doco-cd.yaml's
      # external_secrets) and interpolated in here by Compose itself -
      # not read from a .env file, which Doco-CD never writes to disk.
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:8c219fe0367f7e794e3c69da50c5992d474077d60794a218b9e9a3b0c5aed688
    volumes:
      - /mnt/apps/appdata/llamacpp/models:/models:ro
    command: >-
      -m /models/Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
      -md /models/mtp-gemma-4-12B-it.gguf
      --mmproj /models/mmproj-Gemma4-12B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf
      --spec-type draft-mtp
      --alias gemma-4-12b-ha
      --host 0.0.0.0
      --port 8080
      --ctx-size 131072
      --context-shift
      --parallel 1
      --n-gpu-layers 999
      --flash-attn auto
      --cache-type-k q8_0
      --cache-type-v q8_0
      --reasoning off
      --jinja

networks:
  nasdocker:
    external: true
