services:
  proxmox-backup-server:
    container_name: "proxmox-backup-server"
    environment:
      TZ: "Europe/London"
    image: "ayufan/proxmox-backup-server:v4.2.0@sha256:01f685a010025233b649417a317cc175b27920cd64f0429abfdc46a0d8d2e88a"
    network_mode: "host"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    tmpfs:
      - /run
    volumes:
      - "/mnt/AI/PBS:/backups"
      - "/mnt/AI/apps-temp/appdata/pbs/etc:/etc/proxmox-backup"
      - "/mnt/AI/apps-temp/appdata/pbs/lib:/var/lib/proxmox-backup"
      - "/mnt/AI/apps-temp/appdata/pbs/logs:/var/log/proxmox-backup"
