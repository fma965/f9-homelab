services:
  # Scanner's physical Scan button: scans the feeder (duplex) into a PDF in the
  # Paperless consumption dir.
  scanbutton:
    build:
      context: .
    container_name: "scanbutton"
    hostname: scanbutton
    mac_address: f2:f9:00:00:68:08
    networks:
      nasdocker:
        ipv4_address: 10.10.68.8
    entrypoint: ["/opt/brother/scanner/brscan-skey/brscan-skey", "-f"]
    environment:
      TZ: "Europe/London"
    privileged: true
    restart: "unless-stopped"
    tty: true
    volumes:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/mnt/Vault/Documents/incoming:/output"

networks:
  nasdocker:
    external: true
