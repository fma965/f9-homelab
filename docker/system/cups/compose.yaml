services:
  cups:
    container_name: "cups"
    devices:
      - "/dev/ricoh_printer:/dev/ricoh_printer"
    environment:
      TZ: "Europe/London"
      # Resolved by Doco-CD from 1Password Connect (see .doco-cd.yaml's
      # external_secrets) and interpolated by Compose itself.
      ADMIN_PASSWORD: ${CUPS_ADMIN_PASSWORD}
    image: "ydkn/cups@sha256:3e7c2ddeb6bc47fd920cff7978829ba48d4ef10a18f46773055ca3c2ea4bc29f"
    network_mode: "bridge"
    ports:
      - "631:631/tcp"
    privileged: "true"
    restart: "unless-stopped"
    volumes:
      - "/mnt/apps-pool/appdata/cups:/etc/cups"
      - "/var/run/dbus:/var/run/dbus"
      - "/dev/bus/usb:/dev/bus/usb"
