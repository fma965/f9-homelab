[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[settings]
disable_tools = ["1password-cli"]

[tools]
"1password-cli" = "2.35.0"
actionlint = "1.7.12"
cloudflared = "2026.10.0"
flux2 = "2.9.6"
gh = "2.102.0"
"github:home-operations/flate" = "v0.6.5"
"github:mitsuhiko/minijinja" = "2.24.0"
"github:postfinance/topf" = "v0.6.1"
gum = "2.0.2"
helm = "4.3.0"
helmfile = "1.8.1"
jq = "1.8.2"
just = "1.58.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.2"
lefthook = "2.2.0"
node = "26.10.0"
oxfmt = "0.70.0"
shellcheck = "0.11.0"
talos = "1.14.2"
yq = "4.54.1"
zizmor = "1.30.1"
