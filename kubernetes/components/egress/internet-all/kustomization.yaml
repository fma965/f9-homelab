---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Opts the app's pods in to the `internet-all` egress profile (The public internet on any port, private ranges excluded.) by labelling them
# `egress.cilium.io/internet-all: "true"`. For HelmReleases of the bjw-s app-template chart; other charts
# set their own pod-label value instead (see README.md).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        values:
          defaultPodOptions:
            labels:
              egress.cilium.io/internet-all: "true"
