---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Opts the app's pods in to the `dragonfly` egress profile (The shared Dragonfly (6379).) by labelling them
# `egress.cilium.io/dragonfly: "true"`. For HelmReleases of the bjw-s app-template chart; other charts
# set their own pod-label value instead (see README.md).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        values:
          defaultPodOptions:
            labels:
              egress.cilium.io/dragonfly: "true"
