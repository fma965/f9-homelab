---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Pod Security Admission: warn and audit against `baseline`, enforce nothing yet.
# Add `enforce: baseline` here once the audit log and warnings are clean (M24).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: _
        labels:
          pod-security.kubernetes.io/warn: baseline
          pod-security.kubernetes.io/audit: baseline
