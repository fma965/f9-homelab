---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  # An explicit list REPLACES kopiur's default ignore set; /lost+found is the only
  # default that matters on these Linux PVCs. Override per app with
  # KOPIUR_IGNORE_RULES: "[/lost+found, /.cache/*]" (patterns anchored at the PVC root).
  files:
    ignoreRules: ${KOPIUR_IGNORE_RULES:=[/lost+found]}
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
  # Verification is opt-in; without it Kopiur's doctor reports every policy as "Never verified (Degraded)".
  # quick: weekly blob-level check of the latest snapshot plus a 5% sample of its files. deep: a monthly
  # scratch restore (the test that proves a snapshot can actually be restored), into a scratch volume sized
  # like the app's backup cache. Jitter spreads the runs so the 19 policies do not all start together.
  verification:
    quick:
      schedule:
        cron: "0 4 * * 0"
        jitter: 2h
        timezone: Europe/London
    deep:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      schedule:
        cron: "0 5 1 * *"
        jitter: 6h
        timezone: Europe/London
    verifyFilesPercent: 5
