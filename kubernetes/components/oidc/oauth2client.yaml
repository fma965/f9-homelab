---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
# The Pocket ID side of a route gated by the gateway's OIDC filter (see securitypolicy.yaml). The operator
# creates the client in Pocket ID and writes ${APP}-oidc-credentials next to it, with the secret under
# `client-secret` (the key Envoy Gateway reads). The client id is declared so the SecurityPolicy can name it.
# Only members of OIDC_GROUP get a token: the default is `admins`; set OIDC_GROUP in the Flux Kustomization to
# use another group (it must exist in Pocket ID: see kubernetes/apps/security/pocket-id/app/groups.yaml).
# OIDC_HOST is the route's hostname when it is not ${APP}.f9.casa. OIDC_TITLE and OIDC_DESCRIPTION are the name and
# one-line description people see in Pocket ID (its apps page and the sign-in screens); the title defaults to ${APP}.
# OIDC_ICON is the name of an icon in homarr-labs/dashboard-icons (webp, via jsDelivr) that the operator downloads once and
# uploads; OIDC_ICON_DARK is its dark-mode variant (default: the same icon). With neither set the Pocket ID logo is used.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: ${APP}
spec:
  allowedUserGroups:
    - groupName: ${OIDC_GROUP:=admins}
  callbackUrls:
    - https://${OIDC_HOST:=${APP}.f9.casa}/oauth2/callback
  clientID: ${APP}
  description: ${OIDC_DESCRIPTION:=}
  launchUrl: https://${OIDC_HOST:=${APP}.f9.casa}/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/${OIDC_ICON_DARK:=${OIDC_ICON:=pocket-id}}.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/${OIDC_ICON:=pocket-id}.webp
  name: ${OIDC_TITLE:=${APP}}
  secret:
    keys:
      clientSecret: client-secret
  skipConsent: true
