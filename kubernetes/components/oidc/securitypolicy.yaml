---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Gate a route with the gateway's OIDC filter against Pocket ID, instead of Authelia's forward-auth (the
# `ext-auth` component). Pocket ID has one issuer for every client (https://id.f9.casa). The endpoints are set
# here so the Envoy Gateway controller does not have to fetch the discovery document, which its network policy
# does not allow; they are the ones in Pocket ID's discovery document (/.well-known/openid-configuration).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}
spec:
  oidc:
    provider:
      issuer: https://id.f9.casa
      authorizationEndpoint: https://id.f9.casa/authorize
      tokenEndpoint: https://id.f9.casa/api/oidc/token
      endSessionEndpoint: https://id.f9.casa/api/oidc/end-session
    clientID: ${APP}
    clientSecret:
      name: ${APP}-oidc-credentials
    redirectURL: https://${OIDC_HOST:=${APP}.f9.casa}/oauth2/callback
    logoutPath: /logout
    refreshToken: true
  targetRefs:
    - group: ${OIDC_GROUP_KIND:=gateway.networking.k8s.io}
      kind: ${OIDC_KIND:=HTTPRoute}
      name: ${OIDC_TARGET:=${APP}}
