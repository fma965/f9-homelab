---
# Inputs that exist only in the cluster, for `flate` (it renders offline, and since 0.7 a Kustomization whose
# `substituteFrom` Secret it cannot read is blocked and `flate test` fails). Dummy values: they only satisfy the
# references, never reach the cluster, and never appear as render targets. Used through `--supply`
# (see AGENTS.md) or FLATE_SUPPLY (.mise/config.toml).
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-id-secret
  namespace: network
stringData:
  CLOUDFLARE_TUNNEL_ID: 00000000-0000-0000-0000-000000000000
---
apiVersion: v1
kind: Secret
metadata:
  name: kopiur-nc-nas-endpoint
  namespace: kopiur-system
stringData:
  NC_NAS_ENDPOINT: s3.example.invalid
