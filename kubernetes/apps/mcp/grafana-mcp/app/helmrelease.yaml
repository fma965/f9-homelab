---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grafana-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # image's `useradd -r -u 1000 -m mcp-grafana`.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/grafana/mcp-grafana
              tag: 1.6.1@sha256:f49a704a44c193894381f535646b0fca060238c678e8dc22d16f5e2174c5cef5
            args:
              - --transport=streamable-http
              - --address=0.0.0.0:8000
              # Metadata/discovery and query tools stay on; only
              # create/update-style tools (dashboards, alert rules,
              # incidents, snapshots) are refused — same read-only posture
              # as truenas-mcp until there's a reason to allow writes.
              - --disable-write
              # Defaults to loopback-only, which 421s every request through
              # the gateway (same class of issue unifi-network-mcp hit).
              # List every Host header this route can actually see instead
              # of disabling the check.
              - "--allowed-hosts=grafana-mcp.f9.casa,grafana-mcp,grafana-mcp:8000,grafana-mcp.mcp.svc.cluster.local,grafana-mcp.mcp.svc.cluster.local:8000,localhost,localhost:8000,127.0.0.1,127.0.0.1:8000"
            env:
              HOME: /tmp
              # Talk to Grafana's in-cluster service directly rather than
              # grafana.f9.casa — one fewer network hop, and doesn't depend
              # on the public route for in-cluster traffic, same reasoning
              # as truenas-mcp/unifi-network-mcp.
              GRAFANA_URL: http://grafana-service.o11y.svc.cluster.local:3000
            envFrom:
              - secretRef:
                  name: grafana-mcp-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
    service:
      app:
        primary: true
        forceRename: *app
        ports:
          http:
            primary: true
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401,404,406)"]
        hostnames:
          - "grafana-mcp.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
