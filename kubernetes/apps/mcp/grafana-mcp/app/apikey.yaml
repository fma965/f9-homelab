---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-apikey
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp-apikey
    template:
      # SecurityPolicy apiKeyAuth expects an Opaque secret keyed by client
      # ID, value is the raw key (no "Bearer " prefix).
      data:
        mcp-client: "{{ .gateway_api_key }}"
  dataFrom:
    - extract:
        key: grafana-mcp
---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana-mcp
spec:
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: grafana-mcp-apikey
    extractFrom:
      - headers:
          - x-api-key
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-mcp
