---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp-secret
    template:
      data:
        # Service account token, Viewer role — --disable-write below means
        # the write-capable tools are refused before the token's own
        # permissions would even matter, but least-privilege on both sides
        # is cheap insurance.
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .service_account_token }}"
  dataFrom:
    - extract:
        key: grafana-mcp
