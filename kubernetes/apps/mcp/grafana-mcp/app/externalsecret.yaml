---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp-secret
    template:
      data:
        # Service account token, Viewer role — --disable-write below means
        # the write-capable tools are refused before the token's own
        # permissions would even matter, but least-privilege on both sides
        # is cheap insurance.
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .service_account_token }}"
        # mcp-grafana refuses (soon: fails to start) to serve on a
        # non-loopback address with no caller auth of its own — unlike
        # unifi-network-mcp/truenas-mcp, it has a built-in bearer-token
        # gate, so use that instead of a gateway-only SecurityPolicy. That
        # would only guard the envoy-external path; anything inside the
        # cluster hitting the ClusterIP service directly would still reach
        # an unauthenticated server.
        MCP_GRAFANA_SERVER_TOKEN: "{{ .server_auth_token }}"
  dataFrom:
    - extract:
        key: grafana-mcp
