---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-network-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-network-mcp-secret
    template:
      data:
        # Local UniFi admin account — Ubiquiti SSO accounts do not
        # authenticate against the controller API.
        UNIFI_USERNAME: "{{ .username }}"
        UNIFI_PASSWORD: "{{ .password }}"
        # Optional: unlocks firewall policy ordering and a few settings
        # endpoints. May be empty, but the field must exist in the item.
        UNIFI_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: unifi-network-mcp
