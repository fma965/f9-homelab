# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# UniFi network MCP server. Only the external Envoy gateway pods may connect (3000/TCP): the
# route is on envoy-external only and nothing else in the cluster calls it. Probes come from the
# local node, which Cilium always allows. Ingress and egress (M15).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-network-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # CoreDNS replies to this pod's own lookups. They go through the kube-dns Service, so
    # Cilium treats the reverse-translated reply as new traffic to the pod and (without this
    # rule) drops it ("Policy denied DROPPED" from kube-dns in Hubble). The reply goes to an
    # ephemeral source port, so no port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
  # Access to the UniFi controller (egress.cilium.io/unifi) comes from the profile label(s) on the pod, set in the HelmRelease.
  egress:
    # Egress (M15): DNS and the UniFi controller only (unifi.internal resolves to
    # 10.10.100.254 from the cluster, port 443). Anything else this pod tries to reach is
    # dropped.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
