---
# Every MCPServer gets its own auto-generated <name>-proxy-runner
# ServiceAccount (regardless of whether spec.serviceAccount is set —
# that field only applies to the backend container, not ToolHive's own
# proxy sidecar). Live-verified: none of them can list MCPGroups by
# default, which crashes the proxy on startup with a Go panic deep in
# thv-proxyrunner's own groups.NewManager() -> newCRDManager() ->
# controller-runtime client setup. Confirmed via `kubectl auth can-i` for
# both an auto-generated SA (grafana-proxy-runner) and a custom one
# (kubernetes-mcp-readonly) - the built-in `view` ClusterRole doesn't
# cover custom resources unless the CRD opts into view-aggregation,
# which ToolHive's CRDs don't.
#
# Binding to the system:serviceaccounts:mcp group (every ServiceAccount
# in this namespace is automatically a member) instead of enumerating
# each <name>-proxy-runner SA individually - covers current and future
# servers without needing an update here each time one is added.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toolhive-proxy-runner
rules:
  - apiGroups: ["toolhive.stacklok.dev"]
    resources:
      - mcpgroups
      - mcpservers
      - mcpremoteproxies
      - mcpserverentries
      - virtualmcpservers
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: toolhive-proxy-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: toolhive-proxy-runner
subjects:
  - kind: Group
    name: system:serviceaccounts:mcp
    apiGroup: rbac.authorization.k8s.io
