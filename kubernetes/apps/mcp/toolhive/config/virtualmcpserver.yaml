---
# One MCP endpoint for every consumer (Claude.ai, Claude Code, Open WebUI/
# llama.cpp): tools from each backend are exposed with a "<workload>_"
# prefix. defaultToolVisibility is left at "allow" deliberately for this
# first migration — curating a per-server allow-list (like the read-only
# kubectl/flux/talos filters other ToolHive users run) needs a live tool
# inventory per backend, which is a follow-up, not a blocker for cutting
# over. Incoming auth is anonymous here: the LAN/WAN route is guarded by
# the Envoy SecurityPolicy API key instead (securitypolicy.yaml), one key
# per consuming client so any of them can be revoked independently.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      defaultToolVisibility: allow
    # Live-verified: with no operational config, a client's very first
    # request blocked on a synchronous full aggregation sweep across every
    # backend — measured 54s end-to-end with a couple of misbehaving
    # backends in the mix, well past what Claude.ai's connector will wait
    # for a fresh connection. best_effort + a short per-backend init cap
    # means the client gets an answer built from whichever backends are
    # actually healthy, instead of blocking on the slowest/broken one.
    operational:
      failureHandling:
        partialFailureMode: best_effort
      timeouts:
        backendInit: 5s
        default: 8s
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
    # truenas needs an explicit override — see truenas-external-auth.yaml
    # for why (its MCP server has no way to disable per-request auth).
    backends:
      truenas:
        type: externalAuthConfigRef
        externalAuthConfigRef:
          name: truenas-header-auth
  # In-memory sessions (the default) don't survive a vMCP pod restart —
  # every connected client (Claude.ai, Claude Code, Open WebUI) has to
  # reconnect from scratch on every rollout. Using the cluster's existing
  # shared Dragonfly instance (kubernetes/apps/database/dragonfly) instead
  # — it already runs with --default_lua_flags=allow-undeclared-keys,
  # which ToolHive's session-storage Lua scripts need (touches keys they
  # don't declare). No password: this cluster's Dragonfly has none
  # configured and nothing else here uses one either (see paperless,
  # immich). DB 0, same as most other consumers — isolated by the
  # "toolhive:vmcp:" key prefix rather than a dedicated DB index, matching
  # how paperless/immich/games-manager already coexist on DB 0.
  #
  # NOTE: this is session-ID persistence only, NOT the 30s in-process
  # capability-aggregation cache (pkg/vmcp/aggregator/caching_aggregator.go
  # is explicitly node-local/never-persisted by design, confirmed in
  # upstream source) — it doesn't change tool-list latency/consistency,
  # only survives pod restarts without dropping client sessions.
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    db: 0
    keyPrefix: "toolhive:vmcp:"
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
