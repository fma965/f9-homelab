---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-apikeys
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mcp-gateway-apikeys
    template:
      # SecurityPolicy apiKeyAuth expects an Opaque secret keyed by client
      # ID (one entry per consuming client), value is the raw key (no
      # "Bearer " prefix).
      data:
        claude-ai: "{{ .claude_ai_api_key }}"
        claude-code: "{{ .claude_code_api_key }}"
        open-webui: "{{ .open_webui_api_key }}"
  dataFrom:
    - extract:
        key: mcp-gateway
