---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpexternalauthconfig_v1beta1.json
# truenas-mcp intentionally has NO way to disable per-request auth in HTTP
# mode (confirmed against upstream docs) - it always requires either an
# Authorization: Bearer header or X-TrueNAS-API-Key header from the
# caller. headerInjection here does exactly that: injects
# X-TrueNAS-API-Key on every vMCP -> truenas-mcp call, sourced from
# truenas-mcp-secret so the raw key is never in this file.
#
# Correction from an earlier, wrong assumption on grafana: MCPExternalAuthConfig's
# "bearerToken" type is accepted by the CRD schema but has NO registered
# converter in toolhive-operator v0.51.4 (confirmed in source:
# pkg/vmcp/auth/converters/ has header_injection.go, token_exchange.go,
# upstream_inject.go, aws_sts.go, obo.go, xaa.go - no bearer_token.go).
# Using "bearerToken" made every VirtualMCPServer reconcile fail outright
# ("unsupported auth type: bearerToken", confirmed in operator logs),
# which silently froze the generated config at its last-good state.
# headerInjection has a real, implemented converter - using that instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: truenas-header-auth
spec:
  type: headerInjection
  headerInjection:
    headerName: X-TrueNAS-API-Key
    valueSecretRef:
      name: truenas-mcp-secret
      key: TRUENAS_API_KEY
