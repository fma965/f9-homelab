---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gateway
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == any(200,401,404,406)"]
spec:
  hostnames:
    - "mcp.f9.casa"
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: vmcp-mcp-gateway
          # Live-verified: VirtualMCPServer's Service actually listens on
          # 4483 by default (not 8080 — that's the per-MCPServer proxy
          # port convention, this is vMCP's own). Wrong port here made
          # Envoy refuse to program the route at all: HTTPRoute showed
          # ResolvedRefs=False "TCP Port 8080 not found on Service
          # mcp/vmcp-mcp-gateway", so every external request failed to
          # even reach anything.
          port: 4483
