---
# API-key auth on every MCP route (Envoy Gateway apiKeyAuth). Each
# consumer sends its own `x-api-key`, so Claude.ai / Claude Code / Open
# WebUI can each be revoked independently without rotating a shared secret.
#
# Covers both the VirtualMCPServer aggregation gateway (mcp.f9.casa, kept
# around but not the primary path — its per-session aggregation proved
# too inconsistent) and the direct per-server routes (each MCPServer's own
# httproute.yaml) that clients actually connect to instead. Same gate,
# same keys, either way in.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: mcp-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-gateway
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: flux-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ha-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kubernetes-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: paperless-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: truenas-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: unifi-network-mcp
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victoria-logs-mcp
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: mcp-gateway-apikeys
    extractFrom:
      - headers:
          - x-api-key
    sanitize: true
