---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpexternalauthconfig_v1beta1.json
# Live-verified: mcp-grafana enforces its own inbound bearer-token check
# (independent of the gateway's apiKeyAuth) and rejects every request from
# vMCP with "missing bearer token" — outgoingAuth: discovered has nothing
# to discover since grafana's MCPServer never referenced an auth config.
# The token already exists in grafana-mcp-secret (MCP_GRAFANA_SERVER_TOKEN,
# from the same 1Password item grafana-mcp itself reads to enforce it) —
# this just points vMCP at that same secret/key so it can inject it as the
# Authorization header, without ever needing the literal value.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: grafana-bearer-auth
spec:
  type: bearerToken
  bearerToken:
    tokenSecretRef:
      name: grafana-mcp-secret
      key: MCP_GRAFANA_SERVER_TOKEN
