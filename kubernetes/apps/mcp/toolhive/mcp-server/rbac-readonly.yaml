---
# Read-only ServiceAccounts for MCP servers that need Kubernetes API
# access. Bound to the built-in `view` ClusterRole — it already excludes
# Secret contents by design, and each server's own read-only tool guard
# (read_only/readonly: true) refuses mutating calls before RBAC would even
# be consulted. Belt and suspenders, not redundant: RBAC bounds what the
# tools *could* do if a future version ships a write tool without a
# matching guard; the tool-level flag bounds what today's tools attempt.
#
# flux-operator-mcp's upstream chart only offered rbac.create: true, which
# grants cluster-admin (no narrower built-in role covers Flux's own
# cross-namespace CRDs) — flagged as a real concern in PR #1835. Binding
# its ServiceAccount to `view` here instead fixes that: `view` already
# covers reading Flux's CRs (they're just Kubernetes objects), and
# readonly: true keeps the MCP tool surface read-only on top.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-readonly
    namespace: mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: flux-mcp-readonly
    namespace: mcp
