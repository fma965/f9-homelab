---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
# NOTE: PR #1840's CI failure (quoted MCP_PORT: "8000" breaking the
# bjw-s chart's port-lookup template) doesn't reproduce here — ToolHive's
# mcpPort is a plain int field, not a Helm value template. Image quality
# caveats from that PR still apply and are preserved below: this image
# builds itself from source via `uv` at container startup (needs outbound
# PyPI access to boot) and runs as root with a writable rootfs; upstream
# only publishes a floating `latest` tag, pinned here by digest.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: immich
spec:
  image: ghcr.io/joeru/claw2immich:latest@sha256:92294443194a7b9a5a4c541d962b8a517112a4e42e854067c893de220216404f
  transport: streamable-http
  mcpPort: 8000
  groupRef:
    name: mcp-tools
  env:
    - name: TZ
      value: Europe/London
    - name: IMMICH_BASE_URL
      value: http://immich.default.svc.cluster.local:2283
    # Native read-only guard — belt and suspenders alongside a
    # least-privilege API key (create it as a read-only key in Immich if
    # that option exists for your version).
    - name: IMMICH_PROFILE
      value: read_only
    - name: MCP_TRANSPORT
      value: streamable-http
    - name: MCP_HOST
      value: 0.0.0.0
    - name: MCP_PORT
      value: "8000"
    - name: MCP_LOG_LEVEL
      value: INFO
  secrets:
    - name: immich-mcp-secret
      key: IMMICH_API_KEY
      targetEnvName: IMMICH_API_KEY
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: cache
              mountPath: /.cache
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: 8000
            # uv build on cold start pulls from PyPI before the server is
            # up — generous startup budget covers it.
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
