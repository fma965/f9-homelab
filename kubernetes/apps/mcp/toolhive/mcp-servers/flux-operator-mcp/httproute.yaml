---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Direct route to this server's own ToolHive proxy, bypassing the
# VirtualMCPServer aggregation gateway (mcp.f9.casa) — that layer's
# per-session capability aggregation proved too inconsistent/slow in
# practice (variable partial tool lists, occasional full hangs), while
# every individual MCPServer proxy has been fast and reliable in every
# direct test. Same shared apiKeyAuth as the aggregation gateway
# (securitypolicy.yaml's targetRefs includes this route too).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-mcp
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == any(200,401,404,406)"]
spec:
  hostnames:
    - "flux-mcp.f9.casa"
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: mcp-flux-proxy
          port: 8080
