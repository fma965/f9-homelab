---
# flux-operator-mcp's upstream chart only offered rbac.create: true, which
# grants cluster-admin (no narrower built-in role covers Flux's own
# cross-namespace CRDs) — flagged as a real concern in PR #1835. Binding
# this ServiceAccount to the built-in `view` ClusterRole instead fixes
# that: `view` already covers reading Flux's CRs (they're just Kubernetes
# objects), and the server's own --read-only flag keeps the MCP tool
# surface read-only on top.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: flux-mcp-readonly
    namespace: mcp
