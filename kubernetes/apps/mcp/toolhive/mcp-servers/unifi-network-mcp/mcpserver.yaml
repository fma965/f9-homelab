---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-network
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.36.1@sha256:bdefa9fcc6ff075c775d84d087fa5d42f0bb1d613ed3bd8180599b875eb583ae
  transport: streamable-http
  mcpPort: 3000
  groupRef:
    name: mcp-tools
  env:
    - name: TZ
      value: Europe/London
    - name: HOME
      value: /tmp
    - name: UNIFI_HOST
      value: unifi.internal
    - name: UNIFI_PORT
      value: "443"
    - name: UNIFI_SITE
      value: default
    - name: UNIFI_VERIFY_SSL
      value: "false"
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    # DNS-rebinding protection checks the Host header; this server is now
    # reached only by vMCP in-cluster (never a raw external Host header),
    # so the risk it guards against no longer applies the way it did when
    # this had its own external route.
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
    - name: UNIFI_TOOL_REGISTRATION_MODE
      value: lazy
    - name: UNIFI_TOOL_PERMISSION_MODE
      value: confirm
  # NOTE: ToolHive's spec.secrets is x-kubernetes-list-type=map keyed on
  # `name` alone, so it can't hold multiple entries pulling different
  # keys out of the same Secret (confirmed live against ha-mcp: dry-run
  # rejected this with "duplicate entries for key [name=...]"). Using
  # envFrom in podTemplateSpec instead — a plain PodSpec field, not
  # subject to that constraint.
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          envFrom:
            - secretRef:
                name: unifi-network-mcp-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
