---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Direct route to this server's own ToolHive proxy — see flux-operator-mcp/
# httproute.yaml for why (bypassing the VirtualMCPServer aggregation
# gateway, which proved too inconsistent in practice).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == any(200,401,404,406)"]
spec:
  hostnames:
    - "kubernetes-mcp.f9.casa"
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: mcp-kubernetes-proxy
          port: 8080
