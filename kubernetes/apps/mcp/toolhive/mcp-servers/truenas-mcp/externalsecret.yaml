---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: truenas-mcp-secret
    template:
      data:
        # Consumed by vMCP's outgoingAuth (see ../../config/
        # truenas-external-auth.yaml), NOT by the truenas-mcp container
        # itself - this server explicitly refuses TRUENAS_MCP_API_KEY as
        # an env var in HTTP mode, by design (upstream: "Setting this
        # variable in HTTP mode causes a startup error").
        TRUENAS_API_KEY: "{{ .TRUENAS_API_KEY }}"
  dataFrom:
    - extract:
        key: truenas-mcp
