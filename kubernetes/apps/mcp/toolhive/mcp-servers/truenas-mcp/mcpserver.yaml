---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
# NOTE: this server has no credential/secret configured, pre-dating this
# migration — preserved as-is (not silently hardened or broken further).
# Worth a deliberate look separately: confirm whether cedricziel/truenas-mcp
# needs a TRUENAS_API_KEY at all, or relies solely on network reachability
# to nas.main.internal.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: truenas
spec:
  image: ghcr.io/cedricziel/truenas-mcp:0.4.2@sha256:1a165c9b3831b8cf546c78231857896431c27a4465d2fcb16260c7d578bbee55
  transport: streamable-http
  mcpPort: 8080
  groupRef:
    name: mcp-tools
  env:
    - name: TRUENAS_MCP_TARGET
      value: nas.main.internal:443
    - name: TRUENAS_MCP_TARGET_INSECURE
      value: "true"
    - name: TRUENAS_MCP_LISTEN
      value: ":8080"
    - name: TRUENAS_MCP_ALLOW_PLAINTEXT
      value: "true"
    - name: TRUENAS_MCP_ENABLE_WRITES
      value: "true"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Distroless, no shell — --healthcheck probes the local listener
          # and exits 0/1, standing in for curl/wget-based probes.
          livenessProbe:
            exec:
              command: [/usr/local/bin/truenas-mcp, --healthcheck]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: [/usr/local/bin/truenas-mcp, --healthcheck]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            exec:
              command: [/usr/local/bin/truenas-mcp, --healthcheck]
            periodSeconds: 10
            failureThreshold: 30
