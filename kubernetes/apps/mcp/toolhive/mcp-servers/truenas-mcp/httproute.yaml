---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Direct route to this server's own ToolHive proxy — see flux-operator-mcp/
# httproute.yaml for why (bypassing the VirtualMCPServer aggregation
# gateway, which proved too inconsistent in practice). Note: this server
# still needs its own X-TrueNAS-API-Key header per request from clients
# now that vMCP's outgoingAuth injection isn't in the path — see
# truenas-mcp/mcpserver.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas-mcp
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == any(200,401,404,406)"]
spec:
  hostnames:
    - "truenas-mcp.f9.casa"
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: mcp-truenas-proxy
          port: 8080
