---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp-secret
    template:
      data:
        # Service account token, Viewer role — --disable-write means the
        # write-capable tools are refused before the token's own
        # permissions would even matter, but least-privilege on both
        # sides is cheap insurance.
        #
        # No MCP_GRAFANA_SERVER_TOKEN here on purpose — setting one turns
        # on mcp-grafana's own inbound bearer-token gate, which requires
        # vMCP to inject that same token on every call. That injection
        # goes through spec.outgoingAuth.backends, which toolhive-operator
        # v0.51.4 accepts in the CRD but never applies to the running
        # config (confirmed live: checked the actual generated
        # config.yaml). Reference (joryirving/home-ops) runs mcp-grafana
        # the same way: no server token, trusting the same in-cluster
        # NetworkPolicy + Envoy SecurityPolicy boundary every other
        # backend already relies on instead.
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .service_account_token }}"
  dataFrom:
    - extract:
        key: grafana-mcp
