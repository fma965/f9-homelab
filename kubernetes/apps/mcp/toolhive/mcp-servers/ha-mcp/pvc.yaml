---
# ToolHive's MCPServer CRD has no persistence field — the operator manages
# the Deployment directly, so a PVC referenced from podTemplateSpec.spec
# volumes needs to exist independently, unlike the old app-template
# HelmRelease where `persistence:` created it inline.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-mcp-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 128Mi
