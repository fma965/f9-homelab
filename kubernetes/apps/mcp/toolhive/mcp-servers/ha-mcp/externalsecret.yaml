---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ha-mcp-secret
    template:
      data:
        HOMEASSISTANT_TOKEN: "{{ .homeassistant_token }}"
        # Defaults to the literal, documented path "/mcp" when unset — not
        # auto-generated. Must be set explicitly or the endpoint sits open
        # on a well-known path. Generate with `openssl rand -hex 16` and
        # store as "/private_<value>" (leading slash required).
        MCP_SECRET_PATH: "{{ .mcp_secret_path }}"
  dataFrom:
    - extract:
        key: ha-mcp
