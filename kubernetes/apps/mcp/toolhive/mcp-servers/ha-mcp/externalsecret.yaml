---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ha-mcp-secret
    template:
      data:
        HOMEASSISTANT_TOKEN: "{{ .homeassistant_token }}"
        # Live-verified: MCP_SECRET_PATH was set to a private path,
        # security-through-obscurity from when this server had its own
        # direct external route. vMCP always calls the default "/mcp" on
        # every backend and has no way to be told a per-backend custom
        # path — with the secret path set, every request 404'd. Now that
        # this server is reachable only in-cluster through vMCP (gated by
        # the Envoy SecurityPolicy apiKeyAuth + the mcp-ingress
        # NetworkPolicy), the obscurity layer is redundant, so this is
        # intentionally left unset to fall back to the documented "/mcp"
        # default.
  dataFrom:
    - extract:
        key: ha-mcp
