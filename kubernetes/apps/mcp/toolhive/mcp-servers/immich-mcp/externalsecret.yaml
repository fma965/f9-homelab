---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-mcp-secret
    template:
      data:
        # Create as a read-only-scoped key in Immich if that's an option
        # for your version — IMMICH_PROFILE=read_only above is a
        # server-side guard, not an RBAC one.
        IMMICH_API_KEY: "{{ .immich_api_key }}"
  dataFrom:
    - extract:
        key: immich-mcp
