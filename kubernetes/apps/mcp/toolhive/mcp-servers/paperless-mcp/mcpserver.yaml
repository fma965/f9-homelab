---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: paperless
spec:
  image: ghcr.io/baruchiro/paperless-mcp:2.2.1@sha256:7a793eeeb2ef9ea43175bf6b43b2179cc7c5b7e5484b6aecea8984a61d1ffe2d
  transport: streamable-http
  mcpPort: 3000
  groupRef:
    name: mcp-tools
  env:
    - name: TZ
      value: Europe/London
    - name: PAPERLESS_URL
      value: http://paperless.default.svc.cluster.local:8000
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - --http
            # Live-verified: even with PAPERLESS_API_KEY set, this server
            # still demands an inbound "Authorization: Bearer <token>"
            # from callers by default (its own server token isn't used
            # for outbound Paperless calls unless inbound auth is
            # disabled) - the same per-request injection the
            # toolhive-operator bug blocks (see grafana-external-auth.yaml).
            # --no-auth uses PAPERLESS_API_KEY purely for the server's own
            # outbound calls to Paperless and skips the inbound gate -
            # acceptable here since this pod is reachable only in-cluster
            # through vMCP, same trust boundary as every other backend.
            - --no-auth
          envFrom:
            - secretRef:
                name: paperless-mcp-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
