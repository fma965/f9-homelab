---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-mcp-secret
    template:
      data:
        # Standing credential, not the originally-intended per-request
        # injection — toolhive-operator v0.51.4 doesn't propagate
        # spec.outgoingAuth.backends into the running vMCP config (same
        # gap documented on grafana-external-auth.yaml), so per-request
        # injection isn't available yet. Accepted trade-off: a leaked pod
        # now gives out a real Paperless credential instead of just
        # proxied access. Revisit once the operator bug is fixed.
        PAPERLESS_API_KEY: "{{ .PAPERLESS_API_KEY }}"
  dataFrom:
    - extract:
        key: paperless-mcp
