---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ha-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/homeassistant-ai/ha-mcp
              tag: 8.5.0@sha256:e1538bcdadb13a5467bbb8258fba3262a05518585e18115742da638adec7057c
            command: ["ha-mcp-web"]
            env:
              TZ: Europe/London
              FASTMCP_CHECK_FOR_UPDATES: "off"
              HA_MCP_DISABLE_UPDATE_CHECK: true
              HA_MCP_CONFIG_DIR: &configDir /config
              # Service is home-assistant-app, not home-assistant — the
              # onedr0p reference deployment I copied this from names
              # theirs differently. Confirmed against `kubectl get svc -n
              # default` after the pod crashlooped on DNS resolution.
              HOMEASSISTANT_URL: http://home-assistant-app.default.svc.cluster.local:8123
              MCP_HEALTHZ: true
              MCP_HOST: 0.0.0.0
              MCP_PORT: &port 80
            envFrom:
              - secretRef:
                  name: ha-mcp-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
    service:
      app:
        primary: true
        forceRename: *app
        ports:
          http:
            primary: true
            port: *port
    # No apiKeyAuth SecurityPolicy on this route, unlike its siblings in
    # this namespace — auth here is MCP_SECRET_PATH (see externalsecret.yaml),
    # a path component the client must know. IMPORTANT: this is NOT
    # auto-generated — upstream defaults it to the literal, documented
    # path "/mcp" when unset, which is unprotected in practice once
    # MCP_HOST is 0.0.0.0. It must be explicitly set via the secret.
    # Connect the claude.ai connector to
    # https://ha-mcp.f9.casa<the MCP_SECRET_PATH value>, not the bare
    # hostname.
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401,404,406)"]
        hostnames:
          - "ha-mcp.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      # Holds tool_config.json (visibility/feature-flag settings made via
      # the web settings UI), OAuth DCR client registrations, and backup
      # settings. The auth path itself is NOT stored here — it's the
      # fixed MCP_SECRET_PATH env var above — but losing this volume
      # still resets in-app settings on every pod recreate, so it's
      # worth keeping even though it's small enough for a local hostpath
      # PVC rather than replicated ceph-block storage.
      config:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 128Mi
        globalMounts:
          - path: *configDir
