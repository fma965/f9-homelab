---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ha-mcp-secret
    template:
      data:
        # Long-lived access token, created under a dedicated HA user
        # (administrator recommended by upstream — the tool surface
        # includes calling services, not just reading state).
        HOMEASSISTANT_TOKEN: "{{ .homeassistant_token }}"
        # MCP_SECRET_PATH defaults to the literal, documented path "/mcp"
        # when unset — not an auto-generated one (confirmed in upstream's
        # __main__.py). Left unset, the endpoint sits open on a
        # well-known path once MCP_HOST is 0.0.0.0. Generate with:
        #   openssl rand -hex 16
        # and store as "/private_<that value>" (leading slash required).
        MCP_SECRET_PATH: "{{ .mcp_secret_path }}"
  dataFrom:
    - extract:
        key: ha-mcp
