# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# ExternalDNS for UniFi (internal records, through the unifi webhook sidecar). Egress only (M15,
# 15 Oct 2026): it holds a UniFi API key, so it may reach DNS, the Kubernetes API and the UniFi
# controller, and nothing else. Ingress is not limited here (Prometheus scrapes 7979 and 8080).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-dns
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The UniFi controller (UNIFI_HOST is https://unifi.internal), as the cluster reaches it.
    - toCIDR:
        - 10.10.100.254/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
