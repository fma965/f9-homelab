---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Envoy gateway proxies (envoy-external, envoy-internal): the public edge. Egress only (M15,
# 15 Oct 2026): they may reach the cluster (every route backend, Authelia for ext-auth, the Envoy
# controller on 18000, DNS) and the NAS (the routes that point at it: TrueNAS, Garage, Frigate,
# Tdarr, Webtop, Doco-CD), and nothing on the internet. Ingress is not limited here. Allow-list
# from the routes, the Backend / Service endpoints and Hubble on 15 Oct 2026.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/managed-by: envoy-gateway
  # The NAS routes come from the egress.cilium.io/nas profile label on the proxy pods (EnvoyProxy envoyDeployment.pod).
  egress:
    # Route backends change with every app, so allow the whole cluster (pods, nodes and the API
    # server). This also covers kube-dns.
    - toEntities:
        - cluster
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Envoy Gateway controller. Egress only (M15, 15 Oct 2026): it programs the proxies over xDS (they
# connect to it) and manages Gateway API objects, so it needs only DNS and the API server. (It
# would need GHCR only for Wasm / OCI extensions, which are not used: the EnvoyExtensionPolicy is
# inline Lua.) Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-helm
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    # Deny all egress (default-deny). DNS (allow-dns) and the egress.cilium.io profile labels add
    # what the pod needs.
    - {}
