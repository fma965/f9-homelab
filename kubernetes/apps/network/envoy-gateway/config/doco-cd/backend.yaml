---
apiVersion: v1
kind: Service
metadata:
  name: doco-cd-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6584
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: doco-cd-external
  labels:
    kubernetes.io/service-name: doco-cd-external
addressType: FQDN
endpoints:
  - addresses:
      - nas.main.internal
ports:
  - name: http
    protocol: TCP
    port: 6584
