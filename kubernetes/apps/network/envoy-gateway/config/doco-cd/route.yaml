---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: doco-cd
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: "https://doco-cd.f9.casa/v1/health"
spec:
  hostnames:
    - "doco-cd.f9.casa"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: doco-cd-external
          port: 6584
