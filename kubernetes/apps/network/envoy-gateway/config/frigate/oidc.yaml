---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: frigate
spec:
  oidc:
    provider:
      issuer: https://id.f9.casa
      authorizationEndpoint: https://id.f9.casa/authorize
      tokenEndpoint: https://id.f9.casa/api/oidc/token
      endSessionEndpoint: https://id.f9.casa/api/oidc/end-session
    clientID: frigate
    clientSecret:
      name: frigate-oidc-credentials
    redirectURL: https://frigate.f9.casa/oauth2/callback
    logoutPath: /logout
    refreshToken: true
    # Plain-text ID token cookie and profile scope, so the JWT filter below can read the user name (see
    # components/oidc-claims; this policy is a raw manifest, so the same settings are inline).
    cookieNames:
      idToken: frigate-id-token
    disableTokenEncryption: true
    scopes:
      - profile
      - email
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.f9.casa
        audiences:
          - frigate
        remoteJWKS:
          uri: https://id.f9.casa/.well-known/jwks.json
        extractFrom:
          cookies:
            - frigate-id-token
        claimToHeaders:
          - claim: preferred_username
            header: Remote-User
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: frigate
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: frigate
spec:
  allowedUserGroups:
    - groupName: admins
  callbackUrls:
    - https://frigate.f9.casa/oauth2/callback
  clientID: frigate
  description: Camera system with admin rights
  launchUrl: https://frigate.f9.casa/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/frigate-light.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/frigate.webp
  name: Frigate
  secret:
    keys:
      clientSecret: client-secret
  skipConsent: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
