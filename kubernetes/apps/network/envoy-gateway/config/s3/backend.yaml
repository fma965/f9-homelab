---
# The TrueNAS S3 API (one endpoint, no separate web UI), so one Service.
apiVersion: v1
kind: Service
metadata:
  name: s3-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: s3-external
  labels:
    kubernetes.io/service-name: s3-external
addressType: FQDN
endpoints:
  - addresses:
      - nas.homelab.internal
ports:
  - name: http
    protocol: TCP
    port: 9000
