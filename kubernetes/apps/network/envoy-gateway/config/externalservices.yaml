apiVersion: v1
kind: Service
metadata:
  name: frigate-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8971
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: frigate-external
  labels:
    kubernetes.io/service-name: frigate-external
addressType: FQDN
endpoints:
  - addresses:
      - nas.main.internal
ports:
  - name: http
    protocol: TCP
    port: 8971
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  annotations:
    gatus.home-operations.com/enabled: "true"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "frigate.f9.casa"
  rules:
    - filters:
        # Frigate's own login is off; its proxy.header_map reads Remote-User (set from the ID token by the SecurityPolicy) and
        # Remote-Groups, which the gateway sets here (a client's own value is overwritten): the route decides the role, and the
        # Pocket ID policy decides who reaches the route.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Remote-Groups
                value: admin
      backendRefs:
        - name: frigate-external
          port: 8971
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cctv
  annotations:
    gatus.home-operations.com/enabled: "true"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "cctv.f9.casa"
  rules:
    - filters:
        # Frigate's own login is off; its proxy.header_map reads Remote-User (set from the ID token by the SecurityPolicy) and
        # Remote-Groups, which the gateway sets here (a client's own value is overwritten): the route decides the role, and the
        # Pocket ID policy decides who reaches the route.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Remote-Groups
                value: home
      backendRefs:
        - name: frigate-external
          port: 8971
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: frigate
spec:
  oidc:
    provider:
      issuer: https://id.f9.casa
      authorizationEndpoint: https://id.f9.casa/authorize
      tokenEndpoint: https://id.f9.casa/api/oidc/token
      endSessionEndpoint: https://id.f9.casa/api/oidc/end-session
    clientID: frigate
    clientSecret:
      name: frigate-oidc-credentials
    redirectURL: https://frigate.f9.casa/oauth2/callback
    logoutPath: /logout
    refreshToken: true
    # Plain-text ID token cookie and profile scope, so the JWT filter below can read the user name (see
    # components/oidc-claims; this policy is a raw manifest, so the same settings are inline).
    cookieNames:
      idToken: frigate-id-token
    disableTokenEncryption: true
    scopes:
      - profile
      - email
  jwt:
    providers:
      - name: pocket-id
        issuer: https://id.f9.casa
        audiences:
          - frigate
        remoteJWKS:
          uri: https://id.f9.casa/.well-known/jwks.json
        extractFrom:
          cookies:
            - frigate-id-token
        claimToHeaders:
          - claim: preferred_username
            header: Remote-User
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: frigate
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
