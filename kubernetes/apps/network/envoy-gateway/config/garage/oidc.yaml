---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: garage
spec:
  oidc:
    provider:
      issuer: https://id.f9.casa
      authorizationEndpoint: https://id.f9.casa/authorize
      tokenEndpoint: https://id.f9.casa/api/oidc/token
      endSessionEndpoint: https://id.f9.casa/api/oidc/end-session
    clientID: garage
    clientSecret:
      name: garage-oidc-credentials
    redirectURL: https://garage.f9.casa/oauth2/callback
    logoutPath: /logout
    refreshToken: true
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: garage
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: garage
spec:
  allowedUserGroups:
    - groupName: admins
  callbackUrls:
    - https://garage.f9.casa/oauth2/callback
  clientID: garage
  description: S3 storage administration
  launchUrl: https://garage.f9.casa/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/garage.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/garage.webp
  name: Garage
  secret:
    keys:
      clientSecret: client-secret
  skipConsent: true
