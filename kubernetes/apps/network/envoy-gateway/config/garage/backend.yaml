---
# The web UI and the S3 API are separate containers on the NAS Docker network, each with its own
# address, so each gets its own Service.
apiVersion: v1
kind: Service
metadata:
  name: garage-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3909
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage-external
  labels:
    kubernetes.io/service-name: garage-external
addressType: FQDN
endpoints:
  - addresses:
      - garage-webui.docker.internal
ports:
  - name: http
    protocol: TCP
    port: 3909
---
apiVersion: v1
kind: Service
metadata:
  name: garage-s3-external
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 3900
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage-s3-external
  labels:
    kubernetes.io/service-name: garage-s3-external
addressType: FQDN
endpoints:
  - addresses:
      - garage.docker.internal
ports:
  - name: s3
    protocol: TCP
    port: 3900
