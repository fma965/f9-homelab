---
apiVersion: v1
kind: Service
metadata:
  name: garage-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3909
    - name: s3
      port: 3900
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage-external
  labels:
    kubernetes.io/service-name: garage-external
addressType: FQDN
endpoints:
  - addresses:
      - nas.main.internal
ports:
  - name: http
    protocol: TCP
    port: 3909
  - name: s3
    protocol: TCP
    port: 3900
