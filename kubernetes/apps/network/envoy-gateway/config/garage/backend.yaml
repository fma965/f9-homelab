---
# The Garage web UI, a container on the NAS Docker network. The S3 API is not published: nothing in
# the cluster uses it and the TrueNAS S3 service replaced it.
apiVersion: v1
kind: Service
metadata:
  name: garage-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3909
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage-external
  labels:
    kubernetes.io/service-name: garage-external
addressType: FQDN
endpoints:
  - addresses:
      - garage-webui.docker.internal
ports:
  - name: http
    protocol: TCP
    port: 3909
