---
apiVersion: v1
kind: Service
metadata:
  name: remote-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: remote-external
  labels:
    kubernetes.io/service-name: remote-external
addressType: FQDN
endpoints:
  - addresses:
      - webtop.docker.internal
ports:
  - name: http
    protocol: TCP
    port: 3000
