---
apiVersion: v1
kind: Service
metadata:
  name: nanokvm-external
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nanokvm-external
  labels:
    kubernetes.io/service-name: nanokvm-external
addressType: FQDN
endpoints:
  - addresses:
      - kvm.not.internal
ports:
  - name: http
    protocol: TCP
    port: 80
