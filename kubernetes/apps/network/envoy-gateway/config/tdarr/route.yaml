---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tdarr
  annotations:
    gatus.home-operations.com/enabled: "true"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "tdarr.f9.casa"
  rules:
    - backendRefs:
        - name: tdarr-external
          port: 8265
