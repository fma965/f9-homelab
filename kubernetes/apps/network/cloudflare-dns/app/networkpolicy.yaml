# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# ExternalDNS for Cloudflare (public records). Egress only (M15, 15 Oct 2026): it holds a token
# that can change the f9.casa zone, so it may reach DNS, the Kubernetes API and the Cloudflare
# API, and nothing else. Ingress is not limited here (Prometheus scrapes 7979).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflare-dns
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cloudflare-dns
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    - toFQDNs:
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
