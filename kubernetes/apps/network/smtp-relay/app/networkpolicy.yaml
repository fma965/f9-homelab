# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# SMTP relay (maddy, forwards the cluster's mail to Mailjet). Egress only (M15, 15 Oct 2026):
# the relay takes mail without a login from authelia, lldap, immich and games-manager, so a
# compromised pod must not be able to send mail anywhere but through the one provider. Ingress
# is not limited here yet; callers reach port 25 and Prometheus scrapes 8080.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smtp-relay
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
  egress:
    # DNS through Cilium's DNS proxy so the named host below can be matched.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The upstream provider: SMTP submission with STARTTLS (SMTP_SERVER, port 587).
    - toFQDNs:
        - matchName: in-v3.mailjet.com
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Egress profile `egress.cilium.io/smtp-relay`: a pod that sends mail through the relay (Authelia, LLDAP,
# Immich, Games Manager and others) carries the label instead of repeating this rule, and the relay's
# reply is allowed back in (see egress-profiles in kube-system/cilium).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: smtp-relay-egress
spec:
  endpointSelector:
    matchLabels:
      egress.cilium.io/smtp-relay: "true"
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
