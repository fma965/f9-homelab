---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: crowdsec-secret
    template:
      data:
        # Registers the bouncer named `envoy` with the LAPI on start, so the key never has to be created by hand.
        BOUNCER_KEY_ENVOY: "{{ .CROWDSEC_BOUNCER_KEY }}"
        # To enrol the LAPI in the CrowdSec console (app.crowdsec.net), add a CROWDSEC_ENROLL_KEY field to the item
        # and a line `ENROLL_KEY: "{{ .CROWDSEC_ENROLL_KEY }}"` here.
  dataFrom:
    - extract:
        key: crowdsec
