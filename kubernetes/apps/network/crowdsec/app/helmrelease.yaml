---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec
  install:
    disableSchemaValidation: true # the chart schema rejects the kubernetes acquisition source
  upgrade:
    disableSchemaValidation: true
  values:
    # The crowdsec images run as root and write to their own config and data directories, so the pods do not
    # meet the non-root, read-only-root policy. They stay unprivileged (baseline namespace) and have no ingress
    # from outside the cluster.
    container_runtime: containerd # the default (docker) mounts /var/lib/docker/containers into the agent
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
      tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    lapi:
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      metrics:
        serviceMonitor:
          enabled: true
      persistentVolume:
        config:
          storageClassName: ceph-block
        data:
          storageClassName: ceph-block
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      podLabels:
        # Console enrolment, the community blocklist and the hub (collections) are all HTTPS on the public web.
        # Narrow this to named hosts once Hubble has shown which ones it uses.
        egress.cilium.io/web: "true"
    agent:
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      hostVarLog: false
      isDeployment: true
      metrics:
        serviceMonitor:
          enabled: true
      podLabels:
        # The agent reads the proxy logs through the API server and downloads the collection from the hub.
        egress.cilium.io/kube-apiserver: "true"
        egress.cilium.io/web: "true"
      serviceAccountName: crowdsec-agent
