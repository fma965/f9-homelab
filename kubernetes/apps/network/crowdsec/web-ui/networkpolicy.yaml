# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# CrowdSec web UI (M15). It holds a LAPI login that can ban and unban addresses, so it may reach only the
# LAPI (8080) and the LAPI and agent metrics (6060), and only the external gateway may reach it (the route is
# behind Authelia). Nothing on the internet: the update check is off.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-web-ui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-web-ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Replies to the UI's own connections, which go through the crowdsec Services. Cilium evaluates the
    # reverse-translated reply as new traffic to this pod and drops it without this rule; the destination
    # is the pod's ephemeral source port, so no port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            k8s-app: crowdsec
  egress:
    # The LAPI (alerts and decisions) and the metrics of the LAPI and the agent.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            k8s-app: crowdsec
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "6060"
              protocol: TCP
