---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-bouncer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/kdwils/envoy-proxy-bouncer
      tag: v0.8.4@sha256:3c7ff986f04c5f1739989463d2e9553f0e7163f9a55d02d240ed6e794e4078f0
    config:
      bouncer:
        apiKeySecretRef:
          name: crowdsec-secret
          key: BOUNCER_KEY_ENVOY
        lapiURL: http://crowdsec-service:8080
        metrics: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      # The gateway pods connect from the pod network; the client address comes from the sanitised
      # X-Forwarded-For (EnvoyExtensionPolicy envoy-external).
      trustedProxies:
        - 10.42.0.0/16
