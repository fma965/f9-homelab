---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/o11y/kube-prometheus-stack/app
  postBuild:
    substitute:
      APP: alertmanager
      OIDC_DESCRIPTION: Alert routing
      OIDC_TARGET: kube-prometheus-stack-alertmanager
      OIDC_TITLE: Alertmanager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: o11y
  wait: false
