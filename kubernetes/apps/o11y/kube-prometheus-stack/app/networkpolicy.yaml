---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Alertmanager. Egress only (M15, 15 Oct 2026): DNS and the two notification services in its config
# (Pushover for alerts, Healthchecks for the heartbeat). Ingress is not limited here (Prometheus,
# Grafana, the silence-operator and the gateway call it). The Healthchecks host was read from the
# receiver's URL (host only).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  egress:
    - toFQDNs:
        - matchName: api.pushover.net
        - matchName: hc-ping.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Prometheus. Egress only (M15, 15 Oct 2026): it scrapes the cluster (pods, nodes, the API server) and
# the NAS exporters (node 9100, smartctl 9633, Doco-CD 9130, liquidctl 9530 on the NAS and its Docker network), and calls
# Alertmanager. Nothing else; in particular nothing on the internet. Allow-list from Hubble and the
# ScrapeConfigs on 15 Oct 2026. Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  # The NAS exporters come from the egress.cilium.io/nas profile label on the pod (prometheusSpec.podMetadata).
  egress:
    - toEntities:
        - cluster
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Prometheus operator. Egress only (M15, 15 Oct 2026): the API server and the Prometheus and
# Alertmanager pods it reloads, so the cluster and nothing else. Ingress is not limited here (the API
# server calls its admission webhook).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
  egress:
    - toEntities:
        - cluster
