---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Blackbox exporter, VPN (probes the internet through the VPN). Egress only (M15, 16 Oct 2026): deny-all on
# the pod's cluster interface (eth0). Its probes go out through the VPN (Multus interface `net1`: the routes
# send everything except a few ranges there), which Cilium does not see, so the probe path is unchanged; and
# a VPN drop cannot fall back to the node's default route, which is exactly what the probe should detect.
# DNS comes from allow-dns. Ingress is not limited here (Prometheus scrapes it).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blackbox-exporter-vpn
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: blackbox-exporter-vpn
  egress:
    - {}
