---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# VictoriaLogs (log storage). Egress only (M15, 15 Oct 2026): it only receives logs and answers
# queries, so DNS is all it may reach. Ingress is not limited here (the collectors, Grafana).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-single
  egress:
    # Deny all egress (default-deny). DNS (allow-dns) and the egress.cilium.io profile labels add
    # what the pod needs.
    - {}
