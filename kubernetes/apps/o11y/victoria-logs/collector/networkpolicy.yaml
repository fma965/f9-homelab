---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# VictoriaLogs collector (one per node, reads the container logs from the host). Egress only (M15,
# 15 Oct 2026): DNS, the API server (to label logs with pod metadata) and VictoriaLogs on 9428
# (seen in Hubble). Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs-collector
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-collector
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
