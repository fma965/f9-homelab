---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
      # Pocket ID gives every user a new subject. Grafana only falls back to the email when this is on;
      # otherwise the existing user is not found and sign-up fails on the taken login. Pocket ID has
      # signups off and its emails are set by the admin, which is what makes the lookup safe here.
      oauth_allow_insecure_email_lookup: "true"
    auth.anonymous:
      enabled: "false"
    # OIDC against Pocket ID (id.f9.casa). The client comes from GF_AUTH_GENERIC_OAUTH_CLIENT_ID and
    # _SECRET (the operator's Secret grafana-oidc-credentials). Only the Pocket ID `admins` group may sign
    # in: any other user gets no valid role and is refused (role_attribute_strict). The local admin login
    # stays as a break-glass in case Pocket ID is down.
    auth.generic_oauth:
      enabled: "true"
      name: Pocket ID
      allow_sign_up: "true"
      auto_login: "false"
      auth_url: https://id.f9.casa/authorize
      token_url: https://id.f9.casa/api/oidc/token
      api_url: https://id.f9.casa/api/oidc/userinfo
      use_pkce: "true"
      scopes: openid profile email groups
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      role_attribute_path: "contains(groups[*], 'admins') && 'Admin'"
      role_attribute_strict: "true"
      allow_assign_grafana_admin: "false"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            egress.cilium.io/gateway-external: "true"
        spec:
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-admin-password-secret
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc-credentials
                      key: client_id
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc-credentials
                      key: client_secret
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    metadata:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Observability
        gethomepage.dev/name: Grafana
        gethomepage.dev/description: "Dashboards and graphs (admin)"
        gethomepage.dev/icon: grafana
        gethomepage.dev/pod-selector: app=grafana
    spec:
      hostnames:
        - grafana.f9.casa
      parentRefs:
        - name: envoy-internal
          namespace: network
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
