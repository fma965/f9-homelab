---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "false"
    # OIDC against Authelia. Endpoints and client credentials come from GF_AUTH_GENERIC_OAUTH_*
    # (grafana-admin-password-secret). Only the Authelia `admin` group may sign in: any other user
    # gets no valid role and is refused (role_attribute_strict). The local admin login stays as a
    # break-glass in case Authelia is down.
    auth.generic_oauth:
      enabled: "true"
      name: Authelia
      allow_sign_up: "true"
      auto_login: "false"
      use_pkce: "true"
      scopes: openid profile email groups
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      role_attribute_path: "contains(groups[*], 'admin') && 'Admin'"
      role_attribute_strict: "true"
      allow_assign_grafana_admin: "false"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              envFrom:
                - secretRef:
                    name: grafana-admin-password-secret
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    metadata:
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == any(200,401)"]
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Observability
        gethomepage.dev/name: Grafana
        gethomepage.dev/description: "Dashboards and graphs (admin)"
        gethomepage.dev/icon: grafana
        gethomepage.dev/pod-selector: app=grafana
    spec:
      hostnames:
        - grafana.f9.casa
      parentRefs:
        - name: envoy-external
          namespace: network
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
