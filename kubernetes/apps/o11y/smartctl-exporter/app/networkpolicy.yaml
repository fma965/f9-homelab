---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# smartctl exporter (one pod per node, reads the disks' SMART data through the host). Egress only (M15, 16 Oct
# 2026): it makes no connections, Prometheus scrapes it, so deny-all. DNS comes from allow-dns. Ingress is not
# limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smartctl-exporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-smartctl-exporter
  egress:
    - {}
