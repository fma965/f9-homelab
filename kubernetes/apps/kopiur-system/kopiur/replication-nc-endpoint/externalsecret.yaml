---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The external S3 server's hostname, kept out of this public repository. The Flux substitution
# (postBuild.substituteFrom) reads Secrets from the Kustomization's own namespace, which is kopiur-system here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-nc-nas-endpoint
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-nc-nas-endpoint
    template:
      data:
        NC_NAS_ENDPOINT: "{{ .ENDPOINT }}"
  dataFrom:
    - extract:
        key: kopiur-nc-nas
