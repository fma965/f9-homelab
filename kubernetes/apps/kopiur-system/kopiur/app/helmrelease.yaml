---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    extraVolumes:
      - name: repo
        nfs:
          server: nas.main.internal
          path: /mnt/Boot/Kubernetes/Kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podLabels:
      egress.cilium.io/kube-apiserver: "true"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    webhook:
      podLabels:
        egress.cilium.io/kube-apiserver: "true"
    # The web console (https://kopiur.home-operations.com/ui/). No login of its own: every request is the one
    # fixed identity below, bound to view and operate backups. Only the internal gateway may reach it
    # (networkpolicy.yaml), so the home network and the VPN are the access control.
    ui:
      enabled: true
      auth:
        anonymous:
          enabled: true
          user: homelab
      podLabels:
        egress.cilium.io/kube-apiserver: "true"
      rbac:
        bindings:
          - role: user
            users: [homelab]
