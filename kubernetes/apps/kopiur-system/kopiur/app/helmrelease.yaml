---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    extraVolumes:
      - name: repo
        nfs:
          server: nas.homelab.internal
          path: /mnt/Boot/Kubernetes/Kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podLabels:
      egress.cilium.io/kube-apiserver: "true"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    webhook:
      podLabels:
        egress.cilium.io/kube-apiserver: "true"
    # The web console (https://kopiur.home-operations.com/ui/). It has no login of its own: the envoy-internal
    # gateway logs people in with Pocket ID (ui/securitypolicy.yaml), copies the username and groups from the ID
    # token into these headers and injects the shared token that proves the headers came from it. The console
    # then acts as that user, so Kubernetes RBAC decides what they may do (the bindings below).
    ui:
      enabled: true
      auth:
        # Pocket ID's `groups` claim carries the group names (`admins`); only those are forwarded to Kubernetes.
        allowedGroups: [admins]
        emailHeader: x-user-email
        # Envoy Gateway encodes a list claim as base64 JSON, and cannot be told otherwise.
        groupsFormat: base64Json
        groupsHeader: x-user-groups
        proxySecret:
          # Envoy Gateway reads only the key `credential`, so the console reads that key too.
          existingSecret: kopiur-ui-proxy-token
          key: credential
        userHeader: x-user-username
      podLabels:
        egress.cilium.io/kube-apiserver: "true"
      rbac:
        # Renders the ClusterRole `kopiur-ui-browse` (the in-snapshot file browser). It binds nobody: the
        # RoleBindings in ../browse grant it per namespace, because browsing runs a session pod that holds the
        # repository credentials and anyone who can exec into it can read them.
        browseRole: true
        # `user` = view and operate (snapshot now, restore, suspend, maintenance). The route only lets the
        # `admins` group through, so nobody else reaches the console.
        bindings:
          - role: user
            groups: [admins]
