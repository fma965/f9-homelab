---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ui-proxy-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-ui-proxy-token
    template:
      data:
        # The shared token between the gateway and the console. Envoy Gateway reads only the key `credential` and
        # sends its value as the whole header value (a bare token, no `Bearer `); the console reads the same key.
        credential: "{{ .PROXY_TOKEN }}"
  dataFrom:
    - extract:
        key: kopiur-ui
