---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Kopiur controller and webhook (operator for the app backups). Egress only (M15, 15 Oct 2026): they
# hold broad RBAC and the repository password, so they may reach DNS, the API server and the mover
# pods they start, and nothing else. Ingress is not limited here (the API server calls the webhook).
# The backup repository is an NFS volume mounted by the node, not a connection from these pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopiur
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [controller, webhook]
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    # The mover Jobs the controller starts (kopia server mode, the controller connects to them). They
    # run in the namespace of the app being backed up, hence the namespace-wide match.
    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
          matchLabels:
            app.kubernetes.io/managed-by: kopiur
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Kopiur mover Jobs (backup, restore, maintenance, snapshot delete). They run in the namespace of the
# app being backed up, so this is cluster-wide. Egress only (M15, 15 Oct 2026): a mover reads the
# app's volume and writes the repository, both through volumes, and reports progress by patching the
# Snapshot / Restore status, so it needs only DNS and the API server. Selects only pods the
# controller labels `managed-by: kopiur`; it does not change ingress or any other pod.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kopiur-mover
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kopiur
  egress:
    # The pods can sit on a control-plane node, where the API server is their own node (`host`) or
    # another control-plane node (`remote-node`).
    - toEntities:
        - host
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Kopiur web console. It trusts identity headers, so only the internal gateway (which logs people in and sets
# them, ../ui) may reach it; a pod that could call it directly could claim to be any user. Egress is the API server, from the
# egress.cilium.io/kube-apiserver label on the pod (HelmRelease ui.podLabels); it calls nothing else.
# Probes come from the local node, which Cilium always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopiur-ui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopiur
      app.kubernetes.io/component: ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
