---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
# The Pocket ID client for the console. The operator writes the Secret `kopiur-ui-oidc` next to it with `client-id`
# and `client-secret`, the keys the SecurityPolicy reads. Only the `admins` group can sign in.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kopiur-ui
spec:
  allowedUserGroups:
    - groupName: admins
  callbackUrls:
    - https://kopiur.f9.casa/oauth2/callback
  clientID: kopiur-ui
  launchUrl: https://kopiur.f9.casa/
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
    name: kopiur-ui-oidc
  skipConsent: true
