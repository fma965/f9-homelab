---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Backblaze B2 application key the off-site replication writes with. B2's S3-compatible API takes the
# key ID and key as the AWS pair. The destination's secret must live in the replication's namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-offsite
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-offsite-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kopiur-backblaze
