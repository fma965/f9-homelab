---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopia
spec:
  components:
    - ../../../../components/oidc
    - ../../../../components/zeroscaler
  dependsOn:
    - name: kopiur
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/kopiur-system/kopia/app
  postBuild:
    substitute:
      APP: kopia
      OIDC_DESCRIPTION: Backup repository browser
      OIDC_TITLE: Kopia
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kopiur-system
  wait: false
