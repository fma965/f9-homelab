---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Kopia web UI over the backup repository (internal, behind Authelia). Egress only (M15, 15 Oct 2026):
# it reads the repository from an NFS volume the node mounts, so it needs only DNS. Ingress is not
# limited here. Nothing was seen leaving the pod in a Hubble capture; the repository password is in
# its environment, so it should not be able to reach anything else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopia
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopia
  egress:
    # Deny all egress (default-deny). DNS (allow-dns) and the egress.cilium.io profile labels add
    # what the pod needs.
    - {}
