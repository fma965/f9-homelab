---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaniop
spec:
  chartRef:
    kind: OCIRepository
    name: kaniop
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - # Opt the pod in to the API-server egress profile (egress.cilium.io, M15); the chart has no pod-label value
            patch: |-
              - op: add
                path: /spec/template/metadata/labels/egress.cilium.io~1kube-apiserver
                value: "true"
            target:
              kind: Deployment
          - # The CRD hook Jobs (apply, migrate, verify) call the API server too
            patch: |-
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: _
              spec:
                template:
                  metadata:
                    labels:
                      egress.cilium.io/kube-apiserver: "true"
            target:
              kind: Job
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
