---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  values:
    # The instance, users, groups and clients are manifests in ../app (and the oidc component), not chart values.
    instance:
      enabled: false
    metrics:
      prometheusRule:
        enabled: false
    operator:
      # Automatic icons stay off: each client names its own icon (spec.logo, the oidc component's OIDC_ICON), which the
      # operator downloads from jsDelivr (allowed by name in networkpolicy.yaml).
      autoGenerateLogos: false
      labels:
        egress.cilium.io/kube-apiserver: "true"
      timezone: Europe/London
