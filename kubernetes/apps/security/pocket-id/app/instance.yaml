---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidinstance_v1alpha1.json
# Pocket ID at https://id.f9.casa (passkeys only), run by the operator in ../operator. It replaced Kanidm, which
# held this name. Public on envoy-external, like Authelia, so apps on the external gateway can send people to the
# login page. The data (SQLite) is on the `pocket-id` PVC that the kopiur backup component creates.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  analyticsDisabled: true
  appUrl: https://id.f9.casa
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: encryption-key
  image: ghcr.io/pocket-id/pocket-id:v2.18.0-distroless@sha256:138d106737498f6c20d0bec854b872bc77ec520d7a9b54502444a260a49c41cb
  labels:
    # Login and verification mail goes through the in-cluster SMTP relay.
    egress.cilium.io/smtp-relay: "true"
  persistence:
    enabled: true
    existingClaim: pocket-id
  resources:
    requests:
      cpu: 10m
    limits:
      memory: 256Mi
  route:
    enabled: true
    annotations:
      gatus.home-operations.com/endpoint: |-
        conditions: ["[STATUS] == any(200,302)"]
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: System
      gethomepage.dev/icon: pocket-id
      gethomepage.dev/name: Pocket ID
      gethomepage.dev/description: "Identity provider (passkeys)"
    hostnames:
      - id.f9.casa
    parentRefs:
      - name: envoy-external
        namespace: network
  smtp:
    from: pocket-id@f9.casa
    host: smtp-relay.network.svc.cluster.local
    port: 25
    tls: none
  timezone: Europe/London
  # The gateway pods connect from the pod network; the client address is the sanitised X-Forwarded-For.
  trustedProxies:
    enabled: true
    cidrs:
      - 10.42.0.0/16
  ui:
    appName: F9
  userManagement:
    allowUserSignups: disabled
  versionCheckDisabled: true
