---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-secret
    template:
      data:
        # Encrypts the instance's signing keys and secrets in its database. It must never change once the
        # database holds data, and it must outlive the oldest backup.
        encryption-key: "{{ .ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: pocket-id
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The profile of the `scott` user (users.yaml reads a Secret with exactly these keys). The email lives in
# 1Password because this repository is public.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-user-scott
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-user-scott
    template:
      data:
        displayName: Scott
        email: "{{ .SCOTT_EMAIL }}"
        firstName: Scott
        username: scott
  dataFrom:
    - extract:
        key: pocket-id
