---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-secret
    template:
      data:
        # Encrypts the instance's signing keys and secrets in its database. It must never change once the
        # database holds data, and it must outlive the oldest backup.
        encryption-key: "{{ .ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: pocket-id
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The profile of the `scott` user (users.yaml reads a Secret with exactly these keys). The email lives in
# 1Password because this repository is public.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-user-scott
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-user-scott
    template:
      data:
        displayName: Scott
        email: "{{ .SCOTT_EMAIL }}"
        firstName: Scott
        username: scott
  dataFrom:
    - extract:
        key: pocket-id
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The profile of the `andrew` user (users.yaml). The email is the field ANDREW_EMAIL of the 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-user-andrew
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-user-andrew
    template:
      data:
        displayName: Andrew
        email: "{{ .ANDREW_EMAIL }}"
        firstName: Andrew
        username: andrew
  dataFrom:
    - extract:
        key: pocket-id
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The profile of the `ash` user (users.yaml). The email is the field ASH_EMAIL of the 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-user-ash
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-user-ash
    template:
      data:
        displayName: Ash
        email: "{{ .ASH_EMAIL }}"
        firstName: Ash
        username: ash
  dataFrom:
    - extract:
        key: pocket-id
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The profile of the `homeassistant-kiosk` user (users.yaml). The email is the field HOMEASSISTANT_KIOSK_EMAIL of the 1Password item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-user-homeassistant-kiosk
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pocket-id-user-homeassistant-kiosk
    template:
      data:
        displayName: Home Assistant Kiosk
        email: "{{ .HOMEASSISTANT_KIOSK_EMAIL }}"
        firstName: Home Assistant
        lastName: Kiosk
        username: homeassistant-kiosk
  dataFrom:
    - extract:
        key: pocket-id
