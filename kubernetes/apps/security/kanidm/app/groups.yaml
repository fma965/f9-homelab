---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmgroup_v1beta1.json
# Groups apps map to scopes with `scopeMap`. `members` is the exact list: anyone added to the group
# by hand is removed again. People are in people.yaml (display name only, as this repository is public).
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: admins
spec:
  kanidmRef:
    name: kanidm
  members:
    - scott
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmgroup_v1beta1.json
# The household: the home apps (Home Assistant and similar).
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: home
spec:
  kanidmRef:
    name: kanidm
  members:
    - scott
    - andrew
    - ash
    - homeassistant_kiosk
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmgroup_v1beta1.json
# The media apps (Jellyfin, Seerr and similar).
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: media
spec:
  kanidmRef:
    name: kanidm
  members:
    - scott
    - andrew
    - ash
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmgroup_v1beta1.json
# Open WebUI.
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: openwebui
spec:
  kanidmRef:
    name: kanidm
  members:
    - scott
    - andrew
    - ash
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmgroup_v1beta1.json
# Lets these people change their own email address (Kanidm's built-in group, which has no members by default).
# Their address is where password and credential reset links are sent (spec.mailSender in kanidm.yaml). The
# resource name cannot hold underscores, so `kanidmName` gives the built-in group's name.
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: idm-people-self-mail-write
spec:
  kanidmName: idm_people_self_mail_write
  kanidmRef:
    name: kanidm
  members:
    - scott
    - andrew
    - ash
