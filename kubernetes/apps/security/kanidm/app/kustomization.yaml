---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./backup.yaml
  - ./certificate.yaml
  - ./externalsecret.yaml
  - ./favicon.yaml
  - ./groups.yaml
  - ./kanidm.yaml
  - ./logos.yaml
  - ./mail-credentials.yaml
  - ./networkpolicy.yaml
  - ./people.yaml
configMapGenerator:
  - name: kanidm-branding
    files:
      - ./resources/override.css
generatorOptions:
  disableNameSuffixHash: true
