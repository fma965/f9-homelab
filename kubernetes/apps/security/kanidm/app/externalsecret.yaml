---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Garage credentials and the backup encryption key for the Kanidm backups. 1Password item `kanidm`, fields
# `ID` and `KEY` (the Garage access key and secret) and `ENCRYPTION_KEY` (32 random bytes, base64; made with
# `openssl rand -base64 32`). Keep the encryption key as long as the oldest backup you may want to restore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kanidm-backup-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .KEY }}"
        encryption-key: "{{ .ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: kanidm
