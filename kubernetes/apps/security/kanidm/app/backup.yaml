---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmbackuprepository_v1alpha1.json
# Where the Kanidm backups go: a bucket on Garage on the NAS (the same server as the CloudNativePG backups).
# Garage here speaks plain HTTP on 3900, so `insecure` is needed and the traffic stays on the home network.
# Client-side encryption means the bucket holds ciphertext only: a backup contains password hashes and
# passkey material. The key is in 1Password and must outlive the oldest backup (see externalsecret.yaml).
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupRepository
metadata:
  name: nas
spec:
  authentication:
    deleter:
      secretRef:
        name: kanidm-backup-secret
    reader:
      secretRef:
        name: kanidm-backup-secret
    writer:
      secretRef:
        name: kanidm-backup-secret
  encryption:
    mode: clientSide
    keyRef:
      name: kanidm-backup-secret
  s3:
    bucket: f9-kanidm
    endpoint: http://nas.main.internal:3900
    forcePathStyle: true
    insecure: true
    prefix: kanidm
    region: eu-west-2
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmbackupschedule_v1alpha1.json
# Nightly at 02:30, with a little jitter. Kanidm keeps seven copies on its own volume; the repository keeps
# the latest 8, 7 daily, 4 weekly and 6 monthly (at least a day old). Only one schedule may target a Kanidm.
# These fields cannot be changed in place: delete the schedule and create it again.
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupSchedule
metadata:
  name: kanidm
spec:
  jitterSeconds: 300
  kanidmRef:
    name: kanidm
  localVersions: 7
  repositoryRef:
    name: nas
  retention:
    keepLast: 8
    daily: 7
    weekly: 4
    monthly: 6
    minAge: 24h
  schedule: 30 2 * * *
  timeZone: Europe/London
