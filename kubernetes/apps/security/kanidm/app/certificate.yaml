---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
# Kanidm terminates TLS itself (the gateway re-encrypts to it), so it needs its own certificate.
# The operator expects the Secret to be called <Kanidm name>-tls and restarts the pods when it renews.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kanidm
spec:
  dnsNames:
    - id.f9.casa
  duration: 160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: kanidm-tls
  usages:
    - digital signature
