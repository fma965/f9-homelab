---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/configmap.json
# The other logos the Kanidm web UI loads (signed-in pages, home-screen icons), generated from
# resources/logo.png on the page background (#050e1e) and mounted over /hpkg/img/. Kept inline because a
# binary file source is not supported by the offline renderer (flate).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kanidm-logos
binaryData:
  logo-180.png: 
  logo-192.png: 
  logo-256.png: 
  logo-square.svg: 
  logo.svg: 
