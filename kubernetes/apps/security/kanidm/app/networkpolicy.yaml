---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Kanidm (id.f9.casa). Ingress and egress (M15, 15 Oct 2026): only the external gateway (the login
# page and the OIDC endpoints, 8443) and the operator (its management API) may connect in, and the
# pod may reach DNS and nothing else (LDAP is off and there is a single replica, so no replication).
# Written from how the operator and Kanidm work, not from a capture, as it is new.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kanidm
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kanidm
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: kaniop
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
