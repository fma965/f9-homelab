---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Kanidm (id.f9.casa). Ingress and egress (M15, 15 Oct 2026): only the external gateway (the login
# page and the OIDC endpoints, 8443) and the operator (its management API) may connect in, and the
# pod may reach DNS and nothing else (LDAP is off and there is a single replica, so no replication).
# Written from how the operator and Kanidm work, not from a capture, as it is new.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kanidm
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kanidm
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: kaniop
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# The backups (M15, 16 Oct 2026): the sidecar in the Kanidm pod and the data-mover Jobs Kaniop starts for
# discovery, retention and restore read and write the Garage bucket on the NAS (S3, 3900). Every pod in the
# namespace may reach it, because the Jobs are created by the operator and their labels were not known when
# this was written; narrow the selector to the Job and Kanidm labels once Hubble shows them. DNS comes from
# allow-dns. Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: security-nas-s3
spec:
  endpointSelector: {}
  egress:
    - toCIDR:
        - 10.10.10.3/32
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
---
# The mail sender the operator deploys for spec.mailSender. Its pod labels are fixed by the operator, so it
# cannot take the egress.cilium.io profile labels; this repeats the two profiles it needs. It calls Kanidm
# at its public address (https://id.f9.casa, through the external gateway) and hands mail to the SMTP relay.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kanidm-mail-sender
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kanidm-mail-sender
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
