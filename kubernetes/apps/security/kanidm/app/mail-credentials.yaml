---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/secret.json
# The SMTP login the Kanidm mail sender is configured with (spec.mailSender.credentialsSecret). The relay it
# talks to (network/smtp-relay) accepts mail from the cluster without a login, so both values are empty.
# Nothing secret lives here.
apiVersion: v1
kind: Secret
metadata:
  name: kanidm-mail-credentials
stringData:
  password: ""
  username: ""
