---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidm_v1beta1.json
# Identity provider at https://id.f9.casa, managed by Kaniop. Modelled on bjw-s-labs/home-ops
# (kubernetes/apps/security/kanidm-operator) and LucaDev/Home (apps/security/kanidm).
# The domain cannot be changed later: it is part of every account name (name@id.f9.casa).
# LDAP is off (no `ldapPortName`); Jellyfin will use its SSO plugin instead.
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  domain: id.f9.casa
  origin: https://id.f9.casa
  image: kanidm/server:1.11.2@sha256:e45f00bd354c1fc1c06a4be484b4e87b094c431e78280f1d19e911815e63efb5
  logLevel: info
  oauth2ClientNamespaceSelector: {}
  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 389
    runAsGroup: 389
    fsGroup: 389
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kanidm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  initContainers:
    - name: kanidm-generate-replication-config
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  # The sign-in heading and logo. The operator owns these: anything set by hand with the Kanidm CLI is
  # reset on its next reconcile (it calls DELETE /v1/domain/_image). The image is fetched by the
  # operator from a URL and re-fetched when it changes.
  domainAppearance:
    displayName: F9
    image:
      url: https://raw.githubusercontent.com/fma965/f9-homelab/main/kubernetes/apps/security/kanidm/app/resources/logo.png
  # Password and credential reset links by email, through the in-cluster SMTP relay (network/smtp-relay).
  # The relay takes mail from the cluster without a login (Authelia does the same) and adds its own
  # upstream credentials, so the secret only holds empty values; the schema requires a username and password.
  # The operator deploys the sender with fixed labels, so its network policy is in networkpolicy.yaml.
  # `image` is set because, left alone, the operator swaps /server: for /tools: in the server image but keeps
  # its digest, which pulls the server image again (no kanidm-mail-sender in it). Keep the tag in step with
  # the server image above.
  mailSender:
    credentialsSecret:
      name: kanidm-mail-credentials
    fromAddress: kanidm@f9.casa
    image: kanidm/tools:1.11.2@sha256:144783fc589ac9611f6149f54f95d0d9472c1bf6078e7ed5781be441bcca7d24
    relay: smtp://smtp-relay.network.svc.cluster.local:25
  # Branding: the stylesheet and favicon are mounted over the files the server ships in /hpkg (the
  # sign-in logo and the heading are set in Kanidm itself, see the README). The server reads them at
  # start-up, so restart the pod after editing resources/.
  volumes:
    - name: branding
      configMap:
        name: kanidm-branding
    - name: favicon
      configMap:
        name: kanidm-favicon
    - name: logos
      configMap:
        name: kanidm-logos
  volumeMounts:
    - name: branding
      mountPath: /hpkg/override.css
      subPath: override.css
    - name: favicon
      mountPath: /hpkg/img/favicon.png
      subPath: favicon.png
    - name: logos
      mountPath: /hpkg/img/logo-180.png
      subPath: logo-180.png
    - name: logos
      mountPath: /hpkg/img/logo-192.png
      subPath: logo-192.png
    - name: logos
      mountPath: /hpkg/img/logo-256.png
      subPath: logo-256.png
    - name: logos
      mountPath: /hpkg/img/icon-oauth2.svg
      subPath: icon-oauth2.svg
    - name: logos
      mountPath: /hpkg/img/logo-square.svg
      subPath: logo-square.svg
    - name: logos
      mountPath: /hpkg/img/logo.svg
      subPath: logo.svg
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: ceph-block
  # The operator creates the HTTPRoute and the BackendTLSPolicy to the Kanidm Service. Public, like
  # Authelia: the apps behind the external gateway need to reach the login page from the internet.
  gateway:
    annotations:
      gatus.home-operations.com/endpoint: |-
        conditions: ["[STATUS] == any(200,302)"]
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: System
      gethomepage.dev/icon: mdi-account-lock
      gethomepage.dev/name: Kanidm
      gethomepage.dev/description: "Identity provider"
    parentRefs:
      - name: envoy-external
        namespace: network
    hostnames:
      - id.f9.casa
    backendTlsPolicy:
      validation:
        hostname: id.f9.casa
        wellKnownCaCertificates: System
