---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-backup
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cnpg-backup
  values:
    controllers:
      cnpg-backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "59 * * * *"
        pod:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - "amd64"
        containers:
          app:
            image:
              repository: ghcr.io/tensorchord/cloudnative-vectorchord
              # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-vectorchord versioning=redhat
              tag: 17.5-0.4.3@sha256:acebb38ca309938bc05ce268b019c98aa718cb554dd54e4443654d9d00a0d498
            env:
              PGHOST: postgres-rw.database
              PGPORT: "5432"
              PGUSER: postgres
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: password
              TZ: Europe/London
            command:
              - "/bin/bash"
            args:
              - "-c"
              - |
                set -euo pipefail
                # Hourly dump into a temp file, checked before it replaces anything, so a failed or
                # truncated dump can never overwrite a good one. One file per weekday keeps seven
                # days of history; postgres17-cluster.dump.gz stays the latest (restore.yaml uses it).
                out="/backup/postgres17-cluster-$(date +%a).dump.gz"
                pg_dumpall -U "$PGUSER" | gzip > "$out.tmp"
                gzip -t "$out.tmp"
                mv "$out.tmp" "$out"
                cp "$out" /backup/postgres17-cluster.dump.gz.tmp
                mv /backup/postgres17-cluster.dump.gz.tmp /backup/postgres17-cluster.dump.gz
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      labels:
        egress.cilium.io/postgres: "true"
    persistence:
      backup:
        type: nfs
        server: nas.main.internal
        path: /mnt/Boot/Kubernetes/postgres
