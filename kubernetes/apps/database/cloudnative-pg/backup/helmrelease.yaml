---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-backup
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cnpg-backup
  values:
    controllers:
      cnpg-backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "59 * * * *"
        pod:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                          - "amd64"
        containers:
          app:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
              tag: 19.0-standard-bookworm@sha256:dd1c2eefb15d35ddc0c07b6a86d8ace814a113cccdb0a607c134131c87f33f84
            env:
              PGHOST: postgres-rw.database
              PGPORT: "5432"
              PGUSER: postgres
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cloudnative-pg-secret
                    key: password
              TZ: Europe/London
            command:
              - "/bin/bash"
            args:
              - "-c"
              - |
                set -euo pipefail
                # Hourly dump into a temp file, checked before it replaces anything, so a failed or
                # truncated dump can never overwrite a good one. One file per weekday keeps seven
                # days of history; <name>.dump.gz stays the latest (restore.yaml uses it).
                dump() {
                  name="$1"; shift
                  out="/backup/$name-$(date +%a).dump.gz"
                  "$@" | gzip > "$out.tmp"
                  gzip -t "$out.tmp"
                  mv "$out.tmp" "$out"
                  cp "$out" "/backup/$name.dump.gz.tmp"
                  mv "/backup/$name.dump.gz.tmp" "/backup/$name.dump.gz"
                }
                dump postgres18-cluster pg_dumpall -U "$PGUSER"
                # Home Assistant's recorder has its own cluster
                PGHOST=hass-postgres-rw.database dump hass-postgres pg_dumpall -U "$PGUSER"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      labels:
        egress.cilium.io/postgres: "true"
    persistence:
      backup:
        type: nfs
        server: nas.homelab.internal
        path: /mnt/Boot/Kubernetes/postgres
