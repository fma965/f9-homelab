---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres18-restore
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      volumes:
        - name: backup
          nfs:
            server: nas.homelab.internal
            path: /mnt/Boot/Kubernetes/postgres

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000

      containers:
        - name: postgres
          # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
          image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:6669f2fdbc344beb60d307e7aa0a343c510183ac49fd13db8d161d294ed5e141
          command: ["/bin/sh"]
          args:
            - "-c"
            - "gunzip < /backup/postgres18-cluster.dump.gz | psql -U $PGUSER postgres"
          env:
            - name: PGHOST
              value: postgres-rw.database
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudnative-pg-secret
                  key: password
            - name: TZ
              value: Europe/London
          volumeMounts:
            - name: backup
              mountPath: /backup
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - "amd64"
