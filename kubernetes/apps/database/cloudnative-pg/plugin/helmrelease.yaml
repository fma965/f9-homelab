---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
  values:
    crds:
      create: true
    # Egress profile (M15): the plugin controller talks to the API server. The operator reaches it on 9090.
    podLabels:
      egress.cilium.io/kube-apiserver: "true"
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
