---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# The shared Postgres 18 cluster that replaced postgres17 (cutover: f9-homelab#2722). Backups and WAL
# archiving go through the Barman Cloud plugin. The bootstrap below is the one-time import from postgres17
# and only runs when the cluster is created: do not recreate this cluster while postgres17 exists, it would
# re-import older data. Recover from the barman backups instead. hass is not here: it has its own cluster
# (hass-postgres). forgejo, synapse and app, and the roles of apps that no longer exist, stay on postgres17.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18
  annotations:
    # The plugin archives under a prefix that may already hold WAL from before the plugin took over.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgres18
    major: 18
  instances: 3
  # Egress profile labels (M15). CloudNativePG patches them onto the running pods and import Jobs.
  inheritedMetadata:
    labels:
      egress.cilium.io/kube-apiserver: "true"
      egress.cilium.io/nas: "true"
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    extensions:
      - name: vchord
    shared_preload_libraries:
      - vchord
    synchronous:
      method: any
      number: 1
    parameters:
      max_connections: "400"
      shared_buffers: 1GB
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 4Gi
  affinity:
    podAntiAffinityType: required
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres18
        serverName: postgres18-001
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - debtmanager
          - games
          - homebox
          - immich
          - litellm
          - prowlarr-main
          - radarr-main
          - sonarr-main
          - zipline
        roles:
          - debtmanager
          - games
          - homebox
          - immich
          - litellm
          - prowlarr
          - radarr
          - sonarr
          - zipline
        source:
          externalCluster: postgres17
  externalClusters:
    - name: postgres17
      connectionParameters:
        host: postgres-rw.database.svc.cluster.local
        user: postgres
        dbname: postgres
      password:
        name: cloudnative-pg-secret
        key: password
