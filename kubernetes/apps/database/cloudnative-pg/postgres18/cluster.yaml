---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# The shared Postgres 18 cluster that replaced postgres17 (cutover: f9-homelab#2722). Backups and WAL
# archiving go through the Barman Cloud plugin. The one-time import from postgres17 has been replaced by a
# recovery stanza (below) so that a recreated cluster restores from the backups. hass is not here: it has its
# own cluster (hass-postgres). forgejo, synapse and app, and the roles of apps that no longer exist, stayed on
# postgres17.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18
  annotations:
    # The plugin archives under a prefix that may already hold WAL from before the plugin took over.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  instances: 3
  # Egress profile labels (M15). CloudNativePG patches them onto the running pods and import Jobs.
  inheritedMetadata:
    labels:
      egress.cilium.io/kube-apiserver: "true"
      egress.cilium.io/nas: "true"
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/home-operations/vchord:1.3.0@sha256:c705b2313d64370eb19d3958a32ff1c68bbd76dd015dfe0ecceae9649949965a
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - vchord
    synchronous:
      method: any
      number: 1
    parameters:
      max_connections: "400"
      shared_buffers: 1GB
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 4Gi
  affinity:
    podAntiAffinityType: required
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres18
        serverName: postgres18-001
  # Permanent disaster-recovery stanza. bootstrap and externalClusters are read ONLY when the Cluster is first
  # created, so this is inert for the whole life of a running cluster. A recreated cluster recovers from the
  # latest plugin backup (to recreate it, delete the Cluster and its PVCs; a leftover PVC would be reused).
  bootstrap:
    recovery:
      source: postgres18
  externalClusters:
    - name: postgres18
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres18
          serverName: postgres18-001
