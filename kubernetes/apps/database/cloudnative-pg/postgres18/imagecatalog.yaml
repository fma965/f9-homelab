---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/imagecatalog_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: postgres18
spec:
  images:
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:2f690a4072bd00715c579cd19d0ba41599557687052ecd149560e673f77ce02a
      extensions:
        # VectorChord for Immich (it accepts >= 0.3, < 2.0). pgvector, cube and earthdistance are in the base image.
        - name: vchord
          image:
            reference: ghcr.io/home-operations/vchord:1.3.0@sha256:c705b2313d64370eb19d3958a32ff1c68bbd76dd015dfe0ecceae9649949965a
          dynamic_library_path:
            - /usr/lib/postgresql/18/lib/
          extension_control_path:
            - /usr/share/postgresql/18/
