---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Home Assistant's own Postgres 18 cluster. Its recorder was about 95% of the data on postgres17, so it
# has its own volume, WAL and backup path. Home Assistant has used it since the cutover (f9-homelab#2718).
# Backups and WAL archiving go through the Barman Cloud plugin. The one-time import from postgres17 has
# been replaced by a recovery stanza (below) so that a recreated cluster restores from the backups.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hass-postgres
  annotations:
    # The prefix already holds WAL that the cluster archived before the move to the plugin.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:6669f2fdbc344beb60d307e7aa0a343c510183ac49fd13db8d161d294ed5e141
  instances: 2
  # Egress profile labels (M15). CloudNativePG patches them onto the running pods and import Jobs.
  inheritedMetadata:
    labels:
      egress.cilium.io/kube-apiserver: "true"
      egress.cilium.io/nas: "true"
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      max_connections: "100"
      shared_buffers: 512MB
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 3Gi
  affinity:
    podAntiAffinityType: required
  plugins:
    # Backups and WAL archiving go through the Barman Cloud plugin (the PG18 image has no built-in barman
    # tools). serverName keeps the prefix the first archived WAL already used.
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hass-postgres
        serverName: hass-postgres-001
  # Permanent disaster-recovery stanza. bootstrap and externalClusters are read ONLY when the Cluster is first
  # created, so this is inert for the whole life of a running cluster. A recreated cluster recovers from the
  # latest plugin backup (to recreate it, delete the Cluster and its PVCs; a leftover PVC would be reused).
  bootstrap:
    recovery:
      source: hass-postgres
      database: hass
      owner: hass
  externalClusters:
    - name: hass-postgres
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hass-postgres
          serverName: hass-postgres-001
