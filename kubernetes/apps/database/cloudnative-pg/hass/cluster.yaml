---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Home Assistant's own Postgres 18 cluster. Its recorder was about 95% of the data on postgres17, so it
# has its own volume, WAL and backup path. Home Assistant uses it since the cutover (f9-homelab#2718).
# The bootstrap below is the one-time import from the shared postgres17 and only runs when the cluster
# is created. Do not recreate this cluster while postgres17 still exists: it would re-import the older
# data and drop everything recorded since. Recover from the barman backups instead.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hass-postgres
  annotations:
    # The prefix already holds WAL that the cluster archived before the move to the plugin.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:6669f2fdbc344beb60d307e7aa0a343c510183ac49fd13db8d161d294ed5e141
  instances: 2
  # Egress profile labels (M15). CloudNativePG patches them onto the running pods and import Jobs.
  inheritedMetadata:
    labels:
      egress.cilium.io/kube-apiserver: "true"
      egress.cilium.io/nas: "true"
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      max_connections: "100"
      shared_buffers: 512MB
  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      memory: 3Gi
  affinity:
    podAntiAffinityType: required
  plugins:
    # Backups and WAL archiving go through the Barman Cloud plugin (the PG18 image has no built-in barman
    # tools). serverName keeps the prefix the first archived WAL already used.
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hass-postgres
        serverName: hass-postgres-001
  bootstrap:
    initdb:
      database: hass
      owner: hass
      secret:
        name: hass-postgres-credentials
      import:
        type: microservice
        databases:
          - hass
        source:
          externalCluster: postgres17
  externalClusters:
    - name: postgres17
      connectionParameters:
        host: postgres-rw.database.svc.cluster.local
        user: postgres
        dbname: postgres
      password:
        name: cloudnative-pg-secret
        key: password
