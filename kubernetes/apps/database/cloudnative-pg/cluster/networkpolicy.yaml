---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Postgres accepts connections only from the namespaces that run clients (default, webdev), from the
# database namespace itself (replication, operator, backups, pgAdmin) and metrics from Prometheus.
# Probes come from the local node, which Cilium always allows. Allow-list taken from the Cilium
# connection table on 13 Oct 2026 (M15). Egress (15 Oct 2026): the instances may reach only each other,
# the API server, DNS and the NAS (the WAL and backup archive).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres17
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres17
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [default, webdev]
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
    # Replies from the other instances to this pod's own connections through the -rw / -r Services
    # (replication), evaluated the same way.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres17
  # The API server and the NAS (WAL archive on Garage) come from the egress.cilium.io/kube-apiserver
  # and /nas profile labels on the pods (Cluster inheritedMetadata).
  egress:
    # Replication and the instance manager's status calls between the instances.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres17
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Egress profile `egress.cilium.io/postgres`: a pod that uses the shared Postgres carries the label instead of
# repeating this rule, and the database's reply is allowed back in. The instances' own ingress policy
# still decides which namespaces may connect (default and webdev).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: postgres-egress
spec:
  endpointSelector:
    matchLabels:
      egress.cilium.io/postgres: "true"
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres17
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres17
