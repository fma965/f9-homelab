# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Dragonfly operator. Egress only (M15, 15 Oct 2026): it holds broad cluster RBAC, so it may reach
# DNS, the API server and the Dragonfly pods it manages, and nothing else. Ingress is not limited
# here: the API server calls its admission webhook and Prometheus scrapes it. Allow-list from the
# Cilium connection table on 15 Oct 2026.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dragonfly-operator
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    # The Dragonfly pods: it checks roles and sets the master over the Redis port, and uses the
    # admin port for health. Their ingress policy already allows the database namespace on these.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            app: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "9999"
              protocol: TCP
