---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pgadmin
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: kube-system
    - name: cloudnative-pg
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/database/pgadmin/app
  postBuild:
    substitute:
      APP: *app
      OIDC_DESCRIPTION: PostgreSQL administration
      OIDC_TITLE: pgAdmin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: false
