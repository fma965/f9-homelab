---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pgadmin
  values:
    controllers:
      pgadmin:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: docker.io/dpage/pgadmin4
              tag: 9.19@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
            env:
              PGADMIN_CONFIG_X_CONTENT_TYPE_OPTIONS: "''"
              PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
              PGADMIN_CONFIG_X_XSS_PROTECTION: 0
            envFrom:
              - secretRef:
                  name: pgadmin-secret
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
    defaultPodOptions:
      labels:
        egress.cilium.io/postgres: "true"

    service:
      app:
        controller: pgadmin
        ports:
          http:
            port: &port 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: pgAdmin
          gethomepage.dev/description: "Database admin (admin)"
          gethomepage.dev/icon: pgadmin
          gethomepage.dev/siteMonitor: http://pgadmin.database
        hostnames: ["{{ .Release.Name }}.f9.casa"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    # persistence:
    # server-json:
    #   enabled: true
    #   type: configMap
    #   name: servers-json
    #   globalMounts:
    #     - path: /pgadmin4/servers.json
    #       subPath: servers.json
