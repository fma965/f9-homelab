# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Flux notification-controller: the GitHub webhook receiver (public through the external gateway) and
# the event sink for the other Flux controllers. It is not on the reconcile path, so a mistake here
# loses notifications and webhook-triggered reconciles, not GitOps. Ingress and egress (M15). Probes come
# from the local node, which Cilium always allows. Allow-list from the manifests and the Cilium
# connection table on 15 Oct 2026.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notification-controller
spec:
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
    # GitHub's push webhook (flux-webhook.f9.casa -> webhook-receiver -> 9292).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
    # Events posted by the other Flux controllers (the notification-controller Service, 9090).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app: helm-controller
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app: kustomize-controller
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app: source-controller
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app.kubernetes.io/name: flux-operator
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Metrics (the flux-components PodMonitor).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Replies to the controller's own connections (kube-dns, Alertmanager for the Alerts, ...). They
    # come back through Services, where Cilium evaluates the reverse-translated reply as new traffic
    # to this pod and drops it ("Policy denied DROPPED" in Hubble). Allow any pod in the cluster to
    # reach this pod on the ephemeral port range only (32768 to 60999, the range the pod's own
    # outgoing connections use); the ports above stay limited to the sources listed.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: UDP
  # Egress: the API server, DNS, Alertmanager (the Alert provider) and the GitHub API (the
  # github-status provider posts commit statuses). Nothing else.
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The Alertmanager Provider (alertmanager-operated.o11y:9093).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # The github-status Provider (github.com/fma965/f9-homelab) posts to the GitHub API.
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Flux source-controller (M15, egress, 15 Oct 2026): it holds the GitHub credentials and fetches
# every chart and manifest, so it may reach DNS, the API server, GitHub and the registries in use,
# and nothing else. Ingress is not limited here (the other controllers fetch artifacts on 9090).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: source-controller
spec:
  endpointSelector:
    matchLabels:
      app: source-controller
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Events to the notification-controller (its Service, 9090). Its ingress policy allows this.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app: notification-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # The GitRepository for this repository (git over HTTPS).
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The OCI registries the sources pull from, and the hosts they redirect blob downloads to
    # (checked against the registries: GHCR -> pkg-containers.githubusercontent.com, Quay ->
    # cdn01.quay.io, the Giant Swarm registry -> an Azure blob account). `mirror.gcr.io` redirects
    # on its own host. Sources reconcile every 10-15 minutes, so a short capture does not see them.
    - toFQDNs:
        - matchName: ghcr.io
        - matchName: pkg-containers.githubusercontent.com
        - matchName: quay.io
        - matchPattern: "cdn*.quay.io"
        - matchName: mirror.gcr.io
        - matchName: gsoci.azurecr.io
        - matchPattern: "*.blob.core.windows.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Flux kustomize-controller and helm-controller (M15, egress, 15 Oct 2026): cluster-admin, so they
# may reach DNS, the API server, the source-controller (artifacts) and the notification-controller
# (events), and nothing else. Seen in Hubble: both fetch artifacts from source-controller:9090.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kustomize-helm-controllers
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [kustomize-controller, helm-controller]
  # The API server comes from the egress.cilium.io/kube-apiserver profile (the label is on the pod in the HelmRelease).
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Events to the notification-controller (its Service, 9090). Its ingress policy allows this.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app: notification-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app: source-controller
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
