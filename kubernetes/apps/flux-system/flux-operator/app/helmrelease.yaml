---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    image:
      repository: ghcr.io/controlplaneio-fluxcd/flux-operator
      tag: v0.61.0@sha256:71041d9fff7f7b05f1a8123ebe73c73b7b156f4aacfe1e8e19b5aa953a98892c
    serviceMonitor:
      create: true
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      httpRoute:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: infrastructure
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Platform Infrastructure
          gethomepage.dev/name: Flux Operator
          gethomepage.dev/icon: flux-cd
          gethomepage.dev/description: "Cluster deployment status (admin)"
        enabled: true
        hostnames:
          - flux-operator.f9.casa
        parentRefs:
          - name: envoy-external
            namespace: network
      networkPolicy:
        create: false
