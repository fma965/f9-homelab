---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Hubble UI: live service map and flow viewer (admin). Internal gateway only, behind the Pocket ID login (the
# SecurityPolicy and client come from the oidc component in ks.yaml). It is its own Flux Kustomization, apart from
# the Cilium install, so that Cilium never waits on Pocket ID (which needs Cilium to run).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Observability
    gethomepage.dev/name: Hubble
    gethomepage.dev/description: "Network flows and policy drops (admin)"
    gethomepage.dev/icon: cilium
    gethomepage.dev/pod-selector: k8s-app=hubble-ui
spec:
  hostnames:
    - hubble.f9.casa
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
