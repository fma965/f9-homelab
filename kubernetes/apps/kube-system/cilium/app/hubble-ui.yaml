---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Hubble UI: live service map and flow viewer (admin). Internal gateway only, behind Authelia
# (the SecurityPolicy comes from the ext-auth component in ks.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Observability
    gethomepage.dev/name: Hubble
    gethomepage.dev/description: "Network flows and policy drops (admin)"
    gethomepage.dev/icon: cilium
    gethomepage.dev/pod-selector: k8s-app=hubble-ui
spec:
  hostnames:
    - hubble.f9.casa
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
