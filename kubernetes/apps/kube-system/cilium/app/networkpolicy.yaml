---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Cluster-wide DNS and the default egress deny (M15, 16 Oct 2026). Every pod may ask kube-dns on 53,
# through Cilium's DNS proxy, and receive the reply. Because this rule selects every pod and has an
# `egress` section, it also puts every pod into default-deny for egress: what a pod may reach beyond DNS is
# only what its own policy and the `egress.cilium.io/<profile>` labels on it add (a new pod, Helm hook Job
# or CronJob starts with DNS and nothing else). Ingress is left open (`enableDefaultDeny.ingress: false`):
# the ingress section is only the reply to DNS, for pods that have an ingress policy. The proxy is what lets
# `toFQDNs` rules learn addresses, and forgetting the reply caused the Zipline and Connect gaps. Pods on the
# host network are never selected by pod policy. CoreDNS `autopath` stays off (cilium/cilium#20191).
# Recovery if egress breaks cluster-wide: add `egress: false` under `enableDefaultDeny` (pods without a
# policy then stay open again).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dns
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
  # The reply is new traffic to the pod, so pods that have an ingress policy need it allowed too.
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
