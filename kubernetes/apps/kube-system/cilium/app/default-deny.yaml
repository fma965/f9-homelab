---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Default-deny egress per namespace (M15). `egress: - {}` is Cilium's deny-all: it puts every pod in
# these namespaces into default-deny for egress and allows nothing itself. What a pod may reach is then
# only what its own policy, the cluster-wide DNS policy (allow-dns) and the `egress.cilium.io/<profile>`
# labels on it add. A new pod, a Helm hook Job or a CronJob in one of these namespaces therefore starts
# with no egress until it is given a policy or a profile label.
#
# A namespace goes on this list when every pod and transient pod in it already has what it needs. Every
# namespace with pods is covered. Pods on the host network (the Cilium agents and operator, the Multus and CSI
# node pods, the Ceph CSI node plugins, etcd-defrag) are not selected: Cilium does not apply pod policy to them.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values:
          - cert-manager
          - database
          - default
          - external-secrets
          - flux-system
          - kube-system
          - kopiur-system
          - mcp
          - network
          - o11y
          - openebs-system
          - rook-ceph
          - security
          - system-upgrade
          - webdev
  egress:
    - {}
