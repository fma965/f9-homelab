---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: not-routed
spec:
  # NoT (VLAN 30) with source-based routing (sbr): traffic sourced from the
  # pod's NoT address always leaves via net1 and the NoT gateway, so pods that
  # must be reachable from other VLANs (Bambuddy's virtual printer, from Main)
  # reply on net1 instead of the default eth0 route. The gateway comes from the
  # IPAM default route; the installed sbr (cni-plugins 1.9.1) ignores `gateways`.
  config: |-
    {
      "cniVersion": "1.1.0",
      "name": "not-routed",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.30",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "10.10.30.0/24" },
              { "dst": "239.255.255.250/32" },
              { "dst": "0.0.0.0/0", "gw": "10.10.30.254" }
            ]
          }
        },
        {
          "type": "sbr"
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv4.conf.all.rp_filter": "2",
            "net.ipv4.conf.net1.rp_filter": "2",
            "net.ipv6.conf.net1.accept_ra": "1",
            "net.ipv6.conf.net1.accept_ra_rt_info_max_plen": "128"
          }
        }
      ]
    }
