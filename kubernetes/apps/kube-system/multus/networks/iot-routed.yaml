---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot-routed
spec:
  # Same as `iot`, plus a return route to the Main VLAN via the IoT gateway so
  # pods that must be reachable from Main on their IoT address (Bambuddy's
  # virtual printer) reply on net1 instead of the default eth0 route.
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot-routed",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.20",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "10.10.20.0/24" },
              { "dst": "239.255.255.250/32" },
              { "dst": "10.10.10.0/24", "gw": "10.10.20.254" }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv4.conf.all.rp_filter": "2",
            "net.ipv4.conf.net1.rp_filter": "2",
            "net.ipv6.conf.net1.accept_ra": "1",
            "net.ipv6.conf.net1.accept_ra_rt_info_max_plen": "128"
          }
        }
      ]
    }
