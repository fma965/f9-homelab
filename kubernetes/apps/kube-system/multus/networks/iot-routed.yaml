---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot-routed
spec:
  # Same as `iot`, plus source-based routing (sbr): traffic sourced from the
  # pod's IoT address always leaves via net1 and the IoT gateway, so pods that
  # must be reachable from other VLANs (Bambuddy's virtual printer) reply on
  # net1 instead of the default eth0 route. Pattern from bjw-s-labs/home-ops.
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot-routed",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.20",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "10.10.20.0/24" },
              { "dst": "239.255.255.250/32" },
              { "dst": "0.0.0.0/0", "gw": "10.10.20.254" }
            ]
          }
        },
        {
          "type": "sbr"
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv4.conf.all.rp_filter": "2",
            "net.ipv4.conf.net1.rp_filter": "2",
            "net.ipv6.conf.net1.accept_ra": "1",
            "net.ipv6.conf.net1.accept_ra_rt_info_max_plen": "128"
          }
        }
      ]
    }
