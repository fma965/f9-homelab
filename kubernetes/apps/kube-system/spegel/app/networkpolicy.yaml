---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Spegel (the peer-to-peer image mirror, one per node). Egress only (M15, 16 Oct 2026): the API server (the
# `kube-apiserver` profile label, for peer discovery) and the other Spegel pods: the router on 5001 (seen in
# Hubble between all three) and the registry on 5000, which a pod serves to its peers. Since Spegel 0.8.0
# (19 Oct 2026) containerd reaches its local pod through the `spegel-registry` Service (NodePort 30020,
# `trafficDistribution: PreferSameNode`) instead of a hostPort; that is traffic from the node, not from
# a pod. DNS comes from allow-dns. Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spegel
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spegel
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/name: spegel
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
            - port: "5001"
              protocol: TCP
            - port: "5001"
              protocol: UDP
