---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-network-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      unifi-network-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.53.0@sha256:84c4221880d97d05a989b341a6f733d17f001a0451a049f03587855ff59e5787
            env:
              HOME: /tmp
              TZ: Europe/London
              UNIFI_HOST: unifi.internal
              UNIFI_MCP_ALLOWED_HOSTS: unifi-network-mcp,unifi-network-mcp:3000,unifi-network-mcp.ai.svc.cluster.local,unifi-network-mcp.ai.svc.cluster.local:3000,localhost,localhost:3000,127.0.0.1,127.0.0.1:3000
              UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION: "false"
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED: "true"
              UNIFI_MCP_HTTP_TRANSPORT: streamable-http
              UNIFI_MCP_PORT: "3000"
              UNIFI_PORT: "443"
              UNIFI_SITE: default
              UNIFI_TOOL_PERMISSION_MODE: confirm
              UNIFI_TOOL_REGISTRATION_MODE: lazy
              UNIFI_VERIFY_SSL: "false"
            envFrom:
              - secretRef:
                  name: unifi-network-mcp-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: false
      # `component` is selected by Agent Gateway's egress rule.
      labels:
        app.kubernetes.io/component: mcp-server
        egress.cilium.io/unifi: "true"
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 3000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
