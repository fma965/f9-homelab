---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# UniFi Network MCP. Write actions still ask for confirmation (UNIFI_TOOL_PERMISSION_MODE=confirm). It has no inbound
# authentication, so only Agent Gateway may call it; its egress to the UniFi controller comes from the `unifi` label on
# the pod. Written from the manifests (M15): check Hubble for `Policy denied DROPPED` after it lands.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-network-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: agentgateway
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
