---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kubernetes-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      kubernetes-mcp:
        containers:
          app:
            image:
              repository: quay.io/containers/kubernetes_mcp_server
              tag: v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16
            args:
              - --config
              - /etc/kubernetes-mcp-server/config.toml
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: true
      # The API server (egress.cilium.io, M15), and the label Agent Gateway's egress rule selects.
      labels:
        app.kubernetes.io/component: mcp-server
        egress.cilium.io/kube-apiserver: "true"
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 8080
    persistence:
      config:
        type: configMap
        name: kubernetes-mcp-config
        globalMounts:
          - path: /etc/kubernetes-mcp-server
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
