---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Kubernetes MCP (read-only: the server refuses every mutating tool and denies Secrets, and its service account cannot
# write or read Secrets either). It has no inbound authentication, so only Agent Gateway may call it; its only egress
# is the API server, from the `kube-apiserver` label on the pod (that profile also lets the API server's replies
# back in). Written from the manifests (M15): check Hubble for `Policy denied DROPPED` after it lands.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubernetes-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: agentgateway
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
