---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The gateway's per-client API keys live in the 1Password item `agentgateway` (kubernetes vault), one field per
# client: FRIGATE_API_KEY, HOME_ASSISTANT_API_KEY, OPENWEBUI_API_KEY and PAPERLESS_API_KEY (KitchenOwl's field is unused since it was removed). Unlike
# LiteLLM there is no operator that mints keys, so each client later reads its own field from the same item.
# LLAMA_API_KEY is the llama.cpp server's own key, read from the item that server already uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway
spec:
  data:
    - secretKey: LLAMA_API_KEY
      remoteRef:
        key: llamacpp
        property: API_KEY
    # What the Grafana, Paperless and TrueNAS MCP servers demand from their callers (as a bearer token); the gateway
    # sends each on its own target (backendAuth), as LiteLLM did. The same 1Password fields the servers' own
    # ExternalSecrets read (see litellm/app/mcp-servers).
    - secretKey: GRAFANA_MCP_TOKEN
      remoteRef:
        key: grafana-mcp
        property: server_auth_token
    - secretKey: PAPERLESS_MCP_TOKEN
      remoteRef:
        key: paperless
        property: paperless_api_token
    - secretKey: TRUENAS_MCP_API_KEY
      remoteRef:
        key: truenas-mcp
        property: TRUENAS_API_KEY
  dataFrom:
    - extract:
        key: agentgateway
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-secret
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Encrypts the MCP session IDs (the chart reads the Secret named by `session.secretName`, key `key`). The field
# SESSION_KEY of the item `agentgateway` is a random value; rotating it ends the open MCP sessions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-session
spec:
  data:
    - secretKey: key
      remoteRef:
        key: agentgateway
        property: SESSION_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-session
