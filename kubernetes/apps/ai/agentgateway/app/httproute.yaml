---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# The LLM endpoint for callers outside the cluster (Frigate runs on the NAS). Internal gateway only; the login is the
# gateway's own API key check (`llm.policies.apiKey`, strict). In-cluster
# callers use the Service, http://agentgateway.ai.svc.cluster.local:8080/v1.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway
spec:
  hostnames:
    - agentgateway.f9.casa
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: agentgateway
          port: 8080
