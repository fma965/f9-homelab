---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Agent Gateway (LLM gateway; the login is its own API key check). Allow-list written from the manifests, not yet from
# the Cilium connection table (M15): check Hubble for `Policy denied DROPPED` after it lands. Probes come from the local
# node, which Cilium always allows. Egress (M15): DNS and the `nas` profile (the llama.cpp server on the NAS), from the
# cluster-wide policy and the label on the pod; nothing else. A new in-cluster caller needs its own ingress rule here.
# The pod calls the NAS directly (no reply rule needed) and the MCP servers through their Services (reply rule below).
# Egress to the MCP servers is its own rule; their pods take calls from the gateway through their own policies.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: agentgateway
      app.kubernetes.io/name: agentgateway
  ingress:
    # The route for callers outside the cluster (Frigate on the NAS): the internal gateway.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # In-cluster callers (default namespace), through the Service, with their own API keys.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: openwebui
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The public MCP door for claude.ai (mcp.f9.casa, MCP listener 8081): the external gateway.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # Open WebUI's MCP tool connections (8081; its chat is on 8080 above).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: openwebui
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    # The gateway calls the MCP servers through their Services, so their replies come back as new traffic to this pod
    # (from the MCP pod to this pod's ephemeral port). No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
    # Metrics from Prometheus.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "15020"
              protocol: TCP
  egress:
    # The MCP servers (the `*-mcp` apps in this namespace, labelled `component: mcp-server`). Ports are the
    # containers' own.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8086"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP
