---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app flux-mcp
spec:
  dependsOn:
    - name: kubernetes-mcp # owns the ClusterRole mcp-readonly-cluster that this app binds to
  interval: 1h
  path: ./kubernetes/apps/ai/flux-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
