---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app truenas-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      truenas-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/cedricziel/truenas-mcp
              tag: 0.4.2@sha256:1a165c9b3831b8cf546c78231857896431c27a4465d2fcb16260c7d578bbee55
            env:
              TRUENAS_MCP_ALLOW_PLAINTEXT: "true"
              TRUENAS_MCP_ENABLE_WRITES: "true"
              TRUENAS_MCP_LISTEN: ":8080"
              TRUENAS_MCP_TARGET: nas.homelab.internal:443
              TRUENAS_MCP_TARGET_INSECURE: "true"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      automountServiceAccountToken: false
      # `component` is selected by Agent Gateway's egress rule.
      labels:
        app.kubernetes.io/component: mcp-server
        egress.cilium.io/nas: "true"
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 8080
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
