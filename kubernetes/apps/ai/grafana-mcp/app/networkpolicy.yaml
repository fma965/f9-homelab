---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Grafana MCP (read-only, --disable-write). Only Agent Gateway may call it, and it calls only Grafana
# (grafana-service.o11y.svc:3000). Written from the manifests (M15): check Hubble for `Policy denied DROPPED` after it
# lands. Grafana is called through its Service, so its reply comes back as new traffic to this pod and is let in with
# no port. Agent Gateway's own policy allows it to call this pod and takes the reply.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: agentgateway
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
