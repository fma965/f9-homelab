---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# LiteLLM (LLM gateway, admin UI signs in with Pocket ID itself). Allow-list written from the
# manifests, not yet from the Cilium connection table (M15): check Hubble for `Policy denied DROPPED`
# after it lands. Probes come from the local node, which Cilium always allows.
# Egress (M15): DNS, then the `gateway-external` (the Pocket ID sign-in at id.f9.casa), `postgres` and `nas`
# profiles (labels on the proxy pod); nothing else. A new in-cluster caller (Open WebUI, Frigate, Home Assistant)
# needs its own ingress rule here before it can use the API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/name: litellm
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # The public MCP door (public/): the external gateway, whose route passes only the MCP paths.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # The operator creates teams and virtual keys through the admin API (spec.apiAccess) at the Service.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm-operator
            app.kubernetes.io/name: litellm-operator
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # Open WebUI (default namespace): chat completions with its virtual key.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: openwebui
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # Paperless (default namespace): AI suggestions with its virtual key.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # Home Assistant (default namespace): the Local LLM Server and LLM Vision integrations, with their virtual keys.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
