---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
# Read-only access beyond the built-in `view` role, for the Kubernetes and Flux MCP servers. `view` already covers
# the namespaced built-in resources and the Flux custom resources and, by design, excludes Secrets. This adds
# cluster-scoped reads and the custom resources `view` does not aggregate. Explicit groups only: nothing here names
# Secrets, and no verb other than get, list and watch is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-readonly-cluster
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, csinodes, storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups:
      - cilium.io
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - litellm.home-operations.com
      - monitoring.coreos.com
      - pocketid.internal
      - postgresql.cnpg.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests, certificates, clusterissuers, issuers]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [clusterexternalsecrets, externalsecrets]
    verbs: [get, list, watch]
  # `view` aggregates only resourcesets and resourcesetinputproviders from this group; the FluxInstance and its report
  # are what the Flux MCP's get_flux_instance reads.
  - apiGroups: [fluxcd.controlplane.io]
    resources: [fluxinstances, fluxreports]
    verbs: [get, list, watch]
