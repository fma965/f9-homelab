---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# UniFi Network MCP behind LiteLLM. Write actions still ask for confirmation (UNIFI_TOOL_PERMISSION_MODE=confirm).
# It has no inbound authentication, so the network policy lets only LiteLLM call it. Same image and settings as the
# public instance in the mcp namespace, which stays until the cut-over.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: unifi-network-mcp
spec:
  alias: unifi_network
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    env:
      - name: HOME
        value: /tmp
      - name: TZ
        value: Europe/London
      - name: UNIFI_HOST
        value: unifi.internal
      - name: UNIFI_MCP_ALLOWED_HOSTS
        value: unifi-network-mcp,unifi-network-mcp:3000,unifi-network-mcp.ai.svc.cluster.local,unifi-network-mcp.ai.svc.cluster.local:3000,localhost,localhost:3000,127.0.0.1,127.0.0.1:3000
      - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
        value: "false"
      - name: UNIFI_MCP_HOST
        value: 0.0.0.0
      - name: UNIFI_MCP_HTTP_ENABLED
        value: "true"
      - name: UNIFI_MCP_HTTP_TRANSPORT
        value: streamable-http
      - name: UNIFI_MCP_PORT
        value: "3000"
      - name: UNIFI_PORT
        value: "443"
      - name: UNIFI_SITE
        value: default
      - name: UNIFI_TOOL_PERMISSION_MODE
        value: confirm
      - name: UNIFI_TOOL_REGISTRATION_MODE
        value: lazy
      - name: UNIFI_VERIFY_SSL
        value: "false"
    envFrom:
      - secretRef:
          name: unifi-network-mcp-secret
    image: ghcr.io/sirkirby/unifi-network-mcp:0.43.1@sha256:8b31a2e8895fc225a63893c32deef3d4151afd17793d3425f80dbfe95b983bb7
    path: /mcp
    # The UniFi controller (egress.cilium.io, M15).
    podLabels:
      egress.cilium.io/unifi: "true"
    podSecurityContext:
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    port: 3000
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
