---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The 1Password item grafana-mcp (read-only Grafana service account, and the
# bearer token this server demands from its callers: LiteLLM sends it, see mcpserver.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-mcp-secret
    template:
      data:
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .service_account_token }}"
        MCP_GRAFANA_SERVER_TOKEN: "{{ .server_auth_token }}"
  dataFrom:
    - extract:
        key: grafana-mcp
