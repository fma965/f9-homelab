---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# VictoriaLogs MCP behind LiteLLM. Written from the manifests (M15); check Hubble for `Policy denied DROPPED` after it
# lands. Two policies, one per pod:
# 1. the MCP pod takes calls only from LiteLLM and calls only VictoriaLogs (victoria-logs.o11y.svc:9428);
# 2. the LiteLLM pod may call the MCP pod, and its reply is evaluated as new traffic to LiteLLM (a Service call
#    under an ingress policy), so the MCP pod is let back in with no port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/name: victoria-logs-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # VictoriaLogs is called through its Service, so its reply comes back as new traffic to this pod.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: victoria-logs-single
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-victoria-logs-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/name: litellm
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
            app.kubernetes.io/name: victoria-logs-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
            app.kubernetes.io/name: victoria-logs-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
