---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
# Home Assistant MCP behind LiteLLM, READ-WRITE as on the public instance: it can call services, including locks.
# The public instance guards itself with a secret URL path; here the path is a plain /mcp because the network policy
# lets only LiteLLM call this pod. Home Assistant is called at home-assistant-app.default.svc:8123, and its own policy
# has to admit this pod (kubernetes/apps/default/home-assistant/app/networkpolicy.yaml).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: home-assistant-mcp
spec:
  alias: home_assistant
  proxyRef: litellm
  transport: http
  workload:
    automountServiceAccountToken: false
    command:
      - ha-mcp-web
    env:
      - name: FASTMCP_CHECK_FOR_UPDATES
        value: "off"
      - name: HA_MCP_CONFIG_DIR
        value: /tmp
      - name: HA_MCP_DISABLE_UPDATE_CHECK
        value: "true"
      - name: HOME
        value: /tmp
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: home-assistant-mcp-secret
            key: HOMEASSISTANT_TOKEN
      - name: HOMEASSISTANT_URL
        value: http://home-assistant-app.default.svc.cluster.local:8123
      - name: MCP_HOST
        value: 0.0.0.0
      - name: MCP_PORT
        value: "8086"
      - name: MCP_SECRET_PATH
        value: /mcp
      - name: TZ
        value: Europe/London
    image: ghcr.io/homeassistant-ai/ha-mcp:9.0.0@sha256:0298113732140c9d725171dc3f1dc5b6a53b03815482536ee2236e17e8cd1bdd
    path: /mcp
    podSecurityContext:
      runAsGroup: 999
      runAsNonRoot: true
      runAsUser: 999
      seccompProfile:
        type: RuntimeDefault
    port: 8086
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir: {}
