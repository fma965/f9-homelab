---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Home Assistant long-lived token (same 1Password item as the public ha-mcp). It acts as its Home Assistant user,
# so it can do anything that user can, including operate locks.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-mcp-secret
    template:
      data:
        HOMEASSISTANT_TOKEN: "{{ .homeassistant_token }}"
  dataFrom:
    - extract:
        key: ha-mcp
