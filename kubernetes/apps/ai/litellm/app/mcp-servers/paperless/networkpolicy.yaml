---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Paperless MCP behind LiteLLM. Written from the manifests (M15); check Hubble for `Policy denied DROPPED` after it
# lands. Two policies, one per pod: the MCP pod takes calls only from LiteLLM and calls only Paperless (8000), and the
# LiteLLM pod may call the MCP pod, with the reply path back in. Paperless's own policy admits this pod.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/name: paperless-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Paperless is called through its Service, so its reply comes back as new traffic to this pod.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: paperless
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-paperless-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: litellm
      app.kubernetes.io/name: litellm
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
            app.kubernetes.io/name: paperless-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/component: mcp-server
            app.kubernetes.io/name: paperless-mcp
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
