---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The Paperless-ngx API token LiteLLM sends to the Paperless MCP (as `Authorization: Bearer`); the server passes it
# on to Paperless, so what it can do is what this token's Paperless user can do.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-mcp-secret
    template:
      data:
        PAPERLESS_API_TOKEN: "{{ .paperless_api_token }}"
  dataFrom:
    - extract:
        key: paperless
