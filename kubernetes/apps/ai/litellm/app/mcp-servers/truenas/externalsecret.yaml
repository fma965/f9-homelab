---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The TrueNAS API key LiteLLM sends to the TrueNAS MCP (as `Authorization: Bearer`). The server itself holds no
# credentials: whoever calls it supplies a key, so this key is what the NAS sees. Same 1Password item as before.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: truenas-mcp-secret
    template:
      data:
        TRUENAS_API_KEY: "{{ .TRUENAS_API_KEY }}"
  dataFrom:
    - extract:
        key: truenas-mcp
