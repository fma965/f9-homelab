---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/serviceaccount.json
# Read-only: the built-in `view` role (no Secrets) plus mcp-readonly-cluster (../rbac.yaml). The server's own
# read_only setting and its Secret deny-list (resources/config.toml) are a second guard, not the only one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: ai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-readonly-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-readonly-cluster
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: ai
