---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Admin API key and the UI login. The salt key encrypts provider credentials stored in the
        # database: it must never change once the database holds data.
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        # The llama.cpp server on the NAS (same item and field Open WebUI uses).
        LLAMACPP_API_KEY: "{{ .API_KEY }}"

        # Postgres Init (the init-db Job)
        INIT_POSTGRES_DBNAME: litellm
        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: litellm
        INIT_POSTGRES_PASS: "{{ .LITELLM_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        DATABASE_URL: |-
          postgresql://litellm:{{ .LITELLM_POSTGRES_PASSWORD }}@postgres-rw.database.svc.cluster.local/litellm
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: llamacpp
    - extract:
        key: cloudnative-pg
