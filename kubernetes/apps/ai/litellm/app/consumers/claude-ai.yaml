---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmteam_v1alpha1.json
# What claude.ai's connectors may use through the public door (public/). Home Assistant is deliberately NOT listed: its
# MCP server exists behind LiteLLM but nothing is granted it. The key is in the Secret claude-ai-litellm (key `key`) in
# this namespace; it is entered in each connector as a request header, `x-litellm-api-key: <key>` (LiteLLM also accepts
# `Authorization: Bearer <key>`).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: claude-ai
spec:
  alias: claude-ai
  mcpServers:
    - flux
    - grafana
    - kubernetes
    - paperless
    - truenas
    - unifi_network
    - victoria_logs
  models:
    - gemma-4-12b-ha
  proxyRef: litellm
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: claude-ai
spec:
  keyAlias: claude-ai
  models:
    - gemma-4-12b-ha
  proxyRef: litellm
  secretName: claude-ai-litellm
  teamID: claude-ai
