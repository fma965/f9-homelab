---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/job_v1.json
# The LiteLLMProxy resource has no initContainers, so the database and user on the shared Postgres
# are created by a Job with the same image the app-template apps use as `init-db`. It is idempotent
# (it also resets the user's password and grants), so Flux re-running it every hour is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-init-db
  annotations:
    # A Job's pod template is immutable: recreate it when Renovate moves the image digest.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        egress.cilium.io/postgres: "true"
    spec:
      containers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.7.0@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
          envFrom:
            - secretRef:
                name: litellm-secret
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
