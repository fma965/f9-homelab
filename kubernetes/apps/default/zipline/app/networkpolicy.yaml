# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Zipline (file and link sharing, public, OIDC login). Allow-list from the manifests and the
# Cilium connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium
# always allows.
# Egress (M15): DNS, Postgres and the gateway (OIDC) only; nothing on the internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zipline
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zipline
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # The app calls auth.f9.casa (OIDC) and other public names, which resolve to the
    # gateway, so the gateway pods reply from their own listener port to this pod's
    # ephemeral port; the reply is evaluated as new traffic. No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    # Replies to the app's own connections, which go through Services (kube-dns, postgres-
    # rw). Cilium evaluates the reverse-translated reply as new traffic to this pod and
    # drops it without these rules ("Policy denied DROPPED" in Hubble). The destination is
    # the pod's ephemeral source port, so no port can be listed.
    # The replies from the shared Postgres, Dragonfly and the SMTP relay come from their egress profiles.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
  egress:
    # Egress (M15): only the destinations below; anything else this pod tries to reach is
    # dropped. Zipline has no internet dependency: version checking is off and uploads go to
    # an NFS volume the node mounts.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
