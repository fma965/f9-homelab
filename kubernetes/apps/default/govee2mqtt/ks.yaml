---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app govee2mqtt
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc
  dependsOn:
    - name: mosquitto
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/default/govee2mqtt/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      OIDC_DESCRIPTION: Govee devices to MQTT
      OIDC_HOST: govee.f9.casa
      OIDC_ICON: mqtt
      OIDC_TITLE: Govee2MQTT
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
