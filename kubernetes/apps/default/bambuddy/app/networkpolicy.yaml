# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Bambuddy (3D printer manager, public, OIDC login). This covers its main (cluster) interface only:
# the virtual-printer ports (990, 3000-3002, 6000, 8883, 50000-50100) are on the Multus "not-routed"
# interface (10.10.30.246) and are not seen by Cilium. Probes come from the local node, which Cilium
# always allows. Ingress only (M15). Allow-list from the manifests and the Cilium connection table
# on 15 Oct 2026.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bambuddy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bambuddy
  ingress:
    # The web UI through the external gateway, and Home Assistant's Bambuddy integration (240
    # connections in the connection table).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Replies to Bambuddy's own connections: kube-dns, Home Assistant (home-assistant-app:8123) and
    # the gateway (id.f9.casa for OIDC). They come back through Services, where Cilium evaluates
    # the reverse-translated reply as new traffic to this pod and drops it ("Policy denied DROPPED"
    # in Hubble). Allow any pod in the cluster to reach this pod on the ephemeral port range only
    # (32768 to 60999, the range the pod's own outgoing connections use); port 8000 stays limited to
    # the sources above.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: UDP
  # Egress on eth0 only (M15, 16 Oct 2026): Cilium does not see the Multus interfaces, and the routes in
  # the pod send only the VLAN subnets out of them (checked). The profile labels in the HelmRelease add
  # the rest; DNS comes from allow-dns.
  egress:
    # Home Assistant (the cluster), and the printers on the NoT VLAN (MQTT over TLS on 8883 seen; FTPS and
    # the camera use other ports). The web (update checks) is the web profile.
    - toEntities:
        - cluster
    - toCIDR:
        - 10.10.30.0/24
    # Frigate on the NAS: its go2rtc RTSP restream (8554) for the printer camera. Frigate publishes only
    # 8971, 8554 and 8555 and the restream needs the RTSP credentials, so this opens one TCP port on one host.
    # Set the camera to RTSP over TCP: UDP would need RTP ports that are not allowed.
    - toCIDRSet:
        - cidrGroupRef: nas
      toPorts:
        - ports:
            - port: "8554"
              protocol: TCP
