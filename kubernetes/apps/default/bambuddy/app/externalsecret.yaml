---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bambuddy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bambuddy-secret
    template:
      data:
        BAMBUDDY_OIDC_CLIENT_ID: "{{ .BAMBUDDY_OAUTH_CLIENT_ID }}"
        BAMBUDDY_OIDC_CLIENT_SECRET: "{{ .BAMBUDDY_OAUTH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: authelia
