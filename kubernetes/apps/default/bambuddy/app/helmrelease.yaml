---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bambuddy
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      bambuddy:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            # Join the IoT VLAN so the pod is on the same L2 as the printer
            # (LAN mode: MQTT 8883, FTPS 990, camera 6000, SSDP discovery).
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name": "iot",
                "namespace": "kube-system",
                "mac": "f2:f9:00:00:20:46",
                "ips": ["10.10.20.246/24"]
              }]
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: 1.2.5.7
            env:
              PORT: &port 8000
              TZ: Europe/London
              # Used to build the OIDC redirect URI: <APP_URL>/api/v1/auth/oidc/callback
              APP_URL: https://bambuddy.f9.casa
              # SSO via Authelia (env-managed provider; read-only in the UI)
              BAMBUDDY_OIDC_NAME: Authelia
              BAMBUDDY_OIDC_ISSUER_URL: https://auth.f9.casa
              BAMBUDDY_OIDC_SCOPES: openid email profile groups
              BAMBUDDY_OIDC_AUTO_CREATE_USERS: "true"
              BAMBUDDY_OIDC_GROUP_CLAIM: groups
              BAMBUDDY_OIDC_GROUP_MAPPING: '{"admin": "Administrators", "home": "Operators"}'
              BAMBUDDY_OIDC_DEFAULT_GROUP: Viewers
            envFrom:
              - secretRef:
                  name: bambuddy-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                # The image sets file capabilities on python3 (setcap
                # cap_net_bind_service=+ep). Dropping it from the bounding set
                # makes exec fail with "Operation not permitted".
                add: ["NET_BIND_SERVICE"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data
                subPath: data
      tmpfs:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /tmp
                subPath: tmp
              - path: /app/logs
                subPath: logs
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
        hostnames:
          - "{{ .Release.Name }}.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        controller: bambuddy
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
