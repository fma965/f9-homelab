---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bambuddy
  values:
    defaultPodOptions:
      labels:
        egress.cilium.io/web: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      bambuddy:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            # Join the NoT VLAN so the pod is on the same L2 as the printer
            # (LAN mode: MQTT 8883, FTPS 990, camera 6000, SSDP discovery).
            # not-routed adds source-based routing so hosts on other VLANs
            # (slicer on Main) can reach the virtual printer on this address.
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name": "not-routed",
                "namespace": "kube-system",
                "mac": "f2:f9:00:00:30:46",
                "ips": ["10.10.30.246/24"]
              }]
        containers:
          app:
            image:
              repository: ghcr.io/maziggy/bambuddy
              tag: daily@sha256:ed6725e20dac9bcc73a53ad52941c7178d1486c0acbe9581dce526d2cbdad136 
            env:
              PORT: &port 8000
              TZ: Europe/London
              # Used to build the OIDC redirect URI: <APP_URL>/api/v1/auth/oidc/callback
              APP_URL: https://bambuddy.f9.casa
              # SSO via Pocket ID (env-managed provider; read-only in the UI). Existing accounts are linked by
              # verified email; Bambuddy refuses that for a user who still has the old Authelia link, so each user
              # removes it before the switch. Auto-create is off so a login that does not match fails instead of
              # making a duplicate account.
              BAMBUDDY_OIDC_NAME: Pocket ID
              BAMBUDDY_OIDC_ISSUER_URL: https://id.f9.casa
              BAMBUDDY_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-oidc-credentials
                    key: client_id
              BAMBUDDY_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: bambuddy-oidc-credentials
                    key: client_secret
              BAMBUDDY_OIDC_SCOPES: openid email profile groups
              BAMBUDDY_OIDC_AUTO_CREATE_USERS: "false"
              BAMBUDDY_OIDC_AUTO_LINK_EXISTING: "true"
              BAMBUDDY_OIDC_REQUIRE_EMAIL_VERIFIED: "true"
              BAMBUDDY_OIDC_GROUP_CLAIM: groups
              BAMBUDDY_OIDC_GROUP_MAPPING: '{"admins": "Administrators", "home": "Operators"}'
              BAMBUDDY_OIDC_DEFAULT_GROUP: Viewers
              # Slicer API sidecar (same pod); enable in Settings -> Slicer -> Use Slicer API
              BAMBU_STUDIO_API_URL: http://localhost:3001
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                # The image sets file capabilities on python3 (setcap
                # cap_net_bind_service=+ep). Dropping it from the bounding set
                # makes exec fail with "Operation not permitted".
                add: ["NET_BIND_SERVICE"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          # Bambu Studio CLI wrapper used by Bambuddy's Slice action
          # (https://github.com/maziggy/bambuddy/tree/main/slicer-api).
          # Same pod => reached on localhost. Upstream defaults to 3000
          # internally, which collides with the virtual printer's bind
          # server (3000/3002), so it is moved to 3001.
          slicer:
            image:
              repository: ghcr.io/maziggy/bambu-studio-api
              tag: bambuddy-1.2.5.7@sha256:4a104e34e81137f092c84af92814cc39cfa74cdd1fec4b6f6aa0d0464b568a91
            env:
              NODE_ENV: production
              PORT: &slicerPort 3001
            probes:
              liveness: &slicerProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *slicerPort
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *slicerProbe
            securityContext:
              allowPrivilegeEscalation: false
              # The CLI wrapper writes outside /app/data (matches other deployments).
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          bambuddy:
            app:
              - path: /app/data
                subPath: data
            slicer:
              - path: /app/data
                subPath: slicer
      tmpfs:
        type: emptyDir
        advancedMounts:
          bambuddy:
            app:
              - path: /tmp
                subPath: tmp
              - path: /app/logs
                subPath: logs
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Bambuddy
          gethomepage.dev/description: "3D printer control, print queue and filament tracking"
          gethomepage.dev/icon: bambu-lab.svg
        hostnames:
          - "{{ .Release.Name }}.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        controller: bambuddy
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
