---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bambuddy
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: multus-networks
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/bambuddy/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      # Bambuddy runs as uid/gid 2000 and writes 0600 key files (.jwt_secret,
      # .mfa_encryption_key, VP certs); the mover must run as the same user.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
