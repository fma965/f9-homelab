# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Immich (photos, public, OIDC login). Allow-list from the manifests and the Cilium connection
# table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always allows.
# Egress (M15): DNS, Postgres, Dragonfly, the SMTP relay, the NAS machine-learning server, the gateway and a short list of named hosts.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    # The app calls id.f9.casa (OIDC) and other public names, which resolve to the
    # gateway, so the gateway pods reply from their own listener port to this pod's
    # ephemeral port; the reply is evaluated as new traffic. No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    # Homepage's widget (a Service call to this app).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
  # Access to the NAS (egress.cilium.io/nas) comes from the profile label(s) on the pod, set in the HelmRelease.
  egress:
    # Internet hosts by name (443 only): the new-version check. Unlike setups that run
    # machine learning in the cluster, nothing here downloads models (the NAS does). If a
    # feature stops working, look for the denied name in Hubble and add it here.
    - toFQDNs:
        - matchName: version.immich.cloud
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
