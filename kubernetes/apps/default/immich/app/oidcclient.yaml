---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
# The Pocket ID client for Immich's login (photos.f9.casa). The operator writes the Secret `immich-oidc-credentials`
# (`client_id`, `client_secret`), which the HelmRelease writes into Immich's config file. Immich refuses to link a
# new subject to an account that is still linked to the old one, so the Authelia links are cleared at the switch.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
spec:
  callbackUrls:
    - https://photos.f9.casa/auth/login
    - https://photos.f9.casa/user-settings
    - app.immich:///oauth-callback
  clientID: immich
  description: Photos and videos
  launchUrl: https://photos.f9.casa/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/immich.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/immich.webp
  name: Immich
  skipConsent: true
