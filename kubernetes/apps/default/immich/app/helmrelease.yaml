# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    controllers:
      server:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7.0@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
            envFrom:
              - secretRef:
                  name: immich-secret
          render-config:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.6@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
            command:
              - sh
              - -c
              - |
                sed -e "s|__OAUTH_CLIENT_ID__|$OAUTH_CLIENT_ID|" \
                    -e "s|__OAUTH_CLIENT_SECRET__|$OAUTH_CLIENT_SECRET|" \
                    /template/immich.json > /immich-config/immich.json
            env:
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: immich-oidc-credentials
                    key: client_id
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: immich-oidc-credentials
                    key: client_secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.6@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
            env:
              REDIS_HOSTNAME: dragonfly.database.svc.cluster.local
              REDIS_PORT: 6379
              TZ: Europe/London
              PUBLIC_IMMICH_SERVER_URL: "https://photos.f9.casa"
              IMMICH_CONFIG_FILE: /immich-config/immich.json
            envFrom:
              - secretRef:
                  name: immich-secret
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
    defaultPodOptions:
      labels:
        egress.cilium.io/dragonfly: "true"
        egress.cilium.io/gateway-external: "true"
        egress.cilium.io/nas: "true"
        egress.cilium.io/postgres: "true"
        egress.cilium.io/smtp-relay: "true"
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: immich-gpu
    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media Service
          gethomepage.dev/name: Immich
          gethomepage.dev/icon: immich
          gethomepage.dev/description: "Family photo and video library"
          gethomepage.dev/widget.type: immich
          gethomepage.dev/widget.url: http://immich.default:2283
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_IMMICH_KEY}}` }}"
          gethomepage.dev/widget.version: "2"
        hostnames: ["photos.f9.casa"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    configMaps:
      config:
        data:
          # All of Immich's settings (Administration, Settings are read-only while this is set). The OAuth client
          # comes from the Pocket ID operator's Secret; `render-config` fills in the two placeholders.
          immich.json: |
            {
              "ffmpeg": { "accel": "vaapi" },
              "library": { "watch": { "enabled": true } },
              "machineLearning": { "urls": ["http://immich-machine-learning.docker.internal:3003"] },
              "notifications": {
                "smtp": {
                  "enabled": true,
                  "from": "admin@f9.casa",
                  "transport": { "host": "smtp-relay.network.svc.cluster.local", "port": 25, "ignoreCert": true }
                }
              },
              "oauth": {
                "enabled": true,
                "autoLaunch": true,
                "issuerUrl": "https://id.f9.casa/.well-known/openid-configuration",
                "clientId": "__OAUTH_CLIENT_ID__",
                "clientSecret": "__OAUTH_CLIENT_SECRET__"
              },
              "passwordLogin": { "enabled": false },
              "server": { "externalDomain": "https://photos.f9.casa" },
              "storageTemplate": { "enabled": true, "template": "{{ `{{y}}/{{MM}}/{{filename}}` }}" }
            }
    persistence:
      config-template:
        type: configMap
        name: immich
        advancedMounts:
          server:
            render-config:
              - path: /template
      config:
        type: emptyDir
        advancedMounts:
          server:
            render-config:
              - path: /immich-config
            main:
              - path: /immich-config
                readOnly: true
      matplotlib:
        type: emptyDir
        globalMounts:
          - path: /config/matplotlib
      library:
        type: nfs
        server: nas.homelab.internal
        path: /mnt/Vault/Photos
        globalMounts:
          - path: /usr/src/app/upload
      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
