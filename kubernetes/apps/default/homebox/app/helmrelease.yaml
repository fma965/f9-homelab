---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: homebox
  values:
    defaultPodOptions:
      labels:
        egress.cilium.io/gateway-external: "true"
        egress.cilium.io/postgres: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      homebox:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: homebox-secret
        containers:
          homebox:
            image:
              repository: ghcr.io/sysadminsmedia/homebox
              tag: 0.27.1@sha256:9d0b64776c694f018c0ca06faf52105a33ca376024f46bb58e6ab0e2b728bb61
            env:
              HBOX_OPTIONS_CHECK_GITHUB_RELEASE: "false"
              HBOX_DATABASE_DRIVER: postgres
              HBOX_DATABASE_SSL_MODE: disable
              HBOX_LOG_FORMAT: json
              HBOX_LOG_LEVEL: info
              HBOX_WEB_PORT: &port 7745
              HBOX_OIDC_ENABLED: "true"
              HBOX_OPTIONS_TRUST_PROXY: "true"
              # Sign-in through Pocket ID (id.f9.casa); its groups claim carries the group names (`admins`, `home`).
              HBOX_OIDC_ISSUER_URL: https://id.f9.casa
              HBOX_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: homebox-oidc-credentials
                    key: client_id
              HBOX_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: homebox-oidc-credentials
                    key: client_secret
              HBOX_OIDC_SCOPE: "openid profile email groups"
              HBOX_OIDC_ALLOWED_GROUPS: "admins,home"
              HBOX_OIDC_AUTO_REDIRECT: "true"
              HBOX_OPTIONS_ALLOW_LOCAL_LOGIN: "false"
              TZ: Europe/London
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      modcache:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /.cache
    route:
      homebox:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Homebox
          gethomepage.dev/description: "Household inventory: what we own and where it is"
          gethomepage.dev/icon: homebox
          gethomepage.dev/href: https://inventory.f9.casa
        hostnames:
          - "{{ .Release.Name }}.f9.casa"
          - "inventory.f9.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: homebox
    service:
      homebox:
        controller: homebox
        type: ClusterIP
        ports:
          http:
            port: *port
