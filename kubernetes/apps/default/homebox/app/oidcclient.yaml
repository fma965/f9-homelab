---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
# The Pocket ID client for Homebox's login (inventory.f9.casa). The operator writes the Secret
# `homebox-oidc-credentials` (`client_id`, `client_secret`), which the HelmRelease reads. Homebox matches a new
# issuer and subject to the existing user with the same email, so accounts carry over from Authelia.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: homebox
spec:
  allowedUserGroups:
    - groupName: admins
    - groupName: home
  callbackUrls:
    - https://inventory.f9.casa/api/v1/users/login/oidc/callback
  clientID: homebox
  description: What we own and where it is
  launchUrl: https://inventory.f9.casa/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/homebox.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/homebox.webp
  name: Homebox
  pkceEnabled: true
  skipConsent: true
