---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obico-ml-api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: obico-ml-api-secret
    template:
      data:
        # Bearer token the ML API requires on /p/ (/hc/ stays open). The same
        # value goes in Bambuddy: Settings -> Failure Detection -> ML API Token.
        ML_API_TOKEN: "{{ .ML_API_TOKEN }}"
  dataFrom:
    - extract:
        key: obico-ml-api
