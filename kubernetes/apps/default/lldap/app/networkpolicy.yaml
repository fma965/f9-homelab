---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# LLDAP holds the user directory. Only Authelia and Jellyfin (its LDAP Authentication plugin) may
# bind over LDAP, and only the internal Envoy gateway may reach the web UI. Probes come from the
# local node, which Cilium always allows. Allow-list taken from the Cilium connection table and
# the Jellyfin plugin directory on 13 Oct 2026 (L30, M15).
# Egress (M15): DNS, Postgres (5432) and the SMTP relay (25) only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lldap
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lldap
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: authelia
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: jellyfin
      toPorts:
        - ports:
            - port: "389"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # LLDAP's own database connection. Postgres is reached through the postgres-rw Service, so
    # its replies arrive reverse-translated and Cilium evaluates them as new connections against
    # this ingress policy (seen in Hubble as "Policy denied DROPPED" on SYN-ACK). Without this rule
    # LLDAP cannot reach its database. The reply port is LLDAP's ephemeral source port, so no
    # port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres17
    # CoreDNS replies to LLDAP's own lookups (the postgres-rw hostname, SMTP relay). They go
    # through the kube-dns Service, so Cilium treats the reverse-translated reply as new traffic
    # to the pod and (without this rule) drops it; seen in Hubble as "Policy denied DROPPED" from
    # kube-dns. The lookup then times out, LLDAP cannot reach its database, and Authelia's LDAP
    # bind fails (the OIDC consent page loops). Same fix as the Postgres policy. The destination
    # port of a reply is the pod's ephemeral source port, so no port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    # Replies from the SMTP relay (password-reset mail). It is reached through a Service, so
    # its reply is evaluated as new traffic to this pod and dropped unless the relay is
    # allowed in, even though the egress rule below lets the connection out (Hubble: "Policy
    # denied DROPPED" SYN-ACK from network/smtp-relay).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
  egress:
    # Egress (M15): only the destinations below; anything else this pod tries to reach is
    # dropped. DNS first.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The shared Postgres (postgres-rw.database.svc).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres17
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The SMTP relay (smtp-relay.network.svc), used for mail.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
