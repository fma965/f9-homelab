---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: radarr
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: radarr-secret
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.0.10815@sha256:c044b4df8e7b2546ef389481626a56fabe291575ff2d65481b1555432d6161ff
            env:
              TZ: Europe/London
              RADARR__APP__INSTANCENAME: radarr
              RADARR__APP__THEME: dark
              # Radarr signs people in itself with Pocket ID (id.f9.casa); the route has no gateway login in front. It lets
              # exactly one identity in: the `sub` of the owner's Pocket ID user (RADARR__AUTH__OIDCUSERIDENTIFIER, from
              # the secret). Callers of /api (Prowlarr, Seerr, Recyclarr, Homepage) still use the API key.
              RADARR__AUTH__METHOD: Oidc
              RADARR__AUTH__OIDCAUTHORITY: https://id.f9.casa
              RADARR__AUTH__OIDCCLIENTID: radarr
              RADARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: radarr-oidc-credentials
                    key: client_secret
              RADARR__AUTH__REQUIRED: Enabled
              RADARR__LOG__CONSOLEFORMAT: Clef
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 80
              # Trust the gateway's X-Forwarded-Proto, so the callback URL Radarr builds is https (the pod network).
              RADARR__SERVER__TRUSTEDNETWORKS: 10.42.0.0/16
              RADARR__UPDATE__BRANCH: develop
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      labels:
        # The OIDC discovery and token calls go to id.f9.casa, which resolves to the external gateway in the cluster.
        egress.cilium.io/gateway-external: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads Service
          gethomepage.dev/name: Radarr
          gethomepage.dev/icon: radarr
          gethomepage.dev/app: radarr
          gethomepage.dev/description: "Movie downloads (admin)"
          gethomepage.dev/widget.type: radarr
          gethomepage.dev/widget.url: http://radarr.default
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_RADARR_KEY}}` }}"
        hostnames:
          - "{{ .Release.Name }}.f9.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: nas.homelab.internal
        path: "/mnt/Media/Library/Movies"
        globalMounts:
          - path: /movies
      downloads:
        type: nfs
        server: nas.homelab.internal
        path: /mnt/Media/Library/Downloads
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir
