# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app music-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: music-assistant
  values:
    controllers:
      music-assistant:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"media",
                "namespace": "kube-system",
                "mac": "f2:f9:00:00:40:04",
                "ips": ["10.10.40.241/24"]
              }]
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.7@sha256:dce482dc3bf4093735acf217b3bead74a05c46d40922341e775580c6d05394cd
            env:
              TZ: Europe/London
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2048Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

          bgutil-provider:
            image:
              repository: docker.io/brainicism/bgutil-ytdlp-pot-provider
              tag: 2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
            env:
              TZ: Europe/London
              PORT: 4416
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      labels:
        egress.cilium.io/gateway-external: "true"
        egress.cilium.io/internet: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.10.69.205
        controller: *app
        ports:
          http:
            port: &port 8095
            primary: true
          stream:
            port: 8097
          connect1:
            port: 32500
          connect2:
            port: 32501
          gdm1:
            port: 32410
            protocol: UDP
          gdm2:
            port: 32412
            protocol: UDP
          gdm3:
            port: 32413
            protocol: UDP
          gdm4:
            port: 32414
            protocol: UDP
          gdm5:
            port: 32500
            protocol: UDP

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Music Assistant
          gethomepage.dev/description: "Play music on speakers around the house"
          gethomepage.dev/icon: music-assistant
        hostnames:
          - music.f9.casa
        parentRefs:
          - name: envoy-external
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          music-assistant:
            app:
              - path: /data
                subPath: data
              - path: /cache
                subPath: cache

      media:
        type: nfs
        server: nas.main.internal
        path: /mnt/Media/Library/Music
        advancedMounts:
          music-assistant:
            app:
              - path: /music

      tmpfs:
        type: emptyDir
        sizeLimit: 2Gi
        globalMounts:
          - path: /.audio
            subPath: .audio
          - path: /.cache
            subPath: .cache
          - path: /tmp
            subPath: tmp
