---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app recommendarr
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: pocket-id
      namespace: security
  path: ./kubernetes/apps/default/recommendarr/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      OIDC_GROUP: media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
  interval: 1h
