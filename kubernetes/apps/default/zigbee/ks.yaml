---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc
  dependsOn:
    - name: mosquitto
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/default/zigbee/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      OIDC_DESCRIPTION: Zigbee network and pairing
      OIDC_ICON: zigbee2mqtt
      OIDC_ICON_DARK: zigbee2mqtt-light
      OIDC_TITLE: Zigbee2MQTT
      ZEROSCALER_JOB_NAME: zigbee_probe
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
