---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kitchenowl
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kitchenowl-secret
    template:
      data:
        JWT_SECRET_KEY: "{{ .JWT_SECRET_KEY }}"
        # KitchenOwl's key on the Agent Gateway
        OPENAI_API_KEY: "{{ .KITCHENOWL_API_KEY }}"
  data:
    - secretKey: KITCHENOWL_API_KEY
      remoteRef:
        key: agentgateway
        property: KITCHENOWL_API_KEY
  dataFrom:
    - extract:
        key: kitchenowl
