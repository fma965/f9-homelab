---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kitchenowl
spec:
  chartRef:
    kind: OCIRepository
    name: kitchenowl
  interval: 1h
  values:
    controllers:
      kitchenowl:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/tombursch/kitchenowl
              tag: v0.8.1@sha256:6a048135399691da25aec04ea107666cb7ce8eb46f5fed9a46a5ac254fe23073
            env:
              TZ: Europe/London
              FRONT_URL: https://{{ .Release.Name }}.f9.casa
              # Sign-in through Pocket ID (id.f9.casa) only: password login is off, and with it open registration.
              # Onboarding is off too, so nobody can create the first account on an empty database.
              DISABLE_USERNAME_PASSWORD_LOGIN: "true"
              DISABLE_ONBOARDING: "true"
              OIDC_ISSUER: https://id.f9.casa
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kitchenowl-oidc-credentials
                    key: client_id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kitchenowl-oidc-credentials
                    key: client_secret
              # The LiteLLM gateway (ai namespace) through its OpenAI-compatible API, with the virtual key in the
              # Secret kitchenowl-litellm. Ingredient detection on imported recipes and the AI recipe generator.
              LLM_MODEL: openai/gemma-4-12b-ha
              LLM_API_URL: http://litellm.ai.svc.cluster.local:4000/v1
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: kitchenowl-litellm
                    key: key
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # Not read-only: the entrypoint rewrites wsgi.ini and the web app's base href in place at start-up.
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      labels:
        # The Pocket ID sign-in at id.f9.casa goes through the external gateway.
        egress.cilium.io/gateway-external: "true"
        # Recipe import fetches the recipe's web page.
        egress.cilium.io/web: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: KitchenOwl
          gethomepage.dev/description: "Shared grocery lists and recipes"
          gethomepage.dev/icon: kitchenowl
        hostnames:
          - "{{ .Release.Name }}.f9.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: kitchenowl
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
