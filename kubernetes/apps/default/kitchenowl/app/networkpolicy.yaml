# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# KitchenOwl (grocery lists, internal gateway only, own login). Ingress: the internal gateway on the
# container port. Egress: DNS (cluster-wide) and the public web through the `web` profile label
# (recipe import). It calls no in-cluster Services, so there are no reply rules. Probes come from the
# local node, which Cilium always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kitchenowl
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kitchenowl
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
