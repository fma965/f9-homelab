# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# KitchenOwl (grocery lists, internal gateway only, own login through Pocket ID). Ingress: the internal gateway and
# Home Assistant (integration) on the container port. Egress: DNS (cluster-wide), the `gateway-external` (Pocket ID sign-in) and `web` (recipe import)
# profile labels, and the LiteLLM proxy on 4000. Allow-list written from the manifests, not yet from the Cilium
# connection table (M15): check Hubble for `Policy denied DROPPED` after it lands. Probes come from the local node,
# which Cilium always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kitchenowl
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kitchenowl
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Home Assistant's KitchenOwl integration calls the API through the kitchenowl Service. Its replies are
    # established traffic, and Home Assistant already accepts the ephemeral range from the cluster.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The app calls id.f9.casa (OIDC), which resolves to the gateway, so the gateway pods reply from their own
    # listener port to this pod's ephemeral port; the reply is evaluated as new traffic. No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    # KitchenOwl calls LiteLLM through its Service, so LiteLLM's replies come back as new traffic to this pod
    # (from the LiteLLM pod to this pod's ephemeral port). No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
