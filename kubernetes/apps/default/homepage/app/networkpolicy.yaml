# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Homepage (the f9.casa dashboard, public). Allow-list from the manifests and the Cilium
# connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always
# allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Homepage's widgets and site monitors call a changing set of Services (arr apps,
    # downloaders, paperless, jellyfin, immich, Home Assistant, ESPHome, Gatus, pgAdmin,
    # ...). Their replies come back through the Service and Cilium evaluates them as new
    # traffic to this pod, so they are dropped without a rule ("Policy denied DROPPED" in
    # Hubble). Rather than list every target, allow any pod in the cluster to reach this pod
    # on the ephemeral port range only (32768 to 60999, the range the pod's own outgoing
    # connections use, verified in the pod). Port 3000 stays gateway-only, so nothing in the
    # cluster can open a connection to Homepage directly and skip the login.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "32768"
              endPort: 60999
              protocol: UDP
    # The Kubernetes widget talks to the API server; its replies come from the control-plane
    # nodes.
    - fromEntities:
        - kube-apiserver
  # Egress: Homepage holds API keys for most of the apps it shows, so it may reach the cluster,
  # the NAS and UniFi, and nothing on the internet but the search suggestions.
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Widgets, site monitors and service discovery: about a dozen Services that change as apps are
    # added (arr apps, downloaders, paperless, jellyfin, immich, Home Assistant, ESPHome, Gatus,
    # pgAdmin), plus the Kubernetes widget's API server calls. Replies are already allowed in above.
    - toEntities:
        - cluster
    # The NAS, on any port (TrueNAS UI, Webtop, Garage, Tdarr and Frigate monitors today, and
    # whatever gets added), and the UniFi controller (widget and monitor), as the cluster sees them.
    - toCIDR:
        - 10.10.10.3/32
    - toCIDR:
        - 10.10.100.254/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # The search bar's suggestions (`showSearchSuggestions` with the Google provider) are fetched by
    # the server.
    - toFQDNs:
        - matchName: suggestqueries.google.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
