---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homepage
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/default/homepage/app
  postBuild:
    substitute:
      APP: *app
      OIDC_DESCRIPTION: A button for everything
      OIDC_GROUP: home
      OIDC_HOST: f9.casa
      OIDC_TITLE: Homepage
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
