---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/tags/app-template-4.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  interval: 12h
  chartRef:
    kind: OCIRepository
    name: matter-server
  values:
    controllers:
      matter-server:
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
            args:
              - --storage-path=/data
              - --primary-interface=net1
              - --log-level=debug
            env:
              TZ: Europe/London
              THREAD_REST_PROBE_PORT: "8080" # SLZB OTBR REST API, for Thread topology
              MATTER_SERVER__INSTANCE_NAME: "{{ .Release.Name }}"
              MATTER_SERVER__PORT: &port 5580
              MATTER_SERVER__APPLICATION_URL: "{{ .Release.Name }}.f9.casa"
              MATTER_SERVER__LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

    defaultPodOptions:
      labels:
        egress.cilium.io/internet: "true"
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
              "name": "not",
              "namespace": "kube-system",
              "mac": "f2:f9:00:00:30:07",
              "ips": ["10.10.30.243/24"]
          }]
      securityContext:
        runAsNonRoot: false # Must be run as root user
        runAsUser: 0 # Must be run as root user
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 34
    service:
      app:
        ports:
          http:
            port: 5580
    persistence:
      data:
        existingClaim: matter-server
      tmp:
        type: emptyDir
