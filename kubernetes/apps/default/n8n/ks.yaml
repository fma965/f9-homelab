---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app n8n
spec:
  components:
    - ../../../../components/oidc
    - ../../../../components/oidc-claims
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/default/n8n/app
  postBuild:
    substitute:
      APP: *app
      OIDC_DESCRIPTION: Workflow automation
      OIDC_TARGET: n8n-app
      OIDC_TITLE: n8n
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
