---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immichframe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immichframe-secret
    template:
      data:
        # Imported into ImmichFrame's settings database on every start (the config dir is an emptyDir), so this
        # file is the source of truth; /admin stays disabled because no admin password is set.
        Settings.yml: |
          General:
            ClockFormat: HH:mm
            PhotoDateFormat: yyyy-MM-dd
            UnitSystem: metric
            Interval: 15
          Accounts:
            - ImmichServerUrl: http://immich.default.svc.cluster.local:2283
              ApiKey: "{{ .IMMICHFRAME_API_KEY }}"
              # Only these albums are shown (favorites and memories are off by default).
              Albums:
                - e1fbef6c-28ad-4e21-896e-2d4bac529235
                - edd18d2b-bf82-4698-b315-00e332964068
                - 719441c0-011a-44d4-b4a2-670c4037f2b4
                - dd02f9da-f2e7-4cfd-b506-e545ee4af390
                - 48c73aac-7cc2-419a-b11d-0230a3aad0d8
  dataFrom:
    - extract:
        key: immichframe
