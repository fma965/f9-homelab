---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immichframe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immichframe-secret
    template:
      data:
        # Imported into ImmichFrame's settings database on every start (the config dir is an emptyDir), so this
        # file is the source of truth; /admin stays disabled because no admin password is set.
        Settings.yml: |
          General:
            ClockFormat: HH:mm
            PhotoDateFormat: yyyy-MM-dd
            UnitSystem: metric
          Accounts:
            - ImmichServerUrl: http://immich.default.svc.cluster.local:2283
              ApiKey: "{{ .IMMICHFRAME_API_KEY }}"
  dataFrom:
    - extract:
        key: immichframe
