---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The 1Password item `nas-password-reset` needs the field TRUENAS_API_KEY: an API key for a TrueNAS user whose only
# privilege is ACCOUNT_WRITE (and ACCOUNT_READ). See the README of fma965/nas-password-reset.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nas-password-secret
    template:
      data:
        TRUENAS_API_KEY: "{{ .TRUENAS_API_KEY }}"
  dataFrom:
    - extract:
        key: nas-password-reset
