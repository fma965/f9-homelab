---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The 1Password item `nas-password-reset` needs the field TRUENAS_API_KEY: an API key for a TrueNAS user whose only
# privilege is ACCOUNT_WRITE (and ACCOUNT_READ). See the README of fma965/nas-password-reset.
# It also needs JELLYFIN_API_KEY: a Jellyfin API key (Dashboard, API Keys). Jellyfin keys are not scoped, so it is a
# full Jellyfin administrator key. Create the field before this merges, or the ExternalSecret reports an error.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nas-password-secret
    template:
      data:
        JELLYFIN_API_KEY: "{{ .JELLYFIN_API_KEY }}"
        TRUENAS_API_KEY: "{{ .TRUENAS_API_KEY }}"
  dataFrom:
    - extract:
        key: nas-password-reset
