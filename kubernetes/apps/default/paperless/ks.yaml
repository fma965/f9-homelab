---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc
    - ../../../../components/oidc-claims
    - ../../../../components/zeroscaler
  dependsOn:
    - name: pocket-id
      namespace: security
  interval: 1h
  path: "./kubernetes/apps/default/paperless/app"
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 15Gi
      OIDC_DESCRIPTION: Scanned documents
      OIDC_GROUP: home
      OIDC_HOST: docs.f9.casa
      OIDC_TITLE: Paperless
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
