# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Paperless-ngx (documents, public behind Authelia). Allow-list from the manifests and the
# Cilium connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium
# always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Home Assistant's Paperless integration (seen in Hubble as "Policy denied DROPPED" after the
    # policy first went in).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Replies to the app's own connections, which go through Services (kube-dns, dragonfly).
    # Cilium evaluates the reverse-translated reply as new traffic to this pod and drops it
    # without these rules ("Policy denied DROPPED" in Hubble). The destination is the pod's
    # ephemeral source port, so no port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            io.kubernetes.pod.namespace: database
            app: dragonfly
