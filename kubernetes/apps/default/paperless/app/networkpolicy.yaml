# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Paperless-ngx (documents, public behind the Pocket ID login). Allow-list from the manifests and the
# Cilium connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium
# always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Home Assistant's Paperless integration (seen in Hubble as "Policy denied DROPPED" after the
    # policy first went in).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Homepage's widget (a Service call to this app).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  # Access to the NAS (egress.cilium.io/nas) comes from the profile label(s) on the pod, set in the HelmRelease.
  egress:
    # The embedding model (sentence-transformers/all-MiniLM-L6-v2) is downloaded from Hugging Face
    # into HF_HOME on first use; the cache is still empty, so this was not seen in a capture.
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "*.huggingface.co"
        - matchPattern: "**.hf.co"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
