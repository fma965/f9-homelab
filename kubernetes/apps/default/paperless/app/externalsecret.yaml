---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-secret
    creationPolicy: Owner
    template:
      data:
        PAPERLESS_ADMIN_USER: "{{ .paperless_admin_username }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .paperless_admin_password }}"
        PAPERLESS_SECRET_KEY: "{{ .paperless_config_secret_key }}"
        # Paperless AI's key on the Agent Gateway
        PAPERLESS_AI_LLM_API_KEY: "{{ .paperless_agentgateway_key }}"
  data:
    - secretKey: paperless_agentgateway_key
      remoteRef:
        key: agentgateway
        property: PAPERLESS_API_KEY
  dataFrom:
    - extract:
        key: paperless
