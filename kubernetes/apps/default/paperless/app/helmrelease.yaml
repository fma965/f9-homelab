---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless
  values:
    controllers:
      paperless:
        forceRename: paperless
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
            env:
              # Configure application
              PAPERLESS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_SECRET_KEY
              PAPERLESS_URL: https://docs.f9.casa
              # Since 3.5 a set PAPERLESS_URL makes Paperless accept only that hostname and localhost. The
              # Paperless MCP server (ai namespace) calls the Service name and the Homepage widget the short name,
              # so both are listed (the port is ignored).
              PAPERLESS_ALLOWED_HOSTS: paperless.default,paperless.default.svc.cluster.local
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: Europe/London
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # Configure folders
              PAPERLESS_CONSUMPTION_DIR: /data/nas/incoming
              PAPERLESS_DATA_DIR: /data/local/data
              PAPERLESS_EXPORT_DIR: /data/nas/export
              PAPERLESS_MEDIA_ROOT: /data/local/media
              # Configure folder importer
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "10"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # Configure OCR
              PAPERLESS_OCR_LANGUAGES: eng
              PAPERLESS_OCR_LANGUAGE: eng
              # Configure redis integration
              PAPERLESS_REDIS: redis://dragonfly.database.svc.cluster.local:6379
              # Configure user permissions
              USERMAP_GID: "1000" # gladius:external-services
              # Configure SSO: the gateway logs people in with Pocket ID and sets Remote-User from the ID token
              # (components/oidc-claims)
              PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
              PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: "HTTP_REMOTE_USER"
              PAPERLESS_LOGOUT_REDIRECT_URL: "https://docs.f9.casa/logout"
              # Configure AI suggestions: the Agent Gateway (ai namespace), which fronts the local llama.cpp server
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_ENDPOINT: http://agentgateway.ai.svc.cluster.local:8080/v1
              PAPERLESS_AI_LLM_MODEL: gemma-4-12b-ha
              PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
              # Embeddings for document chat / similar-document search run locally in the pod
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: huggingface
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
              # Keep the downloaded embedding model on the data volume across restarts
              HF_HOME: /data/local/data/huggingface
              PAPERLESS_AI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_AI_LLM_API_KEY
              # Configure admin user
              PAPERLESS_ADMIN_USER:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_ADMIN_USER
              PAPERLESS_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_ADMIN_PASSWORD
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                memory: 2Gi
              limits:
                memory: 6Gi

    defaultPodOptions:
      labels:
        egress.cilium.io/dragonfly: "true"
        egress.cilium.io/nas: "true"

    service:
      app:
        forceRename: paperless
        primary: true
        controller: paperless
        ports:
          http:
            port: &port 8000

    persistence:
      data:
        existingClaim: paperless
        advancedMounts:
          paperless:
            app:
              - path: /data/local
      nas:
        type: nfs
        server: nas.homelab.internal
        path: /mnt/Vault/Documents
        advancedMounts:
          paperless:
            app:
              - path: /data/nas

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Paperless
          gethomepage.dev/description: "Archive of scanned documents and paperwork"
          gethomepage.dev/icon: paperless-ngx
          gethomepage.dev/widget.type: paperlessngx
          gethomepage.dev/widget.url: http://paperless.default:8000
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}`}}"
        hostnames:
          - "docs.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
