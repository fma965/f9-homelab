---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app techdocs
spec:
  components:
    - ../../../../components/oidc
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/default/techdocs/app
  postBuild:
    substitute:
      APP: *app
      OIDC_DESCRIPTION: How the homelab is built and run
      OIDC_HOST: wiki.f9.casa
      OIDC_TITLE: Technical docs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
