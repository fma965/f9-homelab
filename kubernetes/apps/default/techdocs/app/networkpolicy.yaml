# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# TechDocs / wiki (public behind the Pocket ID login). Allow-list from the manifests and the Cilium
# connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always
# allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: techdocs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: techdocs
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # The builder clones and refreshes the private docs repository over SSH (read-only deploy key)
    # every five minutes.
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
