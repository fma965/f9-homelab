server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Admin-only: the gateway lets only the Pocket ID `admins` group through before requests reach here
    location / {
        root /site/current;
        index index.html;
    }

    error_page 404 /404.html;
}
