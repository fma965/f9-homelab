---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# FlareSolverr (headless browser that solves Cloudflare challenges for Prowlarr). Egress only (M15,
# 15 Oct 2026): it fetches whatever page an indexer asks for, so it may reach the public web on 80
# and 443 and nothing on the home network or in the cluster. Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flaresolverr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  # Access to the public web (egress.cilium.io/web) comes from the profile label(s) on the pod, set in the HelmRelease.
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
