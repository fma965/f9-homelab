---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/ext-auth
  dependsOn:
    - name: mosquitto
    - name: cloudnative-pg
      namespace: database
    - name: multus-networks
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  # Keep these out of Kopiur snapshots (regenerable or redundant). Setting
  # ignoreRules replaces Kopiur's default list, so /lost+found is re-added.
  patches:
    - target:
        group: kopiur.home-operations.com
        kind: SnapshotPolicy
      patch: |-
        - op: add
          path: /spec/files
          value:
            ignoreRules:
              - /lost+found
              - /backups # HA backup tarballs (~800 MB); Kopiur already backs up /config
              - /.code-server # editor extensions, regenerable
              - /.cache # regenerable cache
              - home-assistant.log* # logs
  path: ./kubernetes/apps/default/home-assistant/app
  postBuild:
    substitute:
      APP: home-assistant
      EXT_AUTH_TARGET: home-assistant-code
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
