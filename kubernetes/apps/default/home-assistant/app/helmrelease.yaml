---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"iot",
                "namespace": "kube-system",
                "mac": "f2:f9:00:00:20:02",
                "ips": ["10.10.20.240/24"]
              },
              {
                "name": "not",
                "namespace": "kube-system",
                "mac": "f2:f9:00:00:30:02",
                "ips": ["10.10.30.240/24"]
              },
              {
                "name": "media",
                "namespace": "kube-system",
                "mac": "f2:f9:00:00:40:02",
                "ips": ["10.10.40.240/24"]
              }]
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: home-assistant-secret
          # fix-permissions:
          #   image:
          #     repository: busybox
          #     tag: latest
          #   command: ["sh", "-c", "chown -R 1000:1000 /config"]
          #   securityContext:
          #     runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.2@sha256:a582f4b113e3018517a5ae9727b873e262aa787fa97f07b97b71bfc57f14d470
            env:
              # The Pocket ID client for auth_oidc, read through `!env_var` in /config/secrets.yaml. The discovery URL
              # (https://id.f9.casa/.well-known/openid-configuration) and roles are in /config/configuration.yaml.
              HOMEASSISTANT_OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-credentials
                    key: client_id
              HOMEASSISTANT_OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-oidc-credentials
                    key: client_secret
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8123
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
          matter-hub:
            image:
              repository: ghcr.io/riddix/home-assistant-matter-hub
              tag: 2.0.59@sha256:ef997a84c088ac89e57f9cde0fb6fd18447da0a3c8cc9466c4232ba5a15bd9d7
            env:
              HAMH_STORAGE_LOCATION: /config/matter-hub
              HAMH_HOME_ASSISTANT_URL: http://localhost:8123/
              HAMH_LOG_LEVEL: info
              HAMH_HTTP_PORT: "8482"
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
            args:
              - --auth
              - none
              - --disable-telemetry
              - --disable-update-check
              - --user-data-dir
              - /config/.code-server
              - --extensions-dir
              - /config/.code-server
              - --port
              - "12321"
              - /config
            env:
              HASS_SERVER: http://localhost:8123
              HASS_TOKEN:
                secretKeyRef:
                  name: home-assistant-secret
                  key: HASS_TOKEN
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 1Gi

    defaultPodOptions:
      labels:
        egress.cilium.io/internet: "true"
        egress.cilium.io/nas: "true"
        egress.cilium.io/unifi: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # hostNetwork: true
    service:
      app:
        primary: true
        type: LoadBalancer
        sessionAffinity: ClientIP
        annotations:
          lbipam.cilium.io/ips: 10.10.69.240
        ports:
          http:
            port: 8123
      matter-hub:
        ports:
          http:
            port: 8482
      code-server:
        ports:
          code-server:
            port: 12321
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/description: "Smart home: lights, heating, cameras and automations"
          gethomepage.dev/icon: home-assistant
          gethomepage.dev/app: home-assistant
          gethomepage.dev/widget.type: homeassistant
          gethomepage.dev/widget.url: http://home-assistant-app.default:8123
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}` }}"

          #         custom:
        #           - state: sensor.octopus_energy_electricity_23j0526219_2200022542963_current_accumulative_consumption
        #             label: Energy Usage Today
        #           - state: sensor.octopus_energy_electricity_23j0526219_2200022542963_current_accumulative_cost
        #             label: Energy Cost Today
        hostnames:
          - home.f9.casa
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8123

      # The resulting HTTPRoutes are named home-assistant-code and home-assistant-matter. Each is a whole hostname, so the
      # Pocket ID login (oidc-code.yaml) can return to /oauth2/callback on it.
      code:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Home Assistant Code Server
          gethomepage.dev/description: "Edit Home Assistant config files (admin)"
          gethomepage.dev/group: Dev Tools
          gethomepage.dev/icon: code-server
          gethomepage.dev/pod-selector: app.kubernetes.io/name=home-assistant
        enabled: true
        hostnames:
          - ha-code.f9.casa
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: code-server
                port: 12321

      matter:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
        hostnames:
          - matter-hub.f9.casa
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: matter-hub
                port: 8482

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          home-assistant:
            app:
              - path: /config
            code-server:
              - path: /config
            matter-hub:
              - path: /config
            fix-permissions:
              - path: /config
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/.venv
      tmpfs:
        type: emptyDir
        advancedMounts:
          home-assistant:
            app:
              - path: /config/logs
                subPath: logs
              - path: /config/tts
                subPath: tts
              - path: /tmp
                subPath: tmp
              - path: /media
                subPath: media
            code-server:
              - path: /tmp
                subPath: code-server-tmp
              - path: /nonexistent
                subPath: nonexistent
