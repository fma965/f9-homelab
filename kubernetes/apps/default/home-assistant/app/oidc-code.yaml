---
# The Pocket ID login in front of the two admin tools on their own hostnames: the code-server for the Home Assistant
# config and the Matter hub. Written out here, not with the oidc component, because that component names its client
# after the Flux Kustomization's APP (home-assistant, which is Home Assistant's own sign-in client in oidcclient.yaml)
# and one Kustomization can use it once. Only the `admins` group gets a token.
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: ha-code
spec:
  allowedUserGroups:
    - groupName: admins
  callbackUrls:
    - https://ha-code.f9.casa/oauth2/callback
  clientID: ha-code
  description: Edit the Home Assistant config files
  launchUrl: https://ha-code.f9.casa/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/code-server.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/code-server.webp
  name: Home Assistant Code
  secret:
    keys:
      clientSecret: client-secret
  skipConsent: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ha-code
spec:
  oidc:
    provider:
      issuer: https://id.f9.casa
      authorizationEndpoint: https://id.f9.casa/authorize
      tokenEndpoint: https://id.f9.casa/api/oidc/token
      endSessionEndpoint: https://id.f9.casa/api/oidc/end-session
    clientID: ha-code
    clientSecret:
      name: ha-code-oidc-credentials
    redirectURL: https://ha-code.f9.casa/oauth2/callback
    logoutPath: /logout
    refreshToken: true
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant-code
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: matter-hub
spec:
  allowedUserGroups:
    - groupName: admins
  callbackUrls:
    - https://matter-hub.f9.casa/oauth2/callback
  clientID: matter-hub
  description: Matter bridge for Home Assistant
  launchUrl: https://matter-hub.f9.casa/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/matter-light.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/matter.webp
  name: Matter Hub
  secret:
    keys:
      clientSecret: client-secret
  skipConsent: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: matter-hub
spec:
  oidc:
    provider:
      issuer: https://id.f9.casa
      authorizationEndpoint: https://id.f9.casa/authorize
      tokenEndpoint: https://id.f9.casa/api/oidc/token
      endSessionEndpoint: https://id.f9.casa/api/oidc/end-session
    clientID: matter-hub
    clientSecret:
      name: matter-hub-oidc-credentials
    redirectURL: https://matter-hub.f9.casa/oauth2/callback
    logoutPath: /logout
    refreshToken: true
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant-matter
