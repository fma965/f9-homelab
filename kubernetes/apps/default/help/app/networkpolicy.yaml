# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Help site (housemate guides, public). Allow-list from the manifests and the Cilium connection
# table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: help
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: help
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # The builder clones and refreshes the guides from the public repository over HTTPS every
    # five minutes (a refresh fails quietly and keeps the current site, so it is not seen in a short
    # capture).
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
