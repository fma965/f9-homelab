server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The technical docs moved to https://wiki.f9.casa/
    location /technical/ {
        return 301 https://wiki.f9.casa/;
    }

    location / {
        root /site/guides;
        index index.html;
    }

    error_page 404 /404.html;
}
