server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Admin-only technical docs (Authelia denies this path for non-admins)
    location /technical/ {
        alias /site/technical/;
        index index.html;
    }

    location / {
        root /site/guides;
        index index.html;
    }

    error_page 404 /404.html;
}
