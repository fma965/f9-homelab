---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: help-config
    files:
      - ./resources/builder.sh
      - ./resources/nginx.conf
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
