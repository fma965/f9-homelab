---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# SABnzbd (Usenet downloader). Egress only (M15, 15 Oct 2026): it holds the Usenet account logins, so
# it may reach DNS, the seven news servers it is configured with (all SSL on 563). The release check is switched off (Renovate manages the image).
# Taken from /config/sabnzbd.ini (host and port lines only). Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sabnzbd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sabnzbd
  egress:
    - toFQDNs:
        - matchName: eunews.frugalusenet.com
        - matchName: news.usenetfarm.eu
        - matchName: news.bulknews.eu
        - matchName: news.frugalusenet.com
        - matchName: bonus.frugalusenet.com
        - matchName: eunews.blocknews.net
        - matchName: news.tweaknews.eu
      toPorts:
        - ports:
            - port: "563"
              protocol: TCP
