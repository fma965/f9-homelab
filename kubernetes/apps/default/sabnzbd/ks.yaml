---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/oidc
    - ../../../../components/zeroscaler
  dependsOn:
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/default/sabnzbd/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      OIDC_DESCRIPTION: Usenet downloads
      OIDC_GROUP: downloads
      OIDC_ICON: sabnzbd
      OIDC_ICON_DARK: sabnzbd-light
      OIDC_TARGET: sabnzbd-app
      OIDC_TITLE: SABnzbd
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
