---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Prowlarr (indexer manager). Egress only (M15, 15 Oct 2026): it holds the API keys of Sonarr and
# Radarr and the indexer logins, so it may reach the cluster and the public web on 80 and 443, and
# nothing on the home network. The indexer sites change as indexers are added (deedee-ops pins nine
# hosts; here the web is open on 80 / 443 so a new indexer does not need a policy change). Ingress is
# not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  # Access to the public web (egress.cilium.io/web) comes from the profile label(s) on the pod, set in the HelmRelease.
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The other apps in the stack (Postgres, the download clients, Prowlarr, Jellyfin, ...), which
    # are Services in the cluster and change as the stack does.
    - toEntities:
        - cluster
