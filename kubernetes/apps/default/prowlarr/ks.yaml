---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app prowlarr
spec:
  components:
    - ../../../../components/oidc
    - ../../../../components/zeroscaler
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: pocket-id
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/default/prowlarr/app
  postBuild:
    substitute:
      APP: *app
      OIDC_DESCRIPTION: Indexer search for the download apps
      OIDC_GROUP: media
      OIDC_ICON: prowlarr
      OIDC_TARGET: prowlarr-app
      OIDC_TITLE: Prowlarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
