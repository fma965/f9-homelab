# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Jellyfin (media server, public, LDAP login against LLDAP). Allow-list from the manifests and
# the Cilium connection table on 15 Oct 2026 (M15). Probes come from the local node, which
# Cilium always allows. Egress (M15): DNS, LLDAP and a list of named internet hosts only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Home Assistant's Jellyfin integration (seen in the connection table).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Homepage's widget (a Service call to this app).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Sonarr and Radarr tell Jellyfin to update its library after an import (their Jellyfin notification).
    # Their own policies only limit egress and already allow the cluster; this is the Jellyfin side.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Tracearr polls Jellyfin's API for sessions and users (jellyfin.default.svc:8096).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: tracearr
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Replies to the app's own connections, which go through Services (kube-dns, lldap).
    # Cilium evaluates the reverse-translated reply as new traffic to this pod and drops it
    # without these rules ("Policy denied DROPPED" in Hubble). The destination is the pod's
    # ephemeral source port, so no port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: lldap
  egress:
    # LLDAP, for the LDAP Authentication plugin (lldap.default.svc).
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: lldap
      toPorts:
        - ports:
            - port: "389"
              protocol: TCP
    # Internet hosts Jellyfin needs, by name (443 only). Seeded from deedee-ops/home-ops and
    # checked against this install's plugins (Intro Skipper, LDAP Authentication, Trakt). If
    # a feature stops working (missing posters, a plugin that will not install, Trakt not
    # syncing), look for the denied name in Hubble and add it here. The media itself is an
    # NFS mount done by the node, so it needs no rule.
    - toFQDNs:
        # Jellyfin updates, plugin catalogue and downloads
        - matchName: repo.jellyfin.org
        - matchPattern: "*.mirror.jellyfin.org"
        # Metadata and artwork providers
        - matchName: api.themoviedb.org
        - matchName: image.tmdb.org
        - matchPattern: "*.thetvdb.com"
        - matchName: assets.fanart.tv
        - matchName: webservice.fanart.tv
        - matchName: www.omdbapi.com
        - matchName: m.media-amazon.com
        # Intro Skipper plugin (manifest and release downloads)
        - matchName: intro-skipper.org
        - matchName: github.com
        - matchName: raw.githubusercontent.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
        - matchName: cdn.jsdelivr.net
        # Trakt plugin
        - matchName: api.trakt.tv
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
