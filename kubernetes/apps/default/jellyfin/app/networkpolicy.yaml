# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Jellyfin (media server, public, LDAP login against LLDAP). Allow-list from the manifests and
# the Cilium connection table on 15 Oct 2026 (M15). Probes come from the local node, which
# Cilium always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Home Assistant's Jellyfin integration (seen in the connection table).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Homepage's widget (a Service call to this app).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Replies to the app's own connections, which go through Services (kube-dns, lldap).
    # Cilium evaluates the reverse-translated reply as new traffic to this pod and drops it
    # without these rules ("Policy denied DROPPED" in Hubble). The destination is the pod's
    # ephemeral source port, so no port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: lldap
