# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Authelia is the login for every protected route, so it should only be reachable by the Envoy
# gateways (the login route itself and the ext-authz checks both come from the gateway pods) and
# by Prometheus (metrics). Nothing else in the cluster calls it: apps reach it through auth.f9.casa,
# which is the gateway. Probes come from the local node, which Cilium always allows.
# Allow-list taken from the Cilium connection table and the manifests on 15 Oct 2026 (M15).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authelia
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Replies to Authelia's own connections. Each of these is reached through a Service (kube-dns,
    # lldap, dragonfly, postgres-rw, smtp-relay), so the reply arrives reverse-translated and Cilium
    # evaluates it as a new connection to this pod: without these rules it is dropped ("Policy
    # denied DROPPED" in Hubble). The destination of a reply is Authelia's ephemeral source port, so
    # no port can be listed. The Cilium table showed replies from the dns, lldap, dragonfly and
    # postgres Services; smtp-relay is used only for mail.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: lldap
        - matchLabels:
            io.kubernetes.pod.namespace: database
            app: dragonfly
        - matchLabels:
            io.kubernetes.pod.namespace: database
            cnpg.io/cluster: postgres17
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: smtp-relay
