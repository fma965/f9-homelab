---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# qBittorrent. Egress only (M15, 16 Oct 2026): deny-all on the pod's cluster interface (eth0). Its internet
# traffic goes out through the VPN (Multus interface `net1`: the routes send everything except a few ranges
# there), which Cilium does not see; nothing was seen on eth0 in a capture. Denying eth0 also means a VPN
# drop cannot fall back to the node's default route and leak the real address. DNS comes from allow-dns.
# Ingress is not limited here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  egress:
    - {}
