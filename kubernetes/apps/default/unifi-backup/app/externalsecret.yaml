---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-backup
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-backup-secret
    template:
      data:
        # Existing UniFi API key in the `unifi` item (also used by Homepage and unifi-dns). The key must
        # belong to an account that may create and download backups.
        UNIFI_API_KEY: "{{ .UNIFI_API_KEY }}"
        # Healthchecks.io ping id (the UUID in the ping URL). Optional: add `UNIFI_BACKUP_HEALTHCHECKS_ID`
        # to the `unifi` item to turn the pings on.
        HEALTHCHECKS_ID: '{{ index . "UNIFI_BACKUP_HEALTHCHECKS_ID" | default "" }}'
  dataFrom:
    - extract:
        key: unifi
