---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-backup
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-backup-secret
    template:
      data:
        # UniFi API key (Network > Settings > Control Plane > Integrations), created by an account
        # that may download backups. Separate from the MCP credentials.
        UNIFI_API_KEY: "{{ .api_key }}"
        # Healthchecks.io ping id (the UUID in the ping URL); optional, may be empty.
        HEALTHCHECKS_ID: "{{ .healthchecks_id }}"
  dataFrom:
    - extract:
        key: unifi-backup
