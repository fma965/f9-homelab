---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom: &envFrom
              - secretRef:
                  name: sonarr-secret
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2742@sha256:491f13c731083c1e3a5eb707750ad61f0052a5a6c12b37f6f524eaa35664915d
            env:
              TZ: Europe/London
              SONARR__APP__INSTANCENAME: sonarr
              SONARR__APP__THEME: dark
              # Sonarr signs people in itself with Pocket ID (id.f9.casa); the route has no gateway login in front. It lets
              # exactly one identity in: the `sub` of the owner's Pocket ID user (SONARR__AUTH__OIDCUSERIDENTIFIER, from
              # the secret). Callers of /api (Prowlarr, Seerr, Recyclarr, Homepage) still use the API key.
              SONARR__AUTH__METHOD: Oidc
              SONARR__AUTH__OIDCAUTHORITY: https://id.f9.casa
              SONARR__AUTH__OIDCCLIENTID: sonarr
              SONARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-oidc-credentials
                    key: client_secret
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__LOG__CONSOLEFORMAT: Clef
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: &port 80
              # Trust the gateway's X-Forwarded-Proto, so the callback URL Sonarr builds is https (the pod network).
              SONARR__SERVER__TRUSTEDNETWORKS: 10.42.0.0/16
              SONARR__UPDATE__BRANCH: develop
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    defaultPodOptions:
      labels:
        # The OIDC discovery and token calls go to id.f9.casa, which resolves to the external gateway in the cluster.
        egress.cilium.io/gateway-external: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads Service
          gethomepage.dev/name: Sonarr
          gethomepage.dev/icon: sonarr
          gethomepage.dev/description: "TV show downloads (admin)"
          gethomepage.dev/widget.type: sonarr
          gethomepage.dev/widget.url: http://sonarr.default
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_SONARR_KEY}}` }}"
        hostnames:
          - "{{ .Release.Name }}.f9.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      scripts:
        type: configMap
        name: sonarr-configmap
        defaultMode: 0775
        globalMounts:
          - readOnly: true
      media:
        type: nfs
        server: nas.homelab.internal
        path: "/mnt/Media/Library/TV Shows"
        globalMounts:
          - path: /tv
      downloads:
        type: nfs
        server: nas.homelab.internal
        path: /mnt/Media/Library/Downloads
        globalMounts:
          - path: /downloads
      tmp:
        type: emptyDir
