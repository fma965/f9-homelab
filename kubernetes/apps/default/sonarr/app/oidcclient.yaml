---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
# The Pocket ID client for Sonarr's own OIDC login. The operator writes the Secret `sonarr-oidc-credentials`
# (`client_secret`, which the HelmRelease reads). The callback paths are ASP.NET's defaults. Sonarr then lets in
# only the one user named in SONARR__AUTH__OIDCUSERIDENTIFIER, whatever the group.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sonarr
spec:
  allowedUserGroups:
    - groupName: admins
  callbackUrls:
    - https://sonarr.f9.casa/signin-oidc
  clientID: sonarr
  launchUrl: https://sonarr.f9.casa/
  logoutCallbackUrls:
    - https://sonarr.f9.casa/signout-callback-oidc
  pkceEnabled: true
  skipConsent: true
