# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Seerr (media requests, public). Allow-list from the manifests and the Cilium connection table
# on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always allows.
# Egress (M15): DNS, Radarr, Sonarr, the gateway (for Jellyfin) and a list of named internet hosts.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seerr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Tracearr reads request data from Seerr's API (seerr.default.svc:80).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: tracearr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # The app calls auth.f9.casa (OIDC) and other public names, which resolve to the
    # gateway, so the gateway pods reply from their own listener port to this pod's
    # ephemeral port; the reply is evaluated as new traffic. No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    # Replies to the app's own connections, which go through Services (kube-dns, radarr,
    # sonarr, jellyfin). Cilium evaluates the reverse-translated reply as new traffic to
    # this pod and drops it without these rules ("Policy denied DROPPED" in Hubble). The
    # destination is the pod's ephemeral source port, so no port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: sonarr
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: jellyfin
  egress:
    # Radarr and Sonarr, configured in Seerr as "radarr" and "sonarr" on port 80.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Internet hosts Seerr needs, by name (443 only): TMDB for metadata and images, GitHub
    # for the update check and the anime list, and the services it uses for IMDb and Rotten
    # Tomatoes ratings. Seerr is set to use TMDB for TV and anime metadata, and its
    # notification agents are all disabled. If a feature stops working (missing ratings, no
    # metadata), look for the denied name in Hubble and add it here.
    - toFQDNs:
        - matchName: api.themoviedb.org
        - matchName: image.tmdb.org
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
        - matchName: api.radarr.video
        - matchName: 79frdp12pn-dsn.algolia.net
        # Avatars: Seerr's avatar proxy fetches user pictures from Gravatar server-side
        - matchName: gravatar.com
        - matchPattern: "*.gravatar.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
