---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openwebui
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  # Keep these out of Kopiur snapshots (regenerable or redundant). Setting
  # ignoreRules replaces Kopiur's default list, so /lost+found is re-added.
  patches:
    - target:
        group: kopiur.home-operations.com
        kind: SnapshotPolicy
      patch: |-
        - op: add
          path: /spec/files
          value:
            ignoreRules:
              - /lost+found
              - /cache/embedding # downloaded embedding model (~890 MB), re-fetched on first use
  path: ./kubernetes/apps/default/openwebui/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
