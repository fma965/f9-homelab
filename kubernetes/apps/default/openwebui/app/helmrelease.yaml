---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openwebui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openwebui
  values:
    controllers:
      openwebui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
            env:
              WEBUI_URL: https://ai.f9.casa
              # The LiteLLM gateway (ai namespace); chat goes through it, with the key in the Secret openwebui-litellm. Open
              # WebUI keeps its connection in its database once it has started, so these only apply to a fresh database
              # (the key is then set in Admin Settings > Connections).
              OPENAI_API_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              OPENAI_API_CONFIGS: '{"0": {"enable": true, "tags": [], "prefix_id": "", "model_ids": [], "connection_type": "external", "auth_type": "bearer"}}'
              OAUTH_PROVIDER_NAME: "Home"
              # Sign-in through Pocket ID (id.f9.casa). Its groups claim carries the group names (`admins`, `openwebui`).
              OAUTH_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: openwebui-oidc-credentials
                    key: client_id
              OAUTH_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: openwebui-oidc-credentials
                    key: client_secret
              OPENID_PROVIDER_URL: "https://id.f9.casa/.well-known/openid-configuration"
              TZ: "Europe/London"
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
              OAUTH_SCOPES: "openid email profile groups"
              ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
              OAUTH_ALLOWED_ROLES: openwebui,admins
              OAUTH_ADMIN_ROLES: admins
              OAUTH_ROLES_CLAIM: groups
              ENABLE_LOGIN_FORM: "false"
              DEFAULT_USER_ROLE: "user"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: false
    defaultPodOptions:
      labels:
        egress.cilium.io/gateway-external: "true"
        egress.cilium.io/web: "true"

    service:
      app:
        ports:
          http:
            port: &port 8080

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/description: "AI chat assistant"
          gethomepage.dev/icon: open-webui
        hostnames: ["ai.f9.casa"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
