---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmteam_v1alpha1.json
# Open WebUI's team and key on the LiteLLM gateway (ai namespace). The operator creates both through the proxy's
# admin API and writes the key into the Secret `openwebui-litellm` (key `key`) in this namespace.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: openwebui
spec:
  alias: openwebui
  # All eight MCP servers, by the owner's decision. Open WebUI's connections to them are added in its admin UI
  # (Integrations > External Tool Servers), one per server, with this key as the bearer token. Home Assistant is
  # read-write (it can operate locks), TrueNAS has writes on, and UniFi asks for confirmation before writes; limit who
  # sees those connections in Open WebUI.
  mcpServers:
    - flux
    - grafana
    - home_assistant
    - kubernetes
    - paperless
    - truenas
    - unifi_network
    - victoria_logs
  models:
    - gemma-4-12b-ha
  proxyNamespace: ai
  proxyRef: litellm
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: openwebui
spec:
  keyAlias: openwebui
  models:
    - gemma-4-12b-ha
  proxyNamespace: ai
  proxyRef: litellm
  secretName: openwebui-litellm
  teamID: openwebui
