---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app openwebui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openwebui-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Signs Open WebUI's login tokens and encrypts its stored OAuth sessions. Unset, the image writes a
        # new random key into the container filesystem on every start, so each restart logged everyone out.
        WEBUI_SECRET_KEY: "{{ .WEBUI_SECRET_KEY }}"
        # The chat connection's key on the Agent Gateway (applies to a fresh database only, see the HelmRelease).
        OPENAI_API_KEY: "{{ .OPENWEBUI_API_KEY }}"
  data:
    - secretKey: OPENWEBUI_API_KEY
      remoteRef:
        key: agentgateway
        property: OPENWEBUI_API_KEY
  dataFrom:
    - extract:
        key: openwebui
