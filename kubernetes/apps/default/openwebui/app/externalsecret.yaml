---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app openwebui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openwebui-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .API_KEY }}"
        # Signs Open WebUI's login tokens and encrypts its stored OAuth sessions. Unset, the image writes a
        # new random key into the container filesystem on every start, so each restart logged everyone out.
        WEBUI_SECRET_KEY: "{{ .WEBUI_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: authelia
    - extract:
        key: llamacpp
    - extract:
        key: openwebui
