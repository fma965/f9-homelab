---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Open WebUI (AI chat, public, OIDC login). Allow-list from the manifests and the Cilium
# connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always
# allows. Egress (15 Oct 2026): DNS, the gateway (OIDC) and the public internet on 80/443; since 31 Oct 2026 also the
# LiteLLM gateway on 4000, which replaced the direct connection to the llama server on the NAS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openwebui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The app calls id.f9.casa (OIDC) and other public names, which resolve to the
    # gateway, so the gateway pods reply from their own listener port to this pod's
    # ephemeral port; the reply is evaluated as new traffic. No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    # Open WebUI calls LiteLLM through its Service, so LiteLLM's replies come back as new traffic to this pod
    # (from the LiteLLM pod to this pod's ephemeral port). No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: litellm
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
