---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Open WebUI (AI chat, public, OIDC login). Allow-list from the manifests and the Cilium
# connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always
# allows. Egress (15 Oct 2026): DNS, the gateway (OIDC) and the public internet on 80/443; since 21 Nov 2026 also the
# Agent Gateway, on 8080 for chat and 8081 for the MCP tool connections (it replaced LiteLLM, which was removed on
# 22 Nov 2026).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openwebui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The app calls id.f9.casa (OIDC) and other public names, which resolve to the
    # gateway, so the gateway pods reply from their own listener port to this pod's
    # ephemeral port; the reply is evaluated as new traffic. No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    # Open WebUI calls the Agent Gateway through its Service (chat on 8080, MCP tools on 8081), so the gateway's replies
    # come back as new traffic to this pod (from the gateway pod to this pod's ephemeral port). No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: agentgateway
            app.kubernetes.io/name: agentgateway
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/instance: agentgateway
            app.kubernetes.io/name: agentgateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            # The MCP tool connections (admin UI > External Tool Servers): the gateway's MCP listener.
            - port: "8081"
              protocol: TCP
