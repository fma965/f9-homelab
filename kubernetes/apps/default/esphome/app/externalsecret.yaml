---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: esphome-secret
    template:
      data:
        secrets.yaml: |-
          {{- range $k, $v := . }}
          {{- if not (or (eq $k "notesPlain") (eq $k "password")) }}
          {{ $k | trimPrefix "ESPHOME_" | lower }}: "{{ $v }}"
          {{- end }}
          {{- end }}
          domain_devices: .not.internal
  dataFrom:
    - extract:
        key: esphome
