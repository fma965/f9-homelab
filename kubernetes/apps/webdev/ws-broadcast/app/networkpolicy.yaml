# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# WebSocket broadcaster for the games manager (public). Allow-list from the manifests and the
# Cilium connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium
# always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ws-broadcast
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ws-broadcast
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "13370"
              protocol: TCP
  # Egress: a static app with no outbound calls, so DNS is all it may reach.
  egress:
    # Deny all egress (default-deny). DNS (allow-dns) and the egress.cilium.io profile labels add
    # what the pod needs.
    - {}
