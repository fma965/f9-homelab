---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Games manager (Directus backend and frontend, public, OIDC login). Allow-list from the
# manifests and the Cilium connection table on 15 Oct 2026 (M15). Probes come from the local
# node, which Cilium always allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: games-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: games-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8055"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # The app calls id.f9.casa (OIDC) and other public names, which resolve to the
    # gateway, so the gateway pods reply from their own listener port to this pod's
    # ephemeral port; the reply is evaluated as new traffic. No port can be listed.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
  egress:
    # Directus 12 validates LICENSE_KEY online. Blocked, it logs "License refresh failed ... connect
    # ETIMEDOUT" and falls back to the Core tier, which has no SSO, so the admin is held on the license
    # page (found 22 Oct 2026; name from the Cilium FQDN cache). telemetry.directus.io (same address) and
    # registry.npmjs.org (the extension marketplace) stay blocked: Directus works without them.
    - toFQDNs:
        - matchName: licensing.directus.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
