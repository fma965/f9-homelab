---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app games-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: debtmanager
  values:
    controllers:
      debtmanager:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          backend:
            image:
              repository: directus/directus
              tag: 12.6.0@sha256:5a475c31cf547da604b3ef1bd85097145825ca6aab8841dc784bb08eaa21681b
            env:
              # Sign-in through Pocket ID (id.f9.casa). The provider keeps the name `authentik` and users are matched
              # by email, so existing accounts carry over. These override the old Authelia values in the secret.
              AUTH_AUTHENTIK_ALLOW_PUBLIC_REGISTRATION: "true"
              AUTH_AUTHENTIK_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: games-manager-oidc-credentials
                    key: client_id
              AUTH_AUTHENTIK_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: games-manager-oidc-credentials
                    key: client_secret
              AUTH_AUTHENTIK_DRIVER: "openid"
              AUTH_AUTHENTIK_IDENTIFIER_KEY: "email"
              AUTH_AUTHENTIK_ISSUER_URL: "https://id.f9.casa/.well-known/openid-configuration"
              AUTH_AUTHENTIK_LABEL: "F9 Auth"
              AUTH_DISABLE_DEFAULT: "true"
              AUTH_PROVIDERS: "authentik"
              CACHE_AUTO_PURGE: "true"
              CACHE_ENABLED: "false"
              CACHE_STORE: "redis"
              DB_CLIENT: "postgres"
              DB_DATABASE: "games"
              DB_HOST: "postgres-rw.database.svc.cluster.local"
              DB_PORT: "5432"
              DB_USER: "games"
              EMAIL_FROM: "gamemanager@f9.casa"
              EMAIL_SMTP_HOST: "smtp-relay.network.svc.cluster.local"
              EMAIL_SMTP_PORT: "25"
              EMAIL_TRANSPORT: "smtp"
              EXTENSIONS_PATH: "/directus/extensions"
              IP_TRUST_PROXY: "true"
              PORT: "8055"
              PUBLIC_URL: "https://gamesdb.f9.casa"
              REDIS_HOST: "dragonfly.database.svc.cluster.local"
              REDIS_PORT: "6379"
              STORAGE_LOCATIONS: "s3"
              STORAGE_S3_DRIVER: "s3"
              STORAGE_S3_KEY: "GK242cc9d55149cdda6a1a465c"
              STORAGE_S3_BUCKET: "${external.f9.casa//./-}-games-manager-backend"
              STORAGE_S3_REGION: "eu-west-2"
              STORAGE_S3_ENDPOINT: "s3.f9.casa"
            envFrom: &envFrom
              - secretRef:
                  name: games-manager-secret
            #            securityContext:
            #              allowPrivilegeEscalation: false
            #              readOnlyRootFilesystem: true
            #              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

          frontend:
            image:
              repository: ghcr.io/fma965/games-manager-frontend
              tag: v2.0.3@sha256:cd25d7a15899043934a14e4a08bae4e4c3bbb323c47369a1b4467f6246c866fd
            env:
              APP_HOST: "https://games.f9.casa"
              APP_BACKEND: "https://gamesdb.f9.casa"
              #DEBUG: true
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              #              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

    defaultPodOptions:
      labels:
        egress.cilium.io/dragonfly: "true"
        egress.cilium.io/gateway-external: "true"
        egress.cilium.io/postgres: "true"
        egress.cilium.io/smtp-relay: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      backend:
        ports:
          web:
            port: 8055
      frontend:
        ports:
          api:
            port: 8080

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Web Projects
          gethomepage.dev/name: Games DB
          gethomepage.dev/description: "Games database admin (admin)"
          gethomepage.dev/icon: directus
          gethomepage.dev/pod-selector: app.kubernetes.io/name=games-manager
        hostnames:
          - "gamesdb.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: games-manager-backend
                port: 8055
      api:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,426,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Web Projects
          gethomepage.dev/name: Games Manager
          gethomepage.dev/description: "Game collection tracker"
          gethomepage.dev/icon: mdi-controller
          gethomepage.dev/pod-selector: app.kubernetes.io/name=games-manager
        hostnames:
          - "games.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /ws
            backendRefs:
              - name: ws-broadcast
                port: 13370
          - backendRefs:
              - name: games-manager-frontend
                port: 8080
