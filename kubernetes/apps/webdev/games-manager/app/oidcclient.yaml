---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/main/dist/schemas/pocketidoidcclient_v1alpha1.json
# The Pocket ID client for the Directus backend's login (gamesdb.f9.casa). The operator writes the Secret
# `games-manager-oidc-credentials` (`client_id`, `client_secret`), which the HelmRelease reads. The callback keeps
# the provider name `authentik`: Directus stores each user's provider and external identifier (their email), so
# renaming it would orphan every existing account.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: games-manager
spec:
  callbackUrls:
    - https://gamesdb.f9.casa/auth/login/authentik/callback
  clientID: games-manager
  description: Find games you can play together
  launchUrl: https://gamesdb.f9.casa/
  logo:
    darkLogoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/steam.webp
    logoUrl: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/steam.webp
  name: Games Manager
  skipConsent: true
