---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app debtmanager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: debtmanager
  values:
    controllers:
      debtmanager:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/fma965/debt-manager
              tag: v2.0.2@sha256:9a0ee7e288b9b0790b93ad4d5e7d0180437e60363e5e9d9ba62fff33b6e5e8b5
            env:
              #DEBUG: true
              DB_TYPE: pgsql
              DB_HOST: postgres-rw.database.svc.cluster.local
              DB_USER: debtmanager
              DB_NAME: debtmanager
            envFrom:
              - secretRef:
                  name: debtmanager-secret
            securityContext:
              allowPrivilegeEscalation: false
              #              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              limits:
                memory: 1Gi
    defaultPodOptions:
      labels:
        egress.cilium.io/postgres: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          web:
            port: 8080
          api:
            port: 8081

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == any(200,401)"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Web Projects
          gethomepage.dev/name: Debt Manager
          gethomepage.dev/description: "Debt tracking app"
          gethomepage.dev/icon: mdi-cash-multiple
          gethomepage.dev/pod-selector: app.kubernetes.io/name=debtmanager
        hostnames:
          - "{{ .Release.Name }}.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: 8080
      api:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 403"]
        hostnames:
          - "api.f9.casa"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: 8081
