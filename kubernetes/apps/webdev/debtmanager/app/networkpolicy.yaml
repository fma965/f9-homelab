# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Debt manager (web app and API, public). Allow-list from the manifests and the Cilium
# connection table on 15 Oct 2026 (M15). Probes come from the local node, which Cilium always
# allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: debtmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: debtmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
  egress:
    # Discord: the login (OAuth token exchange) and the notification webhook. Taken from the app
    # source; a short capture does not see them.
    - toFQDNs:
        - matchName: discord.com
        - matchName: discordapp.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
